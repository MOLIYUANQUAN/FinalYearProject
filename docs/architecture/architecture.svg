<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
  <title>Personal AI Assistant — System Architecture (Baseline v1)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3b35"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #1c1a16; }
      .subtitle { font-size: 16px; fill: #5c574e; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.09em; }
      .h { font-size: 19px; font-weight: 700; fill: #1c1a16; }
      .h2 { font-size: 16px; font-weight: 700; fill: #1c1a16; }
      .path { font-size: 14px; font-weight: 500; fill: #6b665c; }
      .fn { font-size: 14px; font-weight: 700; fill: #1c1a16; }
      .fnbig { font-size: 15px; font-weight: 700; fill: #1c1a16; }
      .sig { font-size: 13px; fill: #6b665c; }
      .body { font-size: 15px; fill: #3a362f; }
      .small { font-size: 14px; fill: #4a463f; }
      .note { font-size: 13px; fill: #6b665c; }
      .lbl { font-size: 13px; font-weight: 500; fill: #3f3b35; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .node { font-size: 15px; font-weight: 600; fill: #1c1a16; }
      .flow { stroke: #3f3b35; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1400" fill="#ffffff"/>

  <!-- Title -->
  <text class="sans title" x="50" y="60">Personal AI Assistant — System Architecture</text>
  <text class="sans subtitle" x="50" y="88">Baseline v1 · one agent, three local tools, minimal web UI · Manchester CS Final Year Project · updated 31 Oct 2026</text>

  <!-- ============ CLIENT ============ -->
  <rect x="30" y="110" width="830" height="166" rx="14" fill="#eef4fb" stroke="#c6d8ee"/>
  <text class="sans tag" x="50" y="136" fill="#2f5f93">CLIENT</text>

  <rect x="50" y="152" width="380" height="110" rx="10" fill="#ffffff" stroke="#a9c3e3"/>
  <text class="sans h" x="70" y="182">Web chat UI</text>
  <text class="mono path" x="70" y="205">static/index.html</text>
  <text class="sans body" x="70" y="231">Browser chat page + 3 demo buttons;</text>
  <text class="sans body" x="70" y="252">shows the tool-call trace per reply</text>

  <rect x="460" y="152" width="380" height="110" rx="10" fill="#ffffff" stroke="#a9c3e3"/>
  <text class="sans h" x="480" y="182">CLI demo runner</text>
  <text class="mono path" x="480" y="205">scripts/demo_cli.py</text>
  <text class="sans body" x="480" y="231">Runs the 3 acceptance demos in order;</text>
  <text class="sans body" x="480" y="252">calls run_assistant() directly</text>

  <!-- ============ WEB SERVER ============ -->
  <rect x="30" y="316" width="830" height="224" rx="14" fill="#ecf5f1" stroke="#bfdcd1"/>
  <text class="sans tag" x="50" y="342" fill="#0f5c4c">WEB SERVER</text>

  <rect x="50" y="358" width="710" height="166" rx="10" fill="#ffffff" stroke="#9fcbbb"/>
  <text class="sans h" x="70" y="388">FastAPI app</text>
  <text class="mono path" x="70" y="411">src/main.py · uvicorn · 127.0.0.1:8765</text>

  <rect x="70" y="428" width="120" height="58" rx="8" fill="#f4faf7" stroke="#bfdcd1"/>
  <text class="mono fnbig" x="84" y="452">GET /</text>
  <text class="sans small" x="84" y="474">chat page</text>

  <rect x="202" y="428" width="214" height="58" rx="8" fill="#f4faf7" stroke="#bfdcd1"/>
  <text class="mono fnbig" x="216" y="452">GET /api/health</text>
  <text class="sans small" x="216" y="474">key status, mock dates</text>

  <rect x="428" y="428" width="312" height="58" rx="8" fill="#f4faf7" stroke="#bfdcd1"/>
  <text class="mono fnbig" x="442" y="452">POST /api/chat</text>
  <text class="mono sig" x="442" y="474" style="fill:#3a362f">{message} → {reply, tools_called}</text>

  <text class="sans note" x="70" y="510">On startup: warns if OPENAI_API_KEY is missing; /api/chat then returns 503</text>

  <!-- ============ AGENT ============ -->
  <rect x="30" y="580" width="830" height="356" rx="14" fill="#f3f0fa" stroke="#d5cbea"/>
  <text class="sans tag" x="50" y="606" fill="#5a3e8e">AGENT</text>

  <rect x="50" y="622" width="790" height="298" rx="10" fill="#ffffff" stroke="#c9bce6"/>
  <text class="sans h" x="70" y="652">Personal Assistant agent</text>
  <text class="mono path" x="70" y="675">src/agent.py</text>

  <text class="mono fn" x="70" y="708">build_instructions()</text>
  <text class="sans small" x="70" y="729">rules + fixed date: today = 2026-10-12</text>
  <text class="mono fn" x="70" y="760">create_assistant()</text>
  <text class="sans small" x="70" y="781">1 agent · 3 tools · gpt-4.1-mini · temp 0.2</text>
  <text class="mono fn" x="70" y="812">run_assistant(message)</text>
  <text class="sans small" x="70" y="833">Runner.run(agent, message, max_turns=8)</text>
  <text class="mono fn" x="70" y="864">extract_tool_names()</text>
  <text class="sans small" x="70" y="885">ordered tool-call trace for the UI</text>

  <!-- run_assistant -> Runner -->
  <line class="flow" x1="362" y1="820" x2="478" y2="820" marker-end="url(#arr)"/>

  <!-- Runner (agent loop) -->
  <rect x="480" y="690" width="340" height="214" rx="10" fill="#f8f6fd" stroke="#c9bce6"/>
  <text class="sans h2" x="500" y="716">OpenAI Agents SDK · Runner</text>
  <text class="sans note" x="500" y="737">the agent loop (tool calling)</text>

  <rect x="500" y="752" width="170" height="40" rx="8" fill="#ffffff" stroke="#9d88cc"/>
  <text class="sans node" x="585" y="777" text-anchor="middle">Model call</text>
  <rect x="500" y="836" width="170" height="40" rx="8" fill="#ffffff" stroke="#9d88cc"/>
  <text class="sans node" x="585" y="861" text-anchor="middle">Execute tool</text>

  <line class="flow" x1="560" y1="792" x2="560" y2="834" marker-end="url(#arr)"/>
  <line class="flow" x1="610" y1="836" x2="610" y2="794" marker-end="url(#arr)"/>
  <text class="sans note" x="553" y="818" text-anchor="end">call</text>
  <text class="sans note" x="618" y="818">result</text>

  <text class="sans note" x="690" y="830">loops until the</text>
  <text class="sans note" x="690" y="848">model gives a</text>
  <text class="sans note" x="690" y="866">final answer</text>
  <text class="sans note" x="690" y="884">(max 8 turns)</text>

  <!-- ============ TOOLS ============ -->
  <rect x="30" y="976" width="830" height="186" rx="14" fill="#fdf5e8" stroke="#ecd5ad"/>
  <text class="sans tag" x="50" y="1002" fill="#8a5a12">TOOLS</text>
  <text class="mono sig" x="118" y="1002">src/tools/ · @function_tool · ALL_TOOLS</text>

  <rect x="50" y="1018" width="253" height="128" rx="10" fill="#ffffff" stroke="#e3c48f"/>
  <text class="mono fnbig" x="68" y="1046">get_calendar_events</text>
  <text class="mono sig" x="68" y="1067">(date, time_of_day)</text>
  <text class="sans small" x="68" y="1093">Events for one day, filtered</text>
  <text class="sans small" x="68" y="1113">by morning/afternoon/evening</text>
  <text class="mono sig" x="68" y="1136">calendar.py</text>

  <rect x="318" y="1018" width="253" height="128" rx="10" fill="#ffffff" stroke="#e3c48f"/>
  <text class="mono fnbig" x="336" y="1046">search_files</text>
  <text class="mono sig" x="336" y="1067">(query)</text>
  <text class="sans small" x="336" y="1093">Keyword search over notes;</text>
  <text class="sans small" x="336" y="1113">returns path, title, snippet</text>
  <text class="mono sig" x="336" y="1136">files.py</text>

  <rect x="586" y="1018" width="253" height="128" rx="10" fill="#ffffff" stroke="#e3c48f"/>
  <text class="mono fnbig" x="604" y="1046">read_file</text>
  <text class="mono sig" x="604" y="1067">(path)</text>
  <text class="sans small" x="604" y="1093">Returns the full note text;</text>
  <text class="sans small" x="604" y="1113">path sandboxed to data/notes/</text>
  <text class="mono sig" x="604" y="1136">files.py</text>

  <!-- ============ DATA ============ -->
  <rect x="30" y="1202" width="830" height="148" rx="14" fill="#f3f3f1" stroke="#d9d9d4"/>
  <text class="sans tag" x="50" y="1228" fill="#55524b">LOCAL DATA</text>

  <rect x="50" y="1244" width="253" height="90" rx="10" fill="#ffffff" stroke="#c9c9c2"/>
  <text class="mono fnbig" x="68" y="1272">data/calendar.json</text>
  <text class="sans small" x="68" y="1296">4 mock events, e.g. FYP</text>
  <text class="sans small" x="68" y="1316">meeting 13 Oct, 14:00</text>

  <rect x="318" y="1244" width="521" height="90" rx="10" fill="#ffffff" stroke="#c9c9c2"/>
  <text class="mono fnbig" x="336" y="1272">data/notes/*.md</text>
  <text class="sans small" x="336" y="1296">fyp-proposal.md · meeting-notes.md</text>
  <text class="sans small" x="336" y="1316">Markdown notes that the file tools search and read</text>

  <!-- ============ RIGHT COLUMN: CONFIG ============ -->
  <text class="sans tag" x="890" y="136" fill="#55524b">CONFIGURATION</text>
  <rect x="890" y="152" width="280" height="384" rx="10" fill="#fafaf8" stroke="#d9d9d4"/>
  <text class="sans h" x="910" y="182">Config</text>
  <text class="mono path" x="910" y="205">src/config.py + .env</text>

  <text class="mono fn" x="910" y="238">OPENAI_API_KEY</text>
  <text class="sans small" x="910" y="258">required, read from .env</text>
  <text class="mono fn" x="910" y="290">OPENAI_MODEL</text>
  <text class="sans small" x="910" y="310">default gpt-4.1-mini</text>
  <text class="mono fn" x="910" y="342">MOCK_TODAY</text>
  <text class="sans small" x="910" y="362">2026-10-12 (fixed)</text>
  <text class="mono fn" x="910" y="394">MOCK_TOMORROW</text>
  <text class="sans small" x="910" y="414">2026-10-13</text>
  <text class="mono fn" x="910" y="446">Paths</text>
  <text class="sans small" x="910" y="466">data/, data/notes/, static/</text>
  <line x1="910" y1="482" x2="1150" y2="482" stroke="#e2e2dc"/>
  <text class="sans note" x="910" y="503">Fixed mock date keeps the</text>
  <text class="sans note" x="910" y="521">demos reproducible</text>

  <!-- ============ RIGHT COLUMN: EXTERNAL ============ -->
  <text class="sans tag" x="890" y="686" fill="#55524b">EXTERNAL SERVICE</text>
  <rect x="890" y="702" width="280" height="150" rx="10" fill="#ffffff" stroke="#8f8f8f" stroke-dasharray="6 4"/>
  <text class="sans h" x="910" y="732">OpenAI API</text>
  <text class="mono fn" x="910" y="757">gpt-4.1-mini</text>
  <text class="sans small" x="910" y="779">override with OPENAI_MODEL</text>
  <text class="sans small" x="910" y="809">The only cloud dependency;</text>
  <text class="sans small" x="910" y="829">needs OPENAI_API_KEY</text>

  <!-- ============ RIGHT COLUMN: ROADMAP ============ -->
  <text class="sans tag" x="890" y="962" fill="#55524b">ROADMAP &amp; SCOPE</text>
  <rect x="890" y="976" width="280" height="358" rx="10" fill="#fafaf8" stroke="#d9d9d4"/>
  <text class="sans h2" x="910" y="1004">Project phases</text>

  <rect x="910" y="1016" width="240" height="30" rx="15" fill="#0f5c4c"/>
  <text class="sans small" x="1030" y="1036" text-anchor="middle" style="fill:#ffffff;font-weight:600">Baseline · now (this diagram)</text>
  <line class="flow" x1="1030" y1="1047" x2="1030" y2="1058" marker-end="url(#arr)"/>
  <rect x="910" y="1060" width="240" height="30" rx="15" fill="#ffffff" stroke="#9bbfb3"/>
  <text class="sans small" x="1030" y="1080" text-anchor="middle" style="fill:#0f5c4c;font-weight:600">Application · real tools</text>
  <line class="flow" x1="1030" y1="1091" x2="1030" y2="1102" marker-end="url(#arr)"/>
  <rect x="910" y="1104" width="240" height="30" rx="15" fill="#ffffff" stroke="#9bbfb3"/>
  <text class="sans small" x="1030" y="1124" text-anchor="middle" style="fill:#0f5c4c;font-weight:600">Evaluation · system testing</text>

  <text class="sans h2" x="910" y="1168">Not in Baseline (yet)</text>
  <text class="sans small" x="910" y="1192">Long-term memory, database</text>
  <text class="sans small" x="910" y="1213">Multi-agent, MCP</text>
  <text class="sans small" x="910" y="1234">Real calendar / email (OAuth)</text>
  <text class="sans small" x="910" y="1255">Web search, browser use, voice</text>
  <text class="sans small" x="910" y="1276">Production deployment</text>
  <line x1="910" y1="1292" x2="1150" y2="1292" stroke="#e2e2dc"/>
  <text class="sans small" x="910" y="1316" style="fill:#0f5c4c;font-weight:600">Open: which real tool first?</text>

  <!-- ============ FLOWS ============ -->
  <!-- Web UI -> FastAPI -->
  <line class="flow" x1="240" y1="262" x2="240" y2="356" marker-end="url(#arr)"/>
  <text class="sans lbl" x="250" y="301">HTTP · JSON</text>

  <!-- CLI -> agent (bypasses HTTP) -->
  <line class="flow" x1="805" y1="262" x2="805" y2="620" marker-end="url(#arr)"/>
  <text class="sans lbl" x="790" y="440" text-anchor="middle" transform="rotate(-90 790 440)">direct Python call</text>

  <!-- FastAPI -> agent -->
  <line class="flow" x1="240" y1="524" x2="240" y2="620" marker-end="url(#arr)"/>
  <text class="mono lbl" x="250" y="564">await run_assistant(message)</text>

  <!-- Model call <-> OpenAI API -->
  <line class="flow" x1="672" y1="772" x2="888" y2="772" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="sans lbl" x="745" y="764" text-anchor="middle">HTTPS</text>

  <!-- Execute tool -> tools layer -->
  <line class="flow" x1="585" y1="876" x2="585" y2="974" marker-end="url(#arr)"/>
  <text class="sans lbl" x="595" y="961">JSON args in → JSON result out</text>

  <!-- tools -> data -->
  <line class="flow" x1="176" y1="1146" x2="176" y2="1242" marker-end="url(#arr)"/>
  <line class="flow" x1="444" y1="1146" x2="444" y2="1242" marker-end="url(#arr)"/>
  <line class="flow" x1="712" y1="1146" x2="712" y2="1242" marker-end="url(#arr)"/>
  <text class="sans lbl" x="184" y="1187">read-only</text>
  <text class="sans lbl" x="452" y="1187">read-only</text>
  <text class="sans lbl" x="720" y="1187">read-only</text>

  <!-- Footer -->
  <text class="sans note" x="50" y="1382">Arrows show the call direction at runtime; results flow back the same way. Everything runs locally except the OpenAI API.</text>
</svg>
