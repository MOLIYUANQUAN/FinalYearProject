# 每次推送和 PR 都跑离线测试（假模型，不花钱、不需要任何 key）。
# Friday 确认部署 Cursor 的改动前会看这个 test 检查：没过就不合并。
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
