# fly.io — https://fly.io/docs/languages-and-frameworks/python/
# 首次：安装 flyctl → fly auth login → scripts\deploy_fly.ps1

app = "friday-jimmy"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 手机第一次打开不能等冷启动：保持至少一台常开
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
