# fly.io — https://fly.io/docs/languages-and-frameworks/python/
# 首次：安装 flyctl → fly auth login → scripts\deploy_fly.ps1

app = "friday-jimmy"
primary_region = "lhr"

[build]

[env]
  # 日历、开场那句话、「此刻」都按伦敦时间算；云上机器默认是 UTC，夏令时会差一小时
  TZ = "Europe/London"
  # 记忆、对话、摩擦、使用记录写在挂载的磁盘上：部署和重启都不丢
  FRIDAY_STATE_DIR = "/state"

[mounts]
  source = "friday_state"
  destination = "/state"

[http_service]
  internal_port = 8080
  force_https = true
  # 手机第一次打开不能等冷启动：保持至少一台常开
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
