<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Friday</title>
  <link rel="icon" href="/static/icon.svg?v=ring1" type="image/svg+xml" />
  <link rel="icon" href="/static/icon-32.png?v=ring1" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png?v=ring1" />
  <link rel="manifest" href="/static/manifest.json?v=ring1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #000000;
      --soft: #3a3a3c;
      --muted: #8e8e93;
      --line: #d2d2d7;
      --panel: #ffffff;
      --accent: #000000;
      --brand: #000000;
      --on-brand: #ffffff;
      --focus-line: #000000;
      --focus-ring: rgba(0, 0, 0, 0.08);
      --danger: #ff3b30;
      --danger-bg: #fff2f1;
      --danger-line: #ffc4c0;
      --user: #f2f2f7;
      /* 气泡：他的黑底白字，她的浅灰 */
      --mine: #000000;
      --on-mine: #ffffff;
      --hers: #f2f2f7;
      --radius: 14px;
      /* iPhone 上就是 SF；Windows 用近黑体。品牌感靠黑白与字距，不靠花色 */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      --mono: "SF Mono", ui-monospace, "Cascadia Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --soft: #d1d1d6;
        --muted: #8e8e93;
        --line: #2c2c2e;
        --panel: #000000;
        --accent: #f5f5f7;
        --brand: #f5f5f7;
        --on-brand: #000000;
        --focus-line: #f5f5f7;
        --focus-ring: rgba(255, 255, 255, 0.12);
        --danger: #ff453a;
        --danger-bg: #1c0504;
        --danger-line: #5c1a16;
        --user: #1c1c1e;
        --mine: #f5f5f7;
        --on-mine: #000000;
        --hers: #1c1c1e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: max(12px, env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      padding: 4px 2px 10px;
    }
    /* 一条对话：他在右、她在左，都是气泡；隔得久了中间标一下时间 */
    .stamp {
      align-self: center;
      margin: 22px 0 2px;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .group { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
    .group.mine { align-items: flex-end; }
    .group.hers { align-items: flex-start; }
    .group.mine + .group.mine, .group.hers + .group.hers { margin-top: 6px; }
    .msg {
      max-width: 82%;
      padding: 9px 14px;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }
    .msg { position: relative; }
    .msg.user { background: var(--mine); color: var(--on-mine); }
    .msg.bot { background: var(--hers); color: var(--ink); }
    .msg a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    /* 要他拍板的那件事：原样写出来，和她平常说的话分开 */
    .msg.draft { background: transparent; border: 1px solid var(--line); }
    /* 没接上之类：她平静地说一句，不是红字 */
    .msg.note { color: var(--muted); }
    /* 开场：此刻最该知道的那句，第一句加粗，补充的小一号 */
    .msg.say .head { display: block; font-weight: 600; }
    .msg.say .sub { display: block; margin-top: 2px; color: var(--muted); font-size: 0.92rem; }
    /* 她还在想、在查：一个打字的气泡，旁边一行小字说在干什么 */
    .pending { display: flex; align-items: center; gap: 10px; max-width: 100%; }
    .pending .msg { padding: 12px 14px; }
    .pending .doing { color: var(--muted); font-size: 0.85rem; }
    /* 贴在气泡上的表情（像 WhatsApp）：压在气泡下沿 */
    .msg.has-react { margin-bottom: 14px; }
    .msg .react {
      position: absolute;
      bottom: -15px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 0.85rem;
      line-height: 1.3;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }
    .msg.bot .react { left: 12px; }
    .msg.user .react { right: 12px; }
    /* 长按（电脑上右键或悬停的笑脸）出一排表情，最后是「复制」 */
    .picker {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      white-space: nowrap;
    }
    .picker.below { bottom: auto; top: calc(100% + 6px); }
    .picker button {
      font: inherit;
      font-size: 1.35rem;
      line-height: 1;
      padding: 5px 6px;
      border: none;
      border-radius: 999px;
      background: none;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }
    .picker button.on { background: var(--hers); }
    .picker button.copy { font-size: 0.85rem; color: var(--soft); padding: 6px 8px; }
    .react-btn {
      position: absolute;
      top: 50%;
      right: -34px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    @media (hover: hover) {
      .msg:hover > .react-btn, .react-btn:focus-visible { opacity: 0.8; }
    }
    @media (hover: none) {
      .react-btn { display: none; }
      /* 手机上长按是贴表情，不弹系统的选字菜单（复制在表情条里） */
      .group.hers .msg[data-mid] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    }
    /* 推送里没下文的事：一件一行，点一下就办 */
    .followups { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 2px 4px; }
    .followup { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 0.92rem; }
    .followup.handled .what { text-decoration: line-through; opacity: 0.5; }
    /* 今天的时间线：开场里的一张卡片 */
    .msg.today {
      width: min(100%, 460px);
      max-width: 100%;
      padding: 12px 14px;
      white-space: normal;
    }
    .today section + section { margin-top: 12px; }
    .today h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .today .row {
      display: grid;
      grid-template-columns: 6.6em minmax(0, 1fr);
      column-gap: 10px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .today time {
      color: var(--soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .today .row.now time { color: var(--ink); font-weight: 600; }
    .today .tag {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    /* 能点的行：点开下面出动作 */
    .today .row.tappable { cursor: pointer; }
    .today .more { color: var(--soft); }
    .today .row.handled { opacity: 0.45; }
    .today .row.handled .what { text-decoration: line-through; }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .today .row-actions { margin: 2px 0 8px calc(6.6em + 10px); }
    .row-actions button {
      font: inherit;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .row-actions button:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .row-actions .hint { margin: 0; }
    .focus-actions { margin: 2px 0; }
    .today .where {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .today .empty {
      margin: 0;
      padding: 3px 0;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: no-preference) {
      .msg {
        animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .msg.user { animation-name: rise-user; }
      .today > * {
        animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .today > *:nth-child(2) { animation-delay: 0.04s; }
      .today > *:nth-child(3) { animation-delay: 0.08s; }
      .today > *:nth-child(4) { animation-delay: 0.12s; }
      .today > *:nth-child(5) { animation-delay: 0.16s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes rise-user {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      /* 整条重画时（打开、换设备回来）不再一条条浮上来 */
      #log.quiet .msg, #log.quiet .today > * { animation: none; }
    }
    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.22;
      animation: pulse 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.14s; }
    .typing i:nth-child(3) { animation-delay: 0.28s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.18; transform: translateY(0) scale(0.9); }
      40% { opacity: 0.85; transform: translateY(-3px) scale(1); }
    }
    .hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .actions { margin-top: 4px; display: flex; gap: 8px; }
    .actions button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--brand);
      background: var(--brand);
      color: var(--on-brand);
      cursor: pointer;
      touch-action: manipulation;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .actions .hint { margin-left: 0; }
    .details {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      white-space: normal;
    }
    .details summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      opacity: 0.55;
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary:hover { opacity: 1; color: var(--ink); }
    /* 确认卡片里改邮件 */
    .editor { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .editor input, .editor textarea {
      font: inherit;
      font-size: 0.95rem;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      resize: vertical;
    }
    .editor .actions { margin-top: 0; }
    .editor .hint { margin-left: 0; }
    /* 「来找你」：开场卡片下面一行，订阅过就不再出现 */
    .push-offer {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .push-offer button {
      font: inherit;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
    }
    form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      color: var(--ink);
    }
    #input:focus {
      border-color: var(--focus-line);
      background: var(--panel);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    #mic, #send {
      font: inherit;
      font-weight: 600;
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }
    #mic {
      /* 按住说话：长按不要弹出选字、放大镜 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      position: relative;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    #mic:hover { border-color: var(--ink); }
    #mic.recording {
      background: var(--brand);
      color: var(--on-brand);
      border-color: var(--brand);
    }
    #mic:disabled, #send:disabled { opacity: 0.35; cursor: default; }
    #send { transition: opacity 0.2s ease, transform 0.15s ease; }
    #send:active:not(:disabled), #mic:active:not(:disabled) { transform: scale(0.97); }
    /* 白环跟着真实的声音起伏：你说话时听麦克风，她说话时听她自己；点一下就停 */
    #send {
      background: var(--brand);
      color: var(--on-brand);
    }
    /* 像微信：点左边「说」，整条输入栏变成「按住 说话」；按住录、松手发、上滑取消 */
    #hold {
      display: none;
      flex: 1;
      height: 48px;
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--user);
      color: var(--ink);
      cursor: pointer;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition: background 0.12s ease, color 0.12s ease;
    }
    form.voice #hold { display: block; }
    form.voice #input, form.voice #send { display: none; }
    #hold.holding { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    /* 声音就画在手指按着的这条上：你说话时跟着你的响度跳，她说话时跟着她的；没有声音就不画 */
    #hold .wave { display: none; align-items: center; gap: 3px; height: 20px; margin-right: 10px; vertical-align: middle; }
    #hold[data-voice] .wave { display: inline-flex; }
    #hold .wave i {
      width: 3px;
      height: calc(4px + var(--l, 0) * var(--k) * 16px);
      border-radius: 2px;
      background: currentColor;
      opacity: 0.85;
    }
    #hold .wave i:nth-child(1) { --k: 0.45; }
    #hold .wave i:nth-child(2) { --k: 0.8; }
    #hold .wave i:nth-child(3) { --k: 1; }
    #hold .wave i:nth-child(4) { --k: 0.65; }
    #hold .wave i:nth-child(5) { --k: 0.9; }
    #hold .wave i:nth-child(6) { --k: 0.55; }
    #hold .wave i:nth-child(7) { --k: 0.35; }
    #hold .label { vertical-align: middle; }
    #hold.cancel { background: var(--danger); color: #fff; border-color: var(--danger); }
    #voiceHint {
      position: fixed;
      left: 50%;
      bottom: calc(196px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--user);
      color: var(--soft);
      font-size: 0.85rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 11;
    }
    #voiceHint.on { opacity: 1; }
    #voiceHint.cancel { background: var(--danger); color: #fff; }
    #unlock {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #unlock.visible { display: flex; }
    #unlock p { margin: 0; color: var(--soft); line-height: 1.55; }
    #unlock form { display: flex; gap: 8px; }
    #unlock input {
      flex: 1;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      color: var(--ink);
      outline: none;
    }
    #unlock button {
      font: inherit;
      font-weight: 600;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--on-brand);
      touch-action: manipulation;
    }
    @media (max-width: 520px) {
      main { gap: 12px; }
      .msg { max-width: 88%; }
      /* 手机上「18:00–19:00」放不进 5.2em，会和标题挤在一起：时间字小一号，列宽给够 */
      .today .row { grid-template-columns: 5.6em minmax(0, 1fr); }
      .today .row time { font-size: 0.84em; padding-top: 0.12em; }
      .today .row-actions { margin-left: calc(5.6em + 10px); }
      .today .row-actions button { min-height: 40px; }
      #input { font-size: 16px; min-height: 48px; }
      #mic, #send { min-width: 3.6rem; min-height: 48px; padding: 0 14px; }
      .actions { flex-wrap: wrap; }
      .actions button { min-height: 44px; flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main>
    <div id="unlock" aria-live="polite">
      <p>输入一次密码，之后这台设备会记住你。</p>
      <form id="unlockForm">
        <input id="unlockInput" type="password" autocomplete="current-password" placeholder="密码" />
        <button type="submit">进入</button>
      </form>
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <form id="form">
      <button id="mic" type="button" aria-label="切换到说话">说</button>
      <textarea id="input" rows="1" placeholder="问我，或者告诉我一件事" autocomplete="off" enterkeyhint="send"></textarea>
      <button id="hold" type="button"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="label">按住 说话</span></button>
      <button id="send" type="submit">发送</button>
    </form>
    <div id="voiceHint" aria-live="polite"></div>
  </main>

  <script>
    const ACCESS_KEY = "pa.access"; // 旧版曾把密码存在本机；登录后清掉
    const CARD_FRESH_MS = 15 * 60 * 1000;
    const GAP_MS = 60 * 60 * 1000; // 隔了一小时以上，中间标一下时间
    const QUIET_AFTER_HER_MS = 2 * 60 * 60 * 1000;
    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
    // 她在干什么：一行小字，不出现工具名
    const DOING = {
      get_calendar_events: "在看你的日历…",
      create_calendar_event: "在写进日历…",
      search_emails: "在翻邮件…",
      read_email: "在读那封邮件…",
      send_email: "在准备邮件…",
      modify_email: "在整理邮件…",
      search_files: "在找笔记…",
      read_file: "在读笔记…",
      get_personal_context: "在翻你的档案…",
      remind_me: "在定提醒…",
      cancel_reminder: "在取消提醒…",
      search_memory: "在回想…",
      remember_fact: "在记下来…",
      forget_fact: "在准备忘掉…",
      note_friction: "在记下来…",
      note_mistake: "在记下来…",
      list_friction: "在翻反馈…",
      resolve_friction: "在划掉…",
      fix_friction_with_cursor: "在交给 Cursor…",
      check_cursor_fix: "在看 Cursor 的进度…",
      preview_pending_ship: "在看改动…",
      ship_pending_fix: "在准备上线…",
      add_task: "在记下来…",
      complete_task: "在划掉…",
    };
    // 要他拍板时的两个按钮：按钮上的字就是他的回答（服务端认得这些话）
    const ANSWERS = {
      send_email: ["发", "不发"],
      forget_fact: ["忘掉", "留着"],
      fix_friction_with_cursor: ["交给它", "先不"],
      ship_pending_fix: ["上线", "先不"],
    };

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const micBtn = document.getElementById("mic");
    const unlockEl = document.getElementById("unlock");
    const unlockForm = document.getElementById("unlockForm");
    const unlockInput = document.getElementById("unlockInput");

    let session = null;
    let busy = false;
    let ready = false;
    let pendingPassword = ""; // 桌面 ?access= 或旧 localStorage，登录后清掉
    let mediaRecorder = null;
    let mediaStream = null;
    let recordChunks = [];
    let recordTimer = null;
    const RECORD_MAX_MS = 60 * 1000;

    (function takeAccessFromUrl() {
      try {
        const legacy = sessionStorage.getItem(ACCESS_KEY);
        if (legacy && !localStorage.getItem(ACCESS_KEY)) {
          localStorage.setItem(ACCESS_KEY, legacy);
          sessionStorage.removeItem(ACCESS_KEY);
        }
        const u = new URL(location.href);
        const t = u.searchParams.get("access");
        if (t) {
          pendingPassword = t;
          u.searchParams.delete("access");
          history.replaceState({}, "", u.pathname + u.search + u.hash);
        } else {
          pendingPassword = localStorage.getItem(ACCESS_KEY) || sessionStorage.getItem(ACCESS_KEY) || "";
        }
      } catch (e) {}
    })();

    function clearStoredPassword() {
      pendingPassword = "";
      try {
        localStorage.removeItem(ACCESS_KEY);
        sessionStorage.removeItem(ACCESS_KEY);
      } catch (e) {}
    }

    function authHeaders(extra) {
      return Object.assign({}, extra || {});
    }

    function showUnlock(on) {
      unlockEl.classList.toggle("visible", !!on);
      form.style.display = on ? "none" : "";
      if (on) unlockInput.focus();
    }

    async function loginWithPassword(password) {
      const res = await fetch("/api/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || "密码不对。");
      }
      clearStoredPassword();
      return true;
    }

    async function ensureSignedIn() {
      if (pendingPassword) {
        try {
          await loginWithPassword(pendingPassword);
          showUnlock(false);
          return true;
        } catch (e) {
          clearStoredPassword();
        }
      }
      const res = await fetch("/api/session", { credentials: "include" });
      const data = await res.json().catch(() => ({}));
      if (!data.access_required || data.signed_in) {
        showUnlock(false);
        return true;
      }
      showUnlock(true);
      return false;
    }

    // 页面上只有一条对话，存在服务端：手机上聊的，电脑上打开也在。
    // session.id 是给模型的那一段（服务端按「同一天、两小时内」分段）；放久了是 null，就请她开场
    function needsOpener(s) {
      const last = s.messages[s.messages.length - 1];
      if (!last) return true;
      const age = Date.now() - (last.at || 0);
      if (last.agenda) return age > CARD_FRESH_MS;
      // 她刚刚才说过话（比如推送）：那就是她的开场，不再说一遍
      if (last.role !== "user" && age < QUIET_AFTER_HER_MS) return false;
      return !s.id;
    }

    function fromServer(m) {
      return {
        id: m.id,
        role: m.role,
        content: m.content || "",
        tools: m.tools || [],
        undo: m.undo || [],
        undone: !!m.undone,
        agenda: m.agenda || null,
        ask: m.ask || "",
        items: m.items || [],
        reaction: m.reaction || "",
        reactions: m.reactions || {},
        needsConfirm: !!m.needs_confirm,
        approvals: m.approvals || [],
        at: m.at || 0,
      };
    }

    async function loadSession() {
      try {
        const res = await fetch("/api/conversation", { credentials: "include", headers: authHeaders() });
        if (!res.ok) return null;
        const data = await res.json();
        return { id: data.id || null, messages: (data.messages || []).map(fromServer) };
      } catch (e) {
        return null;
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 模型偶尔仍会输出 Markdown：只做最小渲染，其余按纯文本显示
    function render(text) {
      return escapeHtml(text || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^(\s*)[-*•]\s+/gm, "$1· ")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- 一条对话：他在右、她在左，都是气泡；她的一段话一个气泡 ----
    let lastAt = 0;
    const DOTS = '<span class="typing"><i></i><i></i><i></i></span>';

    function stampText(at) {
      const d = new Date(at);
      const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      const midnight = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const days = Math.round((midnight(new Date()) - midnight(d)) / 86400000);
      if (days === 0) return "今天 " + hm;
      if (days === 1) return "昨天 " + hm;
      if (days < 7) return "周" + "日一二三四五六"[d.getDay()] + " " + hm;
      return d.getMonth() + 1 + "月" + d.getDate() + "日 " + hm;
    }

    // 一个人连着说的一次；离上一句隔了一小时以上或换了一天，先标时间
    function group(role, at) {
      at = at || Date.now();
      if (!lastAt || at - lastAt >= GAP_MS || new Date(at).toDateString() !== new Date(lastAt).toDateString()) {
        logEl.append(el("div", "stamp", stampText(at)));
      }
      lastAt = Math.max(lastAt, at);
      const g = el("div", "group " + (role === "user" ? "mine" : "hers"));
      logEl.append(g);
      scrollDown();
      return g;
    }

    function bubble(g, text, extra) {
      const b = el("div", "msg " + (g.classList.contains("mine") ? "user" : "bot") + (extra ? " " + extra : ""));
      if (text != null) b.innerHTML = render(text);
      g.append(b);
      scrollDown();
      return b;
    }

    function paragraphs(text) {
      return (text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    }

    function note(text) {
      return bubble(group("assistant"), text, "note");
    }

    // ---- 贴表情（像 WhatsApp）：他在她的气泡上贴；她不说话时也会在他那条上贴一个 ----
    function setPill(b, emoji) {
      let pill = b.querySelector(":scope > .react");
      if (!emoji) {
        if (pill) pill.remove();
        b.classList.remove("has-react");
        return;
      }
      if (!pill) {
        pill = el("span", "react");
        b.append(pill);
      }
      pill.textContent = emoji;
      b.classList.add("has-react");
    }

    // 她的一个气泡能贴表情：记下是哪条消息的第几段，电脑上悬停出一个笑脸
    function reactable(b, m, part) {
      if (!m || !m.id) return;
      b.dataset.mid = m.id;
      b.dataset.part = part;
      const btn = el("button", "react-btn", "☺");
      btn.type = "button";
      btn.setAttribute("aria-label", "贴表情");
      btn.onclick = (e) => {
        e.stopPropagation();
        openPicker(b);
      };
      b.append(btn);
      setPill(b, (m.reactions || {})[part]);
    }

    let picker = null;
    function closePicker() {
      if (picker) picker.remove();
      picker = null;
    }

    function openPicker(b) {
      closePicker();
      const now = (b.querySelector(":scope > .react") || {}).textContent || "";
      picker = el("div", "picker");
      for (const emoji of REACTIONS) {
        const x = el("button", emoji === now ? "on" : "", emoji);
        x.type = "button";
        x.onclick = (e) => {
          e.stopPropagation();
          closePicker();
          react(b, emoji === now ? "" : emoji);
        };
        picker.append(x);
      }
      const copy = el("button", "copy", "复制");
      copy.type = "button";
      copy.onclick = (e) => {
        e.stopPropagation();
        const clone = b.cloneNode(true);
        clone.querySelectorAll(".react, .react-btn, .picker").forEach((n) => n.remove());
        navigator.clipboard && navigator.clipboard.writeText(clone.textContent.trim()).catch(() => {});
        closePicker();
      };
      picker.append(copy);
      b.append(picker);
      if (b.getBoundingClientRect().top - logEl.getBoundingClientRect().top < 60) picker.classList.add("below");
    }

    async function react(b, emoji) {
      const before = (b.querySelector(":scope > .react") || {}).textContent || "";
      setPill(b, emoji);
      try {
        const res = await fetch("/api/react", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ message_id: Number(b.dataset.mid), part: Number(b.dataset.part), emoji }),
        });
        if (!res.ok) throw new Error(String(res.status));
        const { reactions } = await res.json();
        const m = session.messages.find((x) => String(x.id) === b.dataset.mid);
        if (m) m.reactions = reactions;
      } catch (e) {
        setPill(b, before);
      }
    }

    // 手机：在她的气泡上按住半秒；电脑：右键或悬停的笑脸
    let pressTimer = null;
    let pressAt = null;
    logEl.addEventListener("pointerdown", (e) => {
      const b = e.target.closest(".group.hers .msg[data-mid]");
      if (!b || e.pointerType === "mouse" || e.target.closest(".picker, button")) return;
      pressAt = { x: e.clientX, y: e.clientY };
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        pressTimer = null;
        if (navigator.vibrate) navigator.vibrate(8);
        openPicker(b);
      }, 450);
    });
    logEl.addEventListener("pointermove", (e) => {
      if (pressTimer && pressAt && Math.hypot(e.clientX - pressAt.x, e.clientY - pressAt.y) > 8) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    });
    ["pointerup", "pointercancel"].forEach((t) => logEl.addEventListener(t, () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    }));
    logEl.addEventListener("contextmenu", (e) => {
      const b = e.target.closest(".group.hers .msg[data-mid]");
      if (!b) return;
      e.preventDefault();
      openPicker(b);
    });
    document.addEventListener("pointerdown", (e) => {
      if (picker && !e.target.closest(".picker")) closePicker();
    });

    // 推送里没下文的事：一件一行，「做完了 / 明天再说」点一下就办，办过的划掉
    function drawItems(g, m) {
      const box = el("div", "followups");
      for (const item of m.items || []) {
        const line = el("div", item.handled ? "followup handled" : "followup");
        line.append(el("span", "what", item.title));
        if (!item.handled) {
          const bar = el("span", "row-actions");
          for (const action of [{ id: "done", label: "做完了" }, { id: "tomorrow", label: "明天再说" }]) {
            const b = el("button", "", action.label);
            b.type = "button";
            b.onclick = () => doRow(line, { key: item.key, title: item.title, message_id: m.id }, action, bar);
            bar.append(b);
          }
          line.append(bar);
        }
        box.append(line);
      }
      g.append(box);
    }

    // 她还在想、在查：打字的气泡，旁边一行小字说在干什么
    function pending(g, doing) {
      let p = g.querySelector(":scope > .pending");
      if (!p) {
        p = el("div", "pending");
        g.append(p);
      }
      p.innerHTML = '<div class="msg bot">' + DOTS + "</div>" + (doing ? '<span class="doing">' + escapeHtml(doing) + "</span>" : "");
      scrollDown();
    }

    function clearPending(g) {
      const p = g.querySelector(":scope > .pending");
      if (p) p.remove();
    }

    // 她正在说的这一轮：边写边分段，写到空行就开下一个气泡；去查东西时先收起来，换成「在…」
    function herReply(g) {
      const bubbles = [];
      return {
        g,
        bubbles,
        show(text) {
          const parts = paragraphs(text);
          if (parts.length) clearPending(g);
          parts.forEach((p, i) => {
            if (!bubbles[i]) bubbles[i] = bubble(g);
            bubbles[i].innerHTML = render(p);
          });
          bubbles.splice(parts.length).forEach((b) => b.remove());
          scrollDown();
        },
        busy(doing) {
          bubbles.splice(0).forEach((b) => b.remove());
          pending(g, doing);
        },
      };
    }

    function replyView(reply, speaker) {
      return {
        onDelta(text) {
          reply.show(text);
          if (speaker) speaker.feed(text);
        },
        onTool(name) {
          reply.busy(DOING[name] || "");
          if (speaker) speaker.reset();
        },
      };
    }

    // 要他拍板的那段（服务端拼的）：要做的事原样放进一个框，最后那句问话是她的一条
    function drawAsk(g, ask) {
      const cut = ask.lastIndexOf("\n\n");
      if (cut > 0) bubble(g, ask.slice(0, cut), "draft");
      bubble(g, cut > 0 ? ask.slice(cut + 2) : ask);
    }

    // 她说的话（不含要他拍板的那段）
    function saidPart(m) {
      const c = m.content || "";
      return m.ask && c.endsWith(m.ask) ? c.slice(0, c.length - m.ask.length).trim() : c;
    }

    function calm(err) {
      const raw = (err && err.message) || String(err || "");
      if (/load failed|failed to fetch|networkerror|aborted|connection|连接断了/i.test(raw)) return "连不上了，网络好了再说一次。";
      return raw || "这句没接上，再说一次。";
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    // 开场：问候一条，此刻最该知道的那句一条；最新的那次开场下面再挂今天的时间线和那一个动作
    function drawOpener(g, m, full) {
      g.classList.add("opener");
      const card = m.agenda || {};
      if (full && card.hello) bubble(g, card.hello);
      if (m.content) {
        const say = bubble(g, null, "say");
        fillSay(say, m.content);
        reactable(say, m, 0);
      }
      if (full) {
        g.classList.add("full");
        attachToday(g, card);
      }
    }

    function attachToday(g, card) {
      if (card.error) bubble(g, card.error, "note");
      if (card.focus && card.focus.actions && card.focus.actions.length) g.append(focusActions(g, card.focus));
      if ((card.sections || []).length) g.append(drawToday(card));
    }

    // 又开了一次场：之前那次只留那一句
    function foldOpeners() {
      logEl.querySelectorAll(".group.opener.full").forEach((g) => {
        g.classList.remove("full");
        g.querySelectorAll(".today, .focus-actions, .push-offer, .msg:not(.say)").forEach((n) => n.remove());
      });
    }

    // 时间线上的安排是服务端读到的原样数据，不经过模型
    function drawToday(card) {
      const div = el("div", "msg bot today");
      for (const section of card.sections || []) {
        const box = el("section");
        // 空的日子只占一行、退到后面；版面留给真要去的事
        const head = el("h3");
        head.append(el("span", "", section.label));
        const side = section.rows.length ? section.meta : section.empty;
        if (side) head.append(el("span", "", side));
        box.append(head);
        for (const row of section.rows) {
          const line = el("div", row.now ? "row now" : "row");
          const what = el("div", "what", row.title);
          if (row.actions && row.actions.length) what.append(el("span", "more", " ›"));
          if (row.now) what.append(el("span", "tag", "进行中"));
          if (row.where) what.append(el("span", "where", row.where));
          line.append(el("time", "", row.time), what);
          if (row.key) line.dataset.key = row.key;
          box.append(line);
          if (row.actions && row.actions.length) {
            line.classList.add("tappable");
            line.onclick = () => toggleRowActions(line, row);
          }
        }
        div.append(box);
      }
      return div;
    }

    // 「现在」：第一句大字，一眼看完（不带句号）；补充的（地点、还剩多久、空到几点）小一号放在下面
    function fillSay(el, text) {
      const cut = (text || "").indexOf("。");
      if (cut < 0 || cut === text.length - 1) {
        el.innerHTML = '<span class="head">' + render((text || "").replace(/。$/, "")) + "</span>";
        return;
      }
      el.innerHTML =
        '<span class="head">' + render(text.slice(0, cut)) + "</span>" +
        '<span class="sub">' + render(text.slice(cut + 1)) + "</span>";
    }

    // 「现在」那句话下面的按钮：和时间线上同一件事是同一个动作，办完那一行也划掉
    function focusActions(g, focus) {
      const bar = el("div", "row-actions focus-actions");
      for (const action of focus.actions) {
        const b = el("button", "", action.label);
        b.type = "button";
        b.onclick = () => {
          if (action.url) {
            window.open(action.url, "_blank", "noopener");
            return;
          }
          if (action.confirm && !b.dataset.armed) {
            b.dataset.armed = "1";
            b.textContent = action.confirm;
            return;
          }
          const line = g.querySelector('.row[data-key="' + CSS.escape(focus.key) + '"]') || el("div");
          doRow(line, focus, action, bar);
        };
        bar.append(b);
      }
      return bar;
    }

    // 卡片上的一行：点开出动作；「帮我准备」交给她，「做完了 / 明天再说」直接办、给撤销
    function toggleRowActions(line, row) {
      const open = line.nextElementSibling;
      if (open && open.classList.contains("row-actions")) {
        open.remove();
        return;
      }
      if (line.classList.contains("handled")) return;
      const bar = el("div", "row-actions");
      for (const action of row.actions) {
        const b = el("button", "", action.label);
        b.type = "button";
        b.onclick = (e) => {
          e.stopPropagation();
          if (action.url) {
            window.open(action.url, "_blank", "noopener");
            return;
          }
          // 上线这种动作：第一下变成「确认上线」，再点一下才办
          if (action.confirm && !b.dataset.armed) {
            b.dataset.armed = "1";
            b.textContent = action.confirm;
            return;
          }
          doRow(line, row, action, bar);
        };
        bar.append(b);
      }
      line.after(bar);
    }

    async function doRow(line, row, action, bar) {
      if (busy || !ready) return;
      if (action.id === "prepare" || action.ask) {
        bar.remove();
        await ask(action.ask || "帮我准备 " + row.title);
        return;
      }
      bar.querySelectorAll("button").forEach((b) => (b.disabled = true));
      if (action.id === "ship") bar.replaceChildren(el("span", "hint", "正在合并上线…"));
      try {
        const res = await fetch("/api/items/act", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ key: row.key, action: action.id, conversation_id: session && session.id, message_id: row.message_id || null }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要重新登录。");
        }
        if (!res.ok) throw new Error(data.detail || "没办成。");
        bar.remove();
        if (action.id !== "preview") line.classList.add("handled");
        clearActions();
        const m = { id: data.message_id, role: "assistant", content: data.say, tools: [], undo: data.undo, at: Date.now() };
        const g = group("assistant", m.at);
        bubble(g, data.say);
        if (m.undo && m.undo.length) addUndo(g, m);
        session.messages.push(m);
      } catch (e) {
        bar.replaceChildren(el("span", "hint", (e && e.message) || String(e)));
      }
    }




    // ---- 来找你：iPhone 主屏幕上的 Friday、电脑上的 Friday 窗口都能收到她主动发的提醒 ----
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    let swReady = null;
    if ("serviceWorker" in navigator) {
      swReady = navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).catch(() => null);
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data && e.data.type === "nudge") handleNudge(e.data.url);
      });
    }

    function keyBytes(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    function deviceName() {
      if (isIOS) return "iPhone";
      if (/Windows/.test(navigator.userAgent)) return "电脑";
      if (/Mac/.test(navigator.userAgent)) return "Mac";
      return "浏览器";
    }

    async function pushSubscribed() {
      if (!pushSupported || Notification.permission !== "granted" || !swReady) return false;
      const reg = await swReady;
      return !!(reg && (await reg.pushManager.getSubscription()));
    }

    async function enablePush(line) {
      const say = (text) => line.replaceChildren(el("span", "", text));
      try {
        const reg = await swReady;
        if (!reg) throw new Error("这个浏览器不支持提醒。");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          say("通知被关掉了：到系统设置里给 Friday 打开通知，再点一次。");
          return;
        }
        const { public_key } = await (await fetch("/api/push/key", { credentials: "include" })).json();
        const sub = (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(public_key) }));
        const res = await fetch("/api/push/subscribe", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ subscription: sub.toJSON(), device: deviceName() }),
        });
        if (!res.ok) throw new Error("没订上，再点一次。");
        await fetch("/api/push/test", { method: "POST", credentials: "include", headers: authHeaders() });
        say("好了，有事我会来找你。");
      } catch (e) {
        say((e && e.message) || "没订上，再点一次。");
      }
    }

    // 开场卡片下面：这台设备还没订上，就问一句
    async function offerPush(g) {
      if (await pushSubscribed()) return;
      const line = el("div", "push-offer");
      if (isIOS && !standalone) {
        line.append(el("span", "", "想让我主动找你：在 Safari 点「分享 → 添加到主屏幕」，再从主屏幕打开我。"));
      } else if (!pushSupported) {
        return;
      } else {
        const b = el("button", "", "打开提醒");
        b.type = "button";
        b.onclick = () => enablePush(line);
        line.append(el("span", "", "想让我主动来找你？"), b);
      }
      g.appendChild(line);
    }

    // 从通知点进来：记一笔「点开了」；会前提醒就直接把要点备好
    function handleNudge(url) {
      let target;
      try {
        target = new URL(url, location.origin);
      } catch (e) {
        return;
      }
      const key = target.searchParams.get("n");
      if (key) {
        fetch("/api/nudges/opened", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ key }),
        }).catch(() => {});
      }
      const what = target.searchParams.get("what");
      const action = target.searchParams.get("do");
      if (action === "prepare" && what) pendingAsk = "帮我准备 " + what;
      // 车间的推送（Cursor 改好了、测试红了）：点开就直接问她，改了什么由她给你看
      if (action === "ask" && what) pendingAsk = what;
      if (pendingAsk && ready && !busy) {
        const message = pendingAsk;
        pendingAsk = "";
        ask(message);
      }
    }

    let pendingAsk = "";
    (function takeNudgeFromUrl() {
      const u = new URL(location.href);
      if (!u.searchParams.has("n")) return;
      handleNudge(location.href);
      ["n", "do", "what"].forEach((k) => u.searchParams.delete(k));
      history.replaceState({}, "", u.pathname + u.search + u.hash);
    })();

    // 要他拍板：她问一句，下面两个字就是他的回答；邮件还能当场改
    function addConfirm(g, m) {
      const bar = el("div", "actions");
      const names = [...new Set((m.approvals || []).map((a) => a.name))];
      const [yes, no] = (names.length === 1 && ANSWERS[names[0]]) || ["好", "不要"];
      [[yes, ""], [no, "secondary"]].forEach(([label, kind]) => {
        const b = el("button", kind, label);
        b.type = "button";
        b.onclick = () => ask(label);
        bar.append(b);
      });
      const mail = (m.approvals || []).find((a) => a.name === "send_email");
      if (mail) {
        const b = el("button", "secondary", "改一下");
        b.type = "button";
        b.onclick = () => openMailEditor(g, bar, mail);
        bar.insertBefore(b, bar.lastChild);
      }
      g.append(bar);
    }

    function openMailEditor(div, bar, mail) {
      const args = mail.arguments || {};
      const box = el("div", "editor");
      const subject = el("input");
      subject.value = args.subject || "";
      subject.setAttribute("aria-label", "主题");
      const body = el("textarea");
      body.value = args.body || "";
      body.rows = Math.min(14, Math.max(5, (args.body || "").split("\n").length + 1));
      body.setAttribute("aria-label", "正文");
      const actions = el("div", "actions");
      const send = el("button", "", "按这个发");
      send.type = "button";
      const cancel = el("button", "secondary", "算了");
      cancel.type = "button";
      actions.append(send, cancel);
      box.append(el("div", "hint", "发给 " + (args.to || "")), subject, body, actions);
      bar.replaceWith(box);
      body.focus();
      cancel.onclick = () => box.replaceWith(bar);
      send.onclick = () => revise(box, mail, { subject: subject.value, body: body.value });
    }

    async function revise(box, mail, changes) {
      if (busy || !ready) return;
      stopSpeaking();
      setBusy(true);
      box.remove();
      const said = { role: "user", content: "（改了一下）按这个发。", at: Date.now() };
      const mine = bubble(group("user"), said.content);
      session.messages.push(said);
      const reply = herReply(group("assistant"));
      Object.assign(reply, { mine, said });
      reply.busy(DOING.send_email);
      try {
        const result = await stream(
          "/api/chat/revise",
          { conversation_id: session.id, call_id: mail.call_id, changes },
          replyView(reply),
        );
        finish(reply, result);
      } catch (e) {
        fail(reply, e);
      } finally {
        setBusy(false);
      }
    }

    // 记下或划掉的待办不先问他，只在下面放一个「撤销」：直接撤回，不经过模型
    function addUndo(g, m) {
      const bar = el("div", "actions");
      const b = el("button", "secondary", "撤销");
      b.type = "button";
      b.onclick = async () => {
        b.disabled = true;
        try {
          const res = await fetch("/api/undo", {
            method: "POST",
            credentials: "include",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ items: m.undo, message_id: m.id }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            showUnlock(true);
            throw new Error("需要重新登录。");
          }
          if (!res.ok) throw new Error(data.detail || "没撤销成功。");
          m.undone = true;
          bar.replaceChildren(el("span", "hint", "已撤销"));
        } catch (e) {
          bar.replaceChildren(el("span", "hint", (e && e.message) || String(e)));
        }
      };
      bar.append(b);
      g.appendChild(bar);
    }

    function clearActions() {
      logEl.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    // 整条重画：打开、换设备回来时。最新的那次开场带时间线，之前的只留那一句
    function renderThread() {
      logEl.classList.add("quiet");
      logEl.replaceChildren();
      lastAt = 0;
      const msgs = session.messages;
      let latestOpener = -1;
      msgs.forEach((m, i) => {
        if (m.agenda) latestOpener = i;
      });
      msgs.forEach((m, i) => {
        const g = group(m.role, m.at);
        if (m.role === "user") setPill(bubble(g, m.content), m.reaction);
        else if (m.agenda) drawOpener(g, m, i === latestOpener);
        else {
          showHers(g, m);
          if (m.items && m.items.length) drawItems(g, m);
          const last = i === msgs.length - 1;
          if (m.needsConfirm && last) addConfirm(g, m);
          if (m.undo && m.undo.length && !m.undone && last) addUndo(g, m);
        }
        if (!g.children.length) g.remove();
      });
      scrollDown();
      requestAnimationFrame(() => logEl.classList.remove("quiet"));
    }

    function showHers(g, m) {
      const parts = paragraphs(saidPart(m));
      if (m.undone && parts.length) parts[parts.length - 1] += "（已撤销）";
      parts.forEach((p, i) => reactable(bubble(g, p), m, i));
      if (m.ask) drawAsk(g, m.ask);
    }

    // view 上挂着各种事件怎么画：onDelta（她写到哪了）、onTool（她去查东西）、onAgenda（开场的时间线）、onHeard（听清他说的）
    async function stream(url, payload, view) {
      const form = payload instanceof FormData;
      const res = await fetch(url, {
        method: "POST",
        credentials: "include",
        headers: form ? authHeaders() : authHeaders({ "Content-Type": "application/json" }),
        body: form ? payload : JSON.stringify(payload || {}),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要登录才能聊。");
        }
        if (res.status === 404) {
          throw new Error("本地服务还是旧版本：双击 Friday.cmd 重开，再刷新这页。");
        }
        console.warn("Friday:", res.status, data.detail || "");
        throw new Error(res.status === 503 && data.detail ? data.detail : "这句没接上，再说一次。");
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let result = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;
          const ev = JSON.parse(frame.slice(6));
          if (ev.type === "heard") {
            if (view.onHeard) view.onHeard(ev);
          } else if (ev.type === "conversation") {
            if (session && ev.id) session.id = ev.id;
          } else if (ev.type === "agenda") {
            if (view.onAgenda) view.onAgenda(ev);
            scrollDown();
          } else if (ev.type === "delta") {
            text += ev.text;
            if (view.onDelta) view.onDelta(text);
          } else if (ev.type === "tool") {
            text = "";
            if (view.onTool) view.onTool(ev.name);
          } else if (ev.type === "done") {
            result = {
              reply: ev.reaction ? "" : ev.reply || text,
              ask: ev.ask || "",
              reaction: ev.reaction || "",
              tools: ev.tools_called || [],
              undo: ev.undo || [],
              needsConfirm: !!ev.needs_confirm,
              approvals: ev.approvals || [],
              id: ev.message_id,
            };
          } else if (ev.type === "error") {
            if (ev.detail) console.warn("Friday:", ev.detail);
            throw new Error(ev.message);
          }
        }
      }
      if (!result) throw new Error("连接断了，再试一次。");
      return result;
    }

    // 这一轮说完：按最终的话重排气泡（写的时候已经分好的原样留着），要拍板的那段单独一个框
    function finish(reply, result) {
      const { reply: content, ask = "", tools = [], undo = [], needsConfirm = false, approvals = [], id, reaction } = result;
      if (reaction) {
        // 她没说话，只在他那条上贴了个表情
        reply.g.remove();
        if (reply.mine) setPill(reply.mine, reaction);
        if (reply.said) reply.said.reaction = reaction;
        return;
      }
      const m = { id, role: "assistant", content, ask, tools, needsConfirm, approvals, undo, at: Date.now() };
      clearPending(reply.g);
      reply.show(saidPart(m));
      reply.bubbles.forEach((b, i) => reactable(b, m, i));
      if (ask) drawAsk(reply.g, ask);
      if (needsConfirm) addConfirm(reply.g, m);
      if (undo.length) addUndo(reply.g, m);
      if (!reply.g.children.length) reply.g.remove();
      session.messages.push(m);
      scrollDown();
    }

    function fail(reply, err) {
      clearPending(reply.g);
      reply.show("");
      bubble(reply.g, calm(err), "note");
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on;
    }

    // ---- 声音：你说话时听麦克风；她一句写完就念一句；白环跟着真实的响度起伏 ----
    const voiceOut = new Audio();
    const SENTENCE_STOPS = "。！？!?；;…\n";
    const ENVELOPE_HZ = 50; // 她的声音每 20ms 记一个响度
    const levelBuf = new Uint8Array(1024);
    let audioCtx = null;
    let micSource = null;
    let micAnalyser = null;
    let voiceEnv = null; // 正在念的这句的响度曲线
    let speechTurn = 0; // 每次打断 +1：上一轮没念完的句子作废
    let speechQueue = []; // 排着队的句子：每句一个 Promise<{url, env}>
    let speechPlaying = false;
    let speechOpen = false; // 这一轮还在写，后面可能还有句子
    let clipWatch = 0;
    let orbState = "";
    let orbLevel = 0;
    let orbFrame = 0;
    let orbHide = 0;

    function audioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    // 均方根响度 → 0–1；开平方让轻声也有起伏
    function toLevel(rms) {
      return Math.min(1, Math.sqrt(Math.max(0, rms - 0.01)) * 2.2);
    }

    function micLevel() {
      if (!micAnalyser) return 0;
      micAnalyser.getByteTimeDomainData(levelBuf);
      let sum = 0;
      for (const v of levelBuf) sum += ((v - 128) / 128) ** 2;
      return toLevel(Math.sqrt(sum / levelBuf.length));
    }

    function voiceLevel(now) {
      if (voiceOut.paused) return 0;
      if (!voiceEnv) return 0.35 + 0.25 * Math.sin(now / 150) * Math.sin(now / 410);
      return toLevel(voiceEnv[Math.floor(voiceOut.currentTime * ENVELOPE_HZ)] || 0);
    }

    function orbTick(now) {
      const target = orbState === "listening" ? micLevel() : orbState === "speaking" ? voiceLevel(now) : 0;
      // 起得快、落得慢，像呼吸
      orbLevel += (target - orbLevel) * (target > orbLevel ? 0.5 : 0.12);
      holdBtn.style.setProperty("--l", orbLevel.toFixed(3));
      orbFrame = orbState || orbLevel > 0.01 ? requestAnimationFrame(orbTick) : 0;
    }

    // 声音的状态只画在输入栏上：听你说（listening）、她在说（speaking）；想的时候不画，气泡里的三个点就够了
    function orbSet(state) {
      clearTimeout(orbHide);
      orbState = state;
      if (state === "listening" || state === "speaking") holdBtn.dataset.voice = state;
      else delete holdBtn.dataset.voice;
      voiceLabels();
      if (state && !orbFrame) orbFrame = requestAnimationFrame(orbTick);
    }

    // 她在说话时：「按住 说话」变成「轻点停止 · 按住插话」；打字模式下左边的「说」变成「停」
    function voiceLabels() {
      const voice = form.classList.contains("voice");
      if (!press) holdBtn.querySelector(".label").textContent = orbState === "speaking" ? "轻点停止 · 按住插话" : "按住 说话";
      micBtn.textContent = voice ? "打字" : orbState === "speaking" ? "停" : "说";
    }

    // 这一轮全说完才收起白环；句子之间的停顿不收
    function settleOrb() {
      if (orbState === "listening" || speechPlaying || speechQueue.length || speechOpen) return;
      clearTimeout(orbHide);
      orbHide = setTimeout(() => orbSet(""), 350);
    }

    // 手机 Safari 只让「点过的」播放器出声：第一次点麦克风时先放 0.1 秒静音
    function unlockVoice() {
      const ctx = audioContext();
      if (!voiceOut.src) {
        voiceOut.src = silentWav();
        voiceOut.play().catch(() => {});
      }
      return ctx;
    }

    function silentWav() {
      const samples = 800;
      const bytes = new Uint8Array(44 + samples).fill(128); // 8-bit PCM，128 是静音
      const view = new DataView(bytes.buffer);
      const tag = (at, s) => [...s].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)));
      tag(0, "RIFF");
      view.setUint32(4, 36 + samples, true);
      tag(8, "WAVEfmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 8000, true);
      view.setUint32(28, 8000, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      tag(36, "data");
      view.setUint32(40, samples, true);
      return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    }

    // 解出这句的响度曲线给白环用；声音本身照常由播放器放，不经过 Web Audio
    async function envelopeOf(blob) {
      const ctx = audioContext();
      if (!ctx) return null;
      try {
        const data = (await ctx.decodeAudioData(await blob.arrayBuffer())).getChannelData(0);
        const step = Math.round(ctx.sampleRate / ENVELOPE_HZ);
        const env = new Float32Array(Math.ceil(data.length / step));
        for (let i = 0; i < env.length; i++) {
          const end = Math.min(data.length, (i + 1) * step);
          let sum = 0;
          for (let j = i * step; j < end; j++) sum += data[j] * data[j];
          env[i] = Math.sqrt(sum / (end - i * step));
        }
        return env;
      } catch (e) {
        return null;
      }
    }

    function fetchSpeech(text) {
      return fetch("/api/voice/speak", {
        method: "POST",
        credentials: "include",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ text }),
      })
        .then((res) => (res.ok ? res.blob() : null))
        .then(async (blob) => (blob ? { url: URL.createObjectURL(blob), env: await envelopeOf(blob) } : null))
        .catch(() => null);
    }

    function enqueueSpeech(text, turn) {
      const clean = text.trim();
      if (turn !== speechTurn || !/[\p{L}\p{N}]/u.test(clean)) return;
      speechQueue.push(fetchSpeech(clean));
      playNextSpeech();
    }

    async function playNextSpeech() {
      if (speechPlaying) return;
      const next = speechQueue.shift();
      if (!next) return settleOrb();
      speechPlaying = true;
      const turn = speechTurn;
      const clip = await next;
      if (turn !== speechTurn) {
        if (clip) URL.revokeObjectURL(clip.url);
        return;
      }
      if (!clip) {
        speechPlaying = false;
        return playNextSpeech();
      }
      voiceEnv = clip.env;
      voiceOut.src = clip.url;
      orbSet("speaking");
      voiceOut.play().catch(() => {
        if (turn === speechTurn) doneSpeaking();
      });
      // 播放器卡住不报 ended 时，照这句的真实长度往下走，白环不会一直挂着
      const seconds = clip.env ? clip.env.length / ENVELOPE_HZ : 20;
      clipWatch = setTimeout(() => {
        if (turn === speechTurn) doneSpeaking();
      }, seconds * 1000 + 3000);
    }

    function doneSpeaking() {
      clearTimeout(clipWatch);
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
      voiceEnv = null;
      speechPlaying = false;
      playNextSpeech();
    }

    voiceOut.addEventListener("ended", doneSpeaking);

    function stopSpeaking() {
      clearTimeout(clipWatch);
      speechTurn += 1;
      for (const p of speechQueue) p.then((clip) => clip && URL.revokeObjectURL(clip.url));
      speechQueue = [];
      speechOpen = false;
      speechPlaying = false;
      voiceEnv = null;
      if (!voiceOut.paused) voiceOut.pause();
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
    }

    function sentenceEnd(text, from) {
      for (let i = from; i < text.length; i++) {
        const stop = SENTENCE_STOPS.includes(text[i]) || (text[i] === "." && /\s/.test(text[i + 1] || ""));
        if (stop && text.slice(from, i + 1).trim().length >= 4) return i + 1;
      }
      return -1;
    }

    // 一句写完就送去念，不等整段写完
    function speakerFor() {
      let turn = speechTurn;
      let text = "";
      let said = 0;
      speechOpen = true;
      const close = () => {
        if (turn === speechTurn) speechOpen = false;
        settleOrb();
      };
      return {
        feed(full) {
          text = full;
          for (let end = sentenceEnd(text, said); end > 0; end = sentenceEnd(text, said)) {
            enqueueSpeech(text.slice(said, end), turn);
            said = end;
          }
        },
        // 她去查工具了：之前写的字屏幕上会换掉，念到一半的也一起作废，免得同一件事说两遍
        reset() {
          if (turn !== speechTurn) return;
          stopSpeaking();
          turn = speechTurn;
          speechOpen = true;
          text = "";
          said = 0;
          orbSet("thinking");
        },
        end(reply) {
          enqueueSpeech((text || reply || "").slice(said), turn);
          close();
        },
        cancel: close,
      };
    }

    function pickMime() {
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      for (const t of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    // ---- 说话：像微信——点左边切到「按住 说话」，按住就录、松手就发、上滑取消 ----
    const holdBtn = document.getElementById("hold");
    const voiceHint = document.getElementById("voiceHint");
    const MODE_KEY = "pa.inputMode";
    const MIN_HOLD_MS = 600;
    const CANCEL_PX = 60;
    let press = null; // 正按着：{ id, y, at, cancel }
    let hintTimer = 0;

    function setMode(voice) {
      form.classList.toggle("voice", voice);
      voiceLabels();
      micBtn.setAttribute("aria-label", voice ? "切换到打字" : "切换到说话");
      try { localStorage.setItem(MODE_KEY, voice ? "voice" : "text"); } catch (e) {}
      // 切过来这一下就把麦克风打开：权限框在这时弹，而不是在他按住的时候弹
      if (voice) ensureMic();
      else {
        closeMic();
        input.focus();
      }
    }

    // 麦克风开一次就一直开着，直到 Friday 退到后台：每次按住都立刻开录，iPhone 也不会反复问权限
    async function ensureMic() {
      if (mediaStream && mediaStream.getAudioTracks().some((t) => t.readyState === "live")) return true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        flashHint("这里不能录音：用 Safari 或 Chrome 打开");
        return false;
      }
      try {
        const ctx = unlockVoice();
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (ctx) {
          micSource = ctx.createMediaStreamSource(mediaStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = levelBuf.length;
          micSource.connect(micAnalyser);
        }
        return true;
      } catch (e) {
        flashHint("没有麦克风权限：到设置里给 Friday 打开");
        return false;
      }
    }

    function closeMic() {
      if (press) {
        press.cancel = true;
        endHold();
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      micAnalyser = null;
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
    }

    function flashHint(text) {
      voiceHint.textContent = text;
      voiceHint.className = "on";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { if (!press) voiceHint.className = ""; }, 1600);
    }

    function showHolding() {
      const cancel = !!(press && press.cancel);
      holdBtn.classList.toggle("holding", !!press);
      holdBtn.classList.toggle("cancel", cancel);
      if (press) holdBtn.querySelector(".label").textContent = cancel ? "松开 取消" : "松开 发送";
      else voiceLabels();
      if (press) {
        clearTimeout(hintTimer);
        voiceHint.textContent = cancel ? "松开手指，取消发送" : "松开发送，上滑取消";
        voiceHint.className = cancel ? "on cancel" : "on";
      } else if (!hintTimer || voiceHint.className.includes("cancel")) {
        voiceHint.className = "";
      }
    }

    async function startHold(e) {
      e.preventDefault();
      if (press) return;
      try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
      const interrupting = orbState === "speaking";
      stopSpeaking(); // 她正在说：你一碰她就停
      hintTimer = 0;
      press = { id: e.pointerId, y: e.clientY, at: Date.now(), cancel: false, interrupting };
      showHolding();
      const fresh = !mediaStream;
      if (!(await ensureMic())) {
        press = null;
        showHolding();
        return;
      }
      if (!press) {
        // 第一次弹权限框的时候手指已经松开了：这次不算，告诉他可以说了
        if (fresh) flashHint("好了，按住说话");
        return;
      }
      recordChunks = [];
      const mime = pickMime();
      mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size) recordChunks.push(ev.data);
      };
      mediaRecorder.start();
      press.at = Date.now();
      orbSet("listening");
      recordTimer = setTimeout(endHold, RECORD_MAX_MS);
    }

    function moveHold(e) {
      if (!press || e.pointerId !== press.id) return;
      const cancel = press.y - e.clientY > CANCEL_PX;
      if (cancel !== press.cancel) {
        press.cancel = cancel;
        showHolding();
      }
    }

    function endHold() {
      clearTimeout(recordTimer);
      const done = press;
      press = null;
      showHolding();
      const recorder = mediaRecorder;
      mediaRecorder = null;
      if (!recorder || recorder.state !== "recording") {
        settleOrb();
        return;
      }
      const mime = recorder.mimeType || "audio/webm";
      const tooShort = !done || Date.now() - done.at < MIN_HOLD_MS;
      const cancelled = !!(done && done.cancel);
      recorder.onstop = () => {
        const blob = new Blob(recordChunks, { type: mime });
        recordChunks = [];
        if (cancelled || tooShort || !blob.size) {
          orbSet("");
          if (!cancelled && !(done && done.interrupting)) flashHint("说话时间太短");
          return;
        }
        sendVoice(blob, mime);
      };
      try {
        recorder.stop();
      } catch (err) {
        orbSet("");
      }
    }

    // 松手气泡就出来；录音一趟传上去：转写好了先填进气泡（heard），她紧接着就回，不再多跑一趟
    async function sendVoice(blob, mime) {
      const mine = group("user");
      const heard = bubble(mine, null);
      heard.innerHTML = DOTS;
      await whenIdle();
      setBusy(true);
      clearActions();
      const g = group("assistant");
      g.hidden = true; // 听清之前先不摆她的气泡
      const reply = herReply(g);
      const view = replyView(reply);
      let speaker = null;
      view.onHeard = (ev) => {
        heard.textContent = ev.text;
        const said = { role: "user", content: ev.text, at: Date.now() };
        session.messages.push(said);
        Object.assign(reply, { mine: heard, said });
        g.hidden = false;
        reply.busy();
        // 只有他明说要听（「念给我听」）才出声
        if (ev.spoken) {
          speaker = speakerFor();
          Object.assign(view, replyView(reply, speaker));
        }
        scrollDown();
      };
      try {
        const formData = new FormData();
        const ext = mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
        formData.append("file", blob, "speech." + ext);
        if (session && session.id) formData.append("conversation_id", session.id);
        const result = await stream("/api/voice/ask", formData, view);
        finish(reply, result);
        if (speaker) speaker.end(result.reply);
      } catch (e) {
        if (g.hidden) {
          mine.remove();
          g.remove();
          note(calm(e));
        } else {
          fail(reply, e);
        }
        if (speaker) speaker.cancel();
      } finally {
        settleOrb();
        setBusy(false);
      }
    }

    function whenIdle() {
      return new Promise((resolve) => {
        const check = () => (busy || !ready ? setTimeout(check, 120) : resolve());
        check();
      });
    }

    // 她先开口：问候、此刻最该知道的那句、今天的时间线，接在那条对话的最后
    async function presence() {
      setBusy(true);
      // 上一次开场之后什么都没聊：这次的替掉它，不叠两遍
      const last = session.messages[session.messages.length - 1];
      if (last && last.agenda) {
        session.messages.pop();
        renderThread();
      }
      foldOpeners();
      const g = group("assistant");
      g.classList.add("opener", "full");
      pending(g);
      let head = null;
      let card = null;
      const view = {
        onAgenda(c) {
          card = c;
          clearPending(g);
          if (c.hello) bubble(g, c.hello);
          head = bubble(g, null, "say");
          head.innerHTML = DOTS;
          attachToday(g, c);
        },
        onDelta(text) {
          if (head) fillSay(head, text);
        },
      };
      try {
        const result = await stream("/api/presence/stream", { conversation_id: session.id }, view);
        clearPending(g);
        if (!head && result.reply) head = bubble(g, null, "say");
        if (head && result.reply) fillSay(head, result.reply);
        else if (head) head.remove();
        session.messages.push({ id: result.id, role: "assistant", content: result.reply, tools: [], agenda: card || {}, at: Date.now() });
        offerPush(g);
      } catch (e) {
        clearPending(g);
        if (head) head.remove();
        bubble(g, calm(e), "note");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    // 打开、登录之后、叫回窗口没准备好时都走这里：接上那条对话；放久了就请她开场
    async function boot() {
      ready = await checkHealth();
      if (!ready) return;
      const latest = await loadSession();
      if (!latest) return;
      session = latest;
      renderThread();
      if (needsOpener(session)) await presence();
      else input.focus();
    }

    // 叫回窗口：别的设备上接着聊过，就把那几句也显示出来；放久了请她开场；否则趁他打字先把日历读好
    async function onReturn() {
      if (document.visibilityState !== "visible" || busy) return;
      input.focus();
      if (!ready || !session) return boot();
      const latest = await loadSession();
      if (busy || !latest) return;
      const a = session.messages;
      const b = latest.messages;
      const moved = a.length !== b.length || (b.length && a.length && a[a.length - 1].id !== b[b.length - 1].id);
      session.id = latest.id;
      if (moved) {
        session = latest;
        renderThread();
      }
      if (needsOpener(session)) return presence();
      fetch("/api/calendar/warm", { method: "POST", credentials: "include", headers: authHeaders() }).catch(() => {});
    }

    // 只有他明说要听（「念给我听」「听听你的声音」）才念出来；按住说话的那句也一样
    function wantsVoice(text) {
      return /听听|听你|你的声音|念给|读给|说两句|说句话|hear (your )?voice|speak (to me|up)|say something/i.test(text || "");
    }

    async function ask(message, opts) {
      if (busy || !ready) return;
      stopSpeaking();
      const speak = !!(opts && opts.speak) || wantsVoice(message);
      const speaker = speak ? speakerFor() : null;
      if (!speaker) settleOrb();
      setBusy(true);
      clearActions();
      const mine = bubble(group("user"), message);
      const said = { role: "user", content: message, at: Date.now() };
      session.messages.push(said);
      const reply = herReply(group("assistant"));
      Object.assign(reply, { mine, said });
      reply.busy();
      try {
        const result = await stream(
          "/api/chat/stream",
          { message, conversation_id: session.id, spoken: !!speaker },
          replyView(reply, speaker),
        );
        finish(reply, result);
        if (speaker) speaker.end(result.reply);
      } catch (e) {
        fail(reply, e);
        if (speaker) speaker.cancel();
      } finally {
        setBusy(false);
        // 开口说的那轮不弹键盘
        if (!speaker) input.focus();
      }
    }

    async function checkHealth() {
      try {
        if (!(await ensureSignedIn())) return false;
        const res = await fetch("/api/health", { credentials: "include", headers: authHeaders() });
        const data = await res.json();
        if (!data.has_openai_api_key) {
          note("缺少 OPENAI_API_KEY：在 .env 里填好后，双击 Friday.cmd 重开。");
          return false;
        }
        return true;
      } catch (e) {
        note("连不上 Friday：电脑上的服务开着吗？云上打开 friday-jimmy.fly.dev。");
        return false;
      }
    }

    function fitInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (mediaRecorder && mediaRecorder.state === "recording") return;
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      fitInput();
      ask(message);
    });

    micBtn.addEventListener("click", () => {
      if (orbState === "speaking" && !form.classList.contains("voice")) {
        stopSpeaking();
        settleOrb();
        return;
      }
      setMode(!form.classList.contains("voice"));
    });
    holdBtn.addEventListener("pointerdown", startHold);
    holdBtn.addEventListener("pointermove", moveHold);
    holdBtn.addEventListener("pointerup", (e) => { if (press && e.pointerId === press.id) endHold(); });
    holdBtn.addEventListener("pointercancel", () => {
      if (!press) return;
      press.cancel = true;
      endHold();
    });
    holdBtn.addEventListener("contextmenu", (e) => e.preventDefault());
    // 键盘：在「按住 说话」上按住空格说，松开发
    holdBtn.addEventListener("keydown", (e) => {
      if (e.key !== " " || e.repeat || press) return;
      startHold({ preventDefault: () => e.preventDefault(), pointerId: -1, clientY: 0 });
    });
    holdBtn.addEventListener("keyup", (e) => { if (e.key === " " && press) endHold(); });
    // 退到后台就把麦克风关掉；回来按住时再开
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") closeMic(); });
    try {
      if (localStorage.getItem(MODE_KEY) === "voice") {
        form.classList.add("voice");
        micBtn.textContent = "打字";
        micBtn.setAttribute("aria-label", "切换到打字");
      }
    } catch (e) {}


    input.addEventListener("input", fitInput);

    // 中文输入法选词时的回车不算发送
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = unlockInput.value.trim();
      if (!t) return;
      try {
        await loginWithPassword(t);
        unlockInput.value = "";
        showUnlock(false);
        await boot();
      } catch (err) {
        unlockInput.value = "";
        unlockInput.placeholder = (err && err.message) || "密码不对";
        unlockInput.focus();
      }
    });

    document.addEventListener("visibilitychange", onReturn);
    window.addEventListener("focus", onReturn);

    (async () => {
      await boot();
      // 从「会快到了」的提醒点进来：开场之后直接准备
      if (pendingAsk && ready) {
        const message = pendingAsk;
        pendingAsk = "";
        await ask(message);
      }
    })();
  </script>
</body>
</html>
