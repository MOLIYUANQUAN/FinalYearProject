<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f5c4c" />
  <title>Friday</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <style>
    :root {
      --bg: #f3f0ea;
      --ink: #1c1a16;
      --soft: #5c574e;
      --muted: #8f897d;
      --line: #e2dccf;
      --panel: #fffcf7;
      --accent: #0f5c4c;
      --danger: #8b2e2e;
      --user: #e9e3d7;
      --radius: 12px;
      --font: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #e4efe9 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe6d8 0%, transparent 50%),
        var(--bg);
    }
    main {
      max-width: 680px;
      height: 100vh;
      margin: 0 auto;
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .right {
      display: flex;
      align-items: baseline;
      gap: 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    #newChat {
      font: inherit;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #newChat:hover { color: var(--accent); }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 2px 8px;
    }
    .msg {
      max-width: 88%;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      padding: 9px 13px;
      border-radius: var(--radius);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 11px 14px;
      border-radius: var(--radius);
    }
    .msg.error {
      align-self: stretch;
      max-width: none;
      background: #f7e4e4;
      border: 1px solid #e2bcbc;
      color: var(--danger);
      padding: 10px 13px;
      border-radius: var(--radius);
    }
    .msg a { color: var(--accent); }
    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.3;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 0.85; transform: translateY(-2px); }
    }
    .hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .actions { margin-top: 10px; display: flex; gap: 8px; }
    .actions button {
      font: inherit;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--soft);
      border-color: var(--line);
    }
    .details {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      white-space: normal;
    }
    .details summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      opacity: 0.6;
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary:hover { opacity: 1; color: var(--accent); }
    form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      line-height: 1.5;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
    }
    #input:focus {
      border-color: #b9cfc6;
      box-shadow: 0 0 0 3px rgba(15, 92, 76, 0.08);
    }
    #send {
      font: inherit;
      font-weight: 600;
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Friday</h1>
      <div class="right">
        <span id="today"></span>
        <button type="button" id="newChat">新对话</button>
      </div>
    </header>

    <div id="log" role="log" aria-live="polite"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="问我，或者告诉我一件事" autocomplete="off"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>

  <script>
    const STORE_KEY = "pa.session.v1";
    const IDLE_MS = 2 * 60 * 60 * 1000;
    const HISTORY_LIMIT = 20;
    const HINTS = {
      get_calendar_events: "看日历",
      create_calendar_event: "写日历",
      search_emails: "翻邮件",
      read_email: "读邮件",
      send_email: "发邮件",
      modify_email: "整理邮件",
      search_files: "找笔记",
      read_file: "读笔记",
      search_memory: "回想",
      remember_fact: "记下",
      forget_fact: "忘掉",
    };

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const todayEl = document.getElementById("today");
    const newChatBtn = document.getElementById("newChat");

    let session = null;
    let busy = false;
    let ready = false;

    function freshSession() {
      const now = Date.now();
      return { startedAt: now, lastActiveAt: now, messages: [] };
    }

    // 同一天、两小时内回来算同一次会话；否则重新开场
    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!s || !Array.isArray(s.messages)) return null;
        const sameDay = new Date(s.startedAt).toDateString() === new Date().toDateString();
        if (!sameDay || Date.now() - s.lastActiveAt > IDLE_MS) return null;
        return s;
      } catch (e) {
        return null;
      }
    }

    function saveSession() {
      session.lastActiveAt = Date.now();
      try { localStorage.setItem(STORE_KEY, JSON.stringify(session)); } catch (e) {}
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 模型偶尔仍会输出 Markdown：只做最小渲染，其余按纯文本显示
    function render(text) {
      return escapeHtml(text || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^(\s*)[-*•]\s+/gm, "$1· ")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (text != null) div.innerHTML = render(text);
      logEl.appendChild(div);
      scrollDown();
      return div;
    }

    function showTyping(div, hint) {
      div.innerHTML =
        '<span class="typing"><i></i><i></i><i></i></span>' +
        (hint ? '<span class="hint">' + escapeHtml(hint) + "</span>" : "");
    }

    function addDetails(div, tools) {
      const d = document.createElement("details");
      d.className = "details";
      const s = document.createElement("summary");
      s.textContent = "细节";
      const body = document.createElement("div");
      body.textContent = tools.join(" → ");
      d.append(s, body);
      div.appendChild(d);
    }

    function addConfirm(div) {
      const bar = document.createElement("div");
      bar.className = "actions";
      [
        ["确认", "确认", false],
        ["取消", "取消，先不要执行。", true],
      ].forEach(([label, message, secondary]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (secondary) b.className = "secondary";
        b.onclick = () => ask(message);
        bar.appendChild(b);
      });
      div.appendChild(bar);
    }

    function clearActions() {
      logEl.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    function renderSession() {
      logEl.innerHTML = "";
      session.messages.forEach((m, i) => {
        const div = addMessage(m.role === "user" ? "user" : "bot", m.content);
        if (m.tools && m.tools.length) addDetails(div, m.tools);
        if (m.needsConfirm && i === session.messages.length - 1) addConfirm(div);
      });
      scrollDown();
    }

    function awaitingConfirmation() {
      const last = session.messages[session.messages.length - 1];
      return !!(last && last.role === "assistant" && last.needsConfirm);
    }

    async function stream(url, payload, div) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 404) {
          throw new Error("本地服务还是旧版本：双击 Friday.cmd 重开，再刷新这页。");
        }
        throw new Error(data.detail || "请求失败：" + res.status);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let result = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;
          const ev = JSON.parse(frame.slice(6));
          if (ev.type === "delta") {
            text += ev.text;
            div.innerHTML = render(text);
            scrollDown();
          } else if (ev.type === "tool") {
            text = "";
            showTyping(div, HINTS[ev.name]);
          } else if (ev.type === "done") {
            result = { reply: ev.reply || text, tools: ev.tools_called || [] };
          } else if (ev.type === "error") {
            throw new Error(ev.message);
          }
        }
      }
      if (!result) throw new Error("连接断了，再试一次。");
      return result;
    }

    function finish(div, reply, tools) {
      div.innerHTML = render(reply);
      const needsConfirm = tools.includes("request_user_confirmation");
      if (tools.length) addDetails(div, tools);
      if (needsConfirm) addConfirm(div);
      session.messages.push({ role: "assistant", content: reply, tools, needsConfirm });
      saveSession();
      scrollDown();
    }

    function fail(div, err) {
      div.className = "msg error";
      div.textContent = (err && err.message) || String(err);
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on;
    }

    async function presence() {
      setBusy(true);
      const div = addMessage("bot");
      showTyping(div);
      try {
        const { reply } = await stream("/api/presence/stream", {}, div);
        finish(div, reply, []);
      } catch (e) {
        fail(div, e);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function ask(message) {
      if (busy || !ready) return;
      setBusy(true);
      clearActions();
      const pending = awaitingConfirmation();
      const history = session.messages
        .filter((m) => m.content && m.content.trim())
        .slice(-HISTORY_LIMIT)
        .map((m) => ({ role: m.role, content: m.content }));
      addMessage("user", message);
      session.messages.push({ role: "user", content: message });
      saveSession();
      const div = addMessage("bot");
      showTyping(div);
      try {
        const { reply, tools } = await stream(
          "/api/chat/stream",
          { message, history, pending_confirmation: pending },
          div,
        );
        finish(div, reply, tools);
      } catch (e) {
        fail(div, e);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.now_label) todayEl.textContent = data.now_label;
        if (!data.has_openai_api_key) {
          addMessage("error", "缺少 OPENAI_API_KEY：在 .env 里填好后，双击 Friday.cmd 重开。");
          return false;
        }
        return true;
      } catch (e) {
        addMessage("error", "连不上本地服务：双击 Friday.cmd 重开。");
        return false;
      }
    }

    function fitInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      fitInput();
      ask(message);
    });

    input.addEventListener("input", fitInput);

    // 中文输入法选词时的回车不算发送
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    newChatBtn.addEventListener("click", () => {
      if (busy) return;
      session = freshSession();
      saveSession();
      logEl.innerHTML = "";
      if (ready) presence();
    });

    (async () => {
      ready = await checkHealth();
      session = loadSession();
      if (session && session.messages.length) {
        renderSession();
      } else {
        session = freshSession();
        saveSession();
        if (ready) await presence();
      }
      input.focus();
    })();
  </script>
</body>
</html>
