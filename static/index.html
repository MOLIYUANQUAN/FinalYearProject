<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Agent</title>
  <style>
    :root {
      --bg: #f3f0ea;
      --ink: #1c1a16;
      --muted: #5c574e;
      --line: #d8d2c6;
      --panel: #fffcf7;
      --accent: #0f5c4c;
      --accent-soft: #dceee8;
      --danger: #8b2e2e;
      --user: #e8e2d6;
      --bot: #fffcf7;
      --radius: 10px;
      --font: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #e4efe9 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe6d8 0%, transparent 50%),
        var(--bg);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
    }
    .chip.ok { background: var(--accent-soft); color: var(--accent); border-color: #b7d6cc; }
    .chip.bad { background: #f7e4e4; color: var(--danger); border-color: #e2bcbc; }
    #log {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      overflow-y: auto;
      min-height: 360px;
      max-height: min(58vh, 560px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
    }
    .msg.system {
      align-self: stretch;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .msg.error {
      align-self: stretch;
      background: #f7e4e4;
      border-color: #e2bcbc;
      color: var(--danger);
    }
    .actions {
      margin-top: 8px;
    }
    .actions button {
      font: inherit;
      font-size: 0.85rem;
      padding: 6px 12px;
      margin-right: 8px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .actions button.secondary {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }
    .tools-fold {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }
    .tools-fold summary {
      cursor: pointer;
      user-select: none;
      color: var(--muted);
    }
    .tools-fold summary:hover { color: var(--accent); }
    form {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    #input {
      flex: 1;
      font: inherit;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      resize: vertical;
      min-height: 48px;
      max-height: 140px;
    }
    #send {
      font: inherit;
      font-weight: 600;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      min-width: 88px;
    }
    #send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    footer {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Personal Agent</h1>
      <p>认识你 · 盯住生活碎片 · 带主见回应</p>
      <div class="meta">
        <span class="chip" id="keyStatus">检查中…</span>
        <span class="chip" id="dateChip">—</span>
      </div>
    </header>

    <div id="log" role="log" aria-live="polite"></div>

    <form id="form">
      <textarea id="input" rows="2" placeholder="直接说你需要什么" required></textarea>
      <button id="send" type="submit">发送</button>
    </form>

    <footer>读操作自动完成；写/发前会请你确认一次。</footer>
  </main>

  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const keyStatus = document.getElementById("keyStatus");
    const dateChip = document.getElementById("dateChip");
    /** @type {{role: string, content: string}[]} */
    const history = [];

    function append(role, text, toolsText, actions) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.appendChild(document.createTextNode(text));
      if (toolsText) {
        const details = document.createElement("details");
        details.className = "tools-fold";
        const summary = document.createElement("summary");
        summary.textContent = "细节";
        details.appendChild(summary);
        const body = document.createElement("div");
        body.textContent = toolsText;
        details.appendChild(body);
        div.appendChild(details);
      }
      if (actions && actions.length) {
        const bar = document.createElement("div");
        bar.className = "actions";
        actions.forEach((a) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = a.label;
          if (a.secondary) b.className = "secondary";
          b.onclick = () => chat(a.message);
          bar.appendChild(b);
        });
        div.appendChild(bar);
      }
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      send.disabled = busy;
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        const cal = data.calendar_backend || "mock";
        const mail = data.mail_backend || "none";
        dateChip.textContent =
          cal + (mail !== "none" ? " · " + mail : "") +
          " · " + data.effective_today + " → " + data.effective_tomorrow;
        if (data.has_openai_api_key) {
          keyStatus.textContent = "已就绪";
          keyStatus.className = "chip ok";
          return true;
        }
        keyStatus.textContent = "缺少 API Key";
        keyStatus.className = "chip bad";
        append("system", "请在 .env 填入 OPENAI_API_KEY 后重启。");
        return false;
      } catch (e) {
        keyStatus.textContent = "无法连接";
        keyStatus.className = "chip bad";
        return false;
      }
    }

    function renderReply(data) {
      history.push({ role: "assistant", content: data.reply });
      if (history.length > 20) history.splice(0, history.length - 20);
      const tools = (data.tools_called || []).length
        ? data.tools_called.join(" → ")
        : null;
      const needsConfirm = (data.tools_called || []).includes("request_user_confirmation");
      const actions = needsConfirm
        ? [
            { label: "确认", message: "确认" },
            { label: "取消", message: "取消，先不要执行。", secondary: true },
          ]
        : null;
      append("bot", data.reply, tools, actions);
    }

    async function loadPresence() {
      setBusy(true);
      const thinking = append("system", "…");
      try {
        const res = await fetch("/api/presence", { method: "POST" });
        const data = await res.json().catch(() => ({}));
        thinking.remove();
        if (!res.ok) {
          const hint =
            res.status === 404
              ? "开场接口不存在：请停掉旧服务后重新运行 .\\scripts\\start.ps1，再 Ctrl+F5。"
              : (data.detail || ("就绪失败：" + res.status));
          append("error", hint);
          return;
        }
        // 开场不把系统提示塞进可见 user 气泡；历史只保留助手态势
        renderReply(data);
      } catch (e) {
        thinking.remove();
        append("error", "网络或服务错误：" + e.message);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function chat(message) {
      setBusy(true);
      append("user", message);
      const thinking = append("system", "…");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json().catch(() => ({}));
        thinking.remove();
        if (!res.ok) {
          append("error", data.detail || ("请求失败：" + res.status));
          return;
        }
        history.push({ role: "user", content: message });
        renderReply(data);
      } catch (e) {
        thinking.remove();
        append("error", "网络或服务错误：" + e.message);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      chat(msg);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    (async () => {
      const ok = await refreshHealth();
      if (ok) await loadPresence();
    })();
  </script>
</body>
</html>
