<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Friday</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #000000;
      --soft: #3a3a3c;
      --muted: #8e8e93;
      --line: #d2d2d7;
      --panel: #ffffff;
      --accent: #000000;
      --brand: #000000;
      --on-brand: #ffffff;
      --focus-line: #000000;
      --focus-ring: rgba(0, 0, 0, 0.08);
      --danger: #ff3b30;
      --danger-bg: #fff2f1;
      --danger-line: #ffc4c0;
      --user: #f2f2f7;
      --radius: 14px;
      /* iPhone 上就是 SF；Windows 用近黑体。品牌感靠黑白与字距，不靠花色 */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      --mono: "SF Mono", ui-monospace, "Cascadia Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --soft: #d1d1d6;
        --muted: #8e8e93;
        --line: #2c2c2e;
        --panel: #000000;
        --accent: #f5f5f7;
        --brand: #f5f5f7;
        --on-brand: #000000;
        --focus-line: #f5f5f7;
        --focus-ring: rgba(255, 255, 255, 0.12);
        --danger: #ff453a;
        --danger-bg: #1c0504;
        --danger-line: #5c1a16;
        --user: #1c1c1e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: max(22px, env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.045em;
    }
    .right {
      display: flex;
      align-items: baseline;
      gap: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 400;
    }
    #newChat {
      font: inherit;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #newChat:hover { color: var(--ink); }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 8px 2px 10px;
    }
    .msg {
      max-width: 88%;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      padding: 10px 14px;
      border-radius: var(--radius);
    }
    .msg.bot {
      align-self: flex-start;
      background: transparent;
      border: none;
      padding: 2px 0;
    }
    .msg.error {
      align-self: stretch;
      max-width: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-line);
      color: var(--danger);
      padding: 10px 13px;
      border-radius: var(--radius);
    }
    .msg a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .msg.today {
      align-self: stretch;
      max-width: none;
      padding: 4px 0 8px;
      white-space: normal;
      border: none;
      background: transparent;
    }
    .today .hello {
      margin-bottom: 14px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .today section + section { margin-top: 14px; }
    .today h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .today .row {
      display: grid;
      grid-template-columns: 6.6em minmax(0, 1fr);
      column-gap: 10px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .today time {
      color: var(--soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .today .row.now time { color: var(--ink); font-weight: 600; }
    .today .tag {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .today .where {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .today .empty {
      margin: 0;
      padding: 3px 0;
      color: var(--muted);
    }
    .today .say {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      font-size: 1.05rem;
      letter-spacing: -0.015em;
    }
    .today .say:empty { display: none; }
    .today .say.failed { color: var(--danger); }
    @media (prefers-reduced-motion: no-preference) {
      .msg, .today > * { animation: rise 0.28s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    }
    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.35;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 0.9; transform: translateY(-2px); }
    }
    .hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .actions { margin-top: 12px; display: flex; gap: 8px; }
    .actions button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--brand);
      background: var(--brand);
      color: var(--on-brand);
      cursor: pointer;
      touch-action: manipulation;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .actions .hint { margin-left: 0; }
    .details {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      white-space: normal;
    }
    .details summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      opacity: 0.55;
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary:hover { opacity: 1; color: var(--ink); }
    form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      color: var(--ink);
    }
    #input:focus {
      border-color: var(--focus-line);
      background: var(--panel);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    #send {
      font: inherit;
      font-weight: 600;
      height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--on-brand);
      cursor: pointer;
    }
    #send:disabled { opacity: 0.35; cursor: default; }
    #unlock {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #unlock.visible { display: flex; }
    #unlock p { margin: 0; color: var(--soft); line-height: 1.55; }
    #unlock form { display: flex; gap: 8px; }
    #unlock input {
      flex: 1;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      color: var(--ink);
      outline: none;
    }
    #unlock button {
      font: inherit;
      font-weight: 600;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--on-brand);
      touch-action: manipulation;
    }
    @media (max-width: 520px) {
      main { gap: 12px; }
      header h1 { font-size: 1.4rem; }
      #newChat { min-height: 44px; padding: 0 4px; }
      .msg { max-width: 94%; }
      .today .row { grid-template-columns: 5.2em minmax(0, 1fr); }
      #input { font-size: 16px; min-height: 48px; }
      #send { min-width: 4.5rem; min-height: 48px; touch-action: manipulation; }
      .actions { flex-wrap: wrap; }
      .actions button { min-height: 44px; flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Friday</h1>
      <div class="right">
        <span id="today"></span>
        <button type="button" id="newChat">新对话</button>
      </div>
    </header>

    <div id="unlock" aria-live="polite">
      <p>从外面打开需要访问码。用电脑上脚本给出的链接，或把码粘在下面。</p>
      <form id="unlockForm">
        <input id="unlockInput" type="password" autocomplete="current-password" placeholder="访问码" />
        <button type="submit">进入</button>
      </form>
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="问我，或者告诉我一件事" autocomplete="off" enterkeyhint="send"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>

  <script>
    const STORE_KEY = "pa.session.v1";
    const ACCESS_KEY = "pa.access";
    const IDLE_MS = 2 * 60 * 60 * 1000;
    const CARD_FRESH_MS = 15 * 60 * 1000;
    const HISTORY_LIMIT = 20;
    const HINTS = {
      get_calendar_events: "看日历",
      create_calendar_event: "写日历",
      search_emails: "翻邮件",
      read_email: "读邮件",
      send_email: "发邮件",
      modify_email: "整理邮件",
      search_files: "找笔记",
      read_file: "读笔记",
      search_memory: "回想",
      remember_fact: "记下",
      forget_fact: "忘掉",
      add_task: "记下",
      complete_task: "划掉",
    };

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const todayEl = document.getElementById("today");
    const newChatBtn = document.getElementById("newChat");
    const unlockEl = document.getElementById("unlock");
    const unlockForm = document.getElementById("unlockForm");
    const unlockInput = document.getElementById("unlockInput");

    let session = null;
    let busy = false;
    let ready = false;

    (function takeAccessFromUrl() {
      try {
        // 旧版存在 sessionStorage，关掉就丢；迁到 localStorage 长期记住
        const legacy = sessionStorage.getItem(ACCESS_KEY);
        if (legacy && !localStorage.getItem(ACCESS_KEY)) {
          localStorage.setItem(ACCESS_KEY, legacy);
          sessionStorage.removeItem(ACCESS_KEY);
        }
        const u = new URL(location.href);
        const t = u.searchParams.get("access");
        if (!t) return;
        localStorage.setItem(ACCESS_KEY, t);
        sessionStorage.removeItem(ACCESS_KEY);
        u.searchParams.delete("access");
        history.replaceState({}, "", u.pathname + u.search + u.hash);
      } catch (e) {}
    })();

    function accessToken() {
      return localStorage.getItem(ACCESS_KEY) || sessionStorage.getItem(ACCESS_KEY) || "";
    }

    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      const t = accessToken();
      if (t) headers.Authorization = "Bearer " + t;
      return headers;
    }

    function showUnlock(on) {
      unlockEl.classList.toggle("visible", !!on);
      form.style.display = on ? "none" : "";
      if (on) unlockInput.focus();
    }

    function freshSession() {
      const now = Date.now();
      return { startedAt: now, lastActiveAt: now, messages: [] };
    }

    // 同一天、两小时内回来算同一次会话；否则重新开场
    function expired(s) {
      const sameDay = new Date(s.startedAt).toDateString() === new Date().toDateString();
      return !sameDay || Date.now() - s.lastActiveAt > IDLE_MS;
    }

    // 只看了开场、还没聊：开场过了一刻钟就换成此刻的
    function onlyStaleOpener(s) {
      const [first, ...rest] = s.messages;
      return !rest.length && !!first && first.role === "assistant" && Date.now() - (first.at || 0) > CARD_FRESH_MS;
    }

    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!s || !Array.isArray(s.messages) || expired(s)) return null;
        return s;
      } catch (e) {
        return null;
      }
    }

    function saveSession() {
      session.lastActiveAt = Date.now();
      try { localStorage.setItem(STORE_KEY, JSON.stringify(session)); } catch (e) {}
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 模型偶尔仍会输出 Markdown：只做最小渲染，其余按纯文本显示
    function render(text) {
      return escapeHtml(text || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^(\s*)[-*•]\s+/gm, "$1· ")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (text != null) div.innerHTML = render(text);
      logEl.appendChild(div);
      scrollDown();
      return div;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    // 卡片上的安排是服务端读到的原样数据，不经过模型；返回写那句判断的位置
    function drawToday(div, card) {
      div.className = "msg bot today";
      div.replaceChildren(el("div", "hello", card.hello));
      if (card.error) div.append(el("p", "empty", card.error));
      for (const section of card.sections || []) {
        const box = el("section");
        // 空的日子只占一行、退到后面；版面留给真要去的事
        const head = el("h3");
        head.append(el("span", "", section.label));
        const side = section.rows.length ? section.meta : section.empty;
        if (side) head.append(el("span", "", side));
        box.append(head);
        for (const row of section.rows) {
          const line = el("div", row.now ? "row now" : "row");
          const what = el("div", "what", row.title);
          if (row.now) what.append(el("span", "tag", "进行中"));
          if (row.where) what.append(el("span", "where", row.where));
          line.append(el("time", "", row.time), what);
          box.append(line);
        }
        div.append(box);
      }
      const say = el("div", "say");
      div.append(say);
      return say;
    }

    function showTyping(div, hint) {
      div.innerHTML =
        '<span class="typing"><i></i><i></i><i></i></span>' +
        (hint ? '<span class="hint">' + escapeHtml(hint) + "</span>" : "");
    }

    function addDetails(div, tools) {
      const d = document.createElement("details");
      d.className = "details";
      const s = document.createElement("summary");
      s.textContent = "细节";
      const body = document.createElement("div");
      body.textContent = tools.join(" → ");
      d.append(s, body);
      div.appendChild(d);
    }

    function addConfirm(div) {
      const bar = document.createElement("div");
      bar.className = "actions";
      [
        ["确认", "确认", false],
        ["取消", "取消，先不要执行。", true],
      ].forEach(([label, message, secondary]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (secondary) b.className = "secondary";
        b.onclick = () => ask(message);
        bar.appendChild(b);
      });
      div.appendChild(bar);
    }

    // 记下或划掉的待办不先问他，只在下面放一个「撤销」：直接撤回，不经过模型
    function addUndo(div, m) {
      const bar = el("div", "actions");
      const b = el("button", "secondary", "撤销");
      b.type = "button";
      b.onclick = async () => {
        b.disabled = true;
        try {
          const res = await fetch("/api/undo", {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ items: m.undo }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            showUnlock(true);
            throw new Error("访问码不对或过期了，再进一次。");
          }
          if (!res.ok) throw new Error(data.detail || "没撤销成功。");
          m.undone = true;
          m.content += "（已撤销）";
          saveSession();
          bar.replaceChildren(el("span", "hint", "已撤销"));
        } catch (e) {
          bar.replaceChildren(el("span", "hint", (e && e.message) || String(e)));
        }
      };
      bar.append(b);
      div.appendChild(bar);
    }

    function clearActions() {
      logEl.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    function renderSession() {
      logEl.innerHTML = "";
      session.messages.forEach((m, i) => {
        const div = addMessage(m.role === "user" ? "user" : "bot", m.agenda ? null : m.content);
        if (m.agenda) drawToday(div, m.agenda).innerHTML = render(m.content);
        if (m.tools && m.tools.length) addDetails(div, m.tools);
        const last = i === session.messages.length - 1;
        if (m.needsConfirm && last) addConfirm(div);
        if (m.undo && m.undo.length && !m.undone && last) addUndo(div, m);
      });
      scrollDown();
    }

    function awaitingConfirmation() {
      const last = session.messages[session.messages.length - 1];
      return !!(last && last.role === "assistant" && last.needsConfirm);
    }

    // view.el 是正在写字的位置；开场的卡片到了以后它会换成卡片里那句判断
    async function stream(url, payload, view) {
      const res = await fetch(url, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload || {}),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要访问码才能聊。");
        }
        if (res.status === 404) {
          throw new Error("本地服务还是旧版本：双击 Friday.cmd 重开，再刷新这页。");
        }
        throw new Error(data.detail || "请求失败：" + res.status);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let result = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;
          const ev = JSON.parse(frame.slice(6));
          if (ev.type === "agenda") {
            view.onAgenda(ev);
            scrollDown();
          } else if (ev.type === "delta") {
            text += ev.text;
            view.el.innerHTML = render(text);
            scrollDown();
          } else if (ev.type === "tool") {
            text = "";
            showTyping(view.el, HINTS[ev.name]);
          } else if (ev.type === "done") {
            result = { reply: ev.reply || text, tools: ev.tools_called || [], undo: ev.undo || [] };
          } else if (ev.type === "error") {
            throw new Error(ev.message);
          }
        }
      }
      if (!result) throw new Error("连接断了，再试一次。");
      return result;
    }

    function finish(div, reply, tools, undo = []) {
      div.innerHTML = render(reply);
      const needsConfirm = tools.includes("request_user_confirmation");
      const m = { role: "assistant", content: reply, tools, needsConfirm, undo };
      if (tools.length) addDetails(div, tools);
      if (needsConfirm) addConfirm(div);
      if (undo.length) addUndo(div, m);
      session.messages.push(m);
      saveSession();
      scrollDown();
    }

    function fail(div, err) {
      div.className = "msg error";
      div.textContent = (err && err.message) || String(err);
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on;
    }

    async function presence() {
      setBusy(true);
      const div = addMessage("bot");
      showTyping(div);
      const view = {
        el: div,
        card: null,
        onAgenda(card) {
          view.card = card;
          view.el = drawToday(div, card);
          showTyping(view.el);
        },
      };
      try {
        const { reply } = await stream("/api/presence/stream", {}, view);
        if (!view.card) {
          finish(div, reply, []);
          return;
        }
        view.el.innerHTML = render(reply);
        session.messages.push({ role: "assistant", content: reply, tools: [], agenda: view.card, at: Date.now() });
        saveSession();
        scrollDown();
      } catch (e) {
        if (!view.card) {
          fail(div, e);
          return;
        }
        // 安排已经在了：那句判断没出来，就在卡片里说一声，卡片照样留着
        view.el.classList.add("failed");
        view.el.textContent = (e && e.message) || String(e);
        session.messages.push({ role: "assistant", content: "", tools: [], agenda: view.card, at: Date.now() });
        saveSession();
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function startOver() {
      setBusy(true);
      session = freshSession();
      saveSession();
      logEl.innerHTML = "";
      ready = await checkHealth();
      setBusy(false);
      if (ready) await presence();
    }

    // 叫回窗口：光标回到输入框；放久了，开场换成此刻的；否则趁他打字先把日历读好
    async function onReturn() {
      if (document.visibilityState !== "visible" || busy || !session) return;
      input.focus();
      if (!ready || expired(session) || onlyStaleOpener(session)) await startOver();
      else fetch("/api/calendar/warm", { method: "POST", headers: authHeaders() }).catch(() => {});
    }

    async function ask(message) {
      if (busy || !ready) return;
      setBusy(true);
      clearActions();
      const pending = awaitingConfirmation();
      const history = session.messages
        .filter((m) => m.content && m.content.trim())
        .slice(-HISTORY_LIMIT)
        .map((m) => ({ role: m.role, content: m.content }));
      addMessage("user", message);
      session.messages.push({ role: "user", content: message });
      saveSession();
      const div = addMessage("bot");
      showTyping(div);
      try {
        const { reply, tools, undo } = await stream(
          "/api/chat/stream",
          { message, history, pending_confirmation: pending },
          { el: div },
        );
        finish(div, reply, tools, undo);
      } catch (e) {
        fail(div, e);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function checkHealth() {
      try {
        const res = await fetch("/api/health", { headers: authHeaders() });
        if (res.status === 401) {
          showUnlock(true);
          return false;
        }
        const data = await res.json();
        showUnlock(false);
        if (data.now_label) todayEl.textContent = data.now_label;
        if (!data.has_openai_api_key) {
          addMessage("error", "缺少 OPENAI_API_KEY：在 .env 里填好后，双击 Friday.cmd 重开。");
          return false;
        }
        return true;
      } catch (e) {
        addMessage("error", "连不上 Friday：电脑上的服务开着吗？手机要用脚本给出的链接。");
        return false;
      }
    }

    function fitInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      fitInput();
      ask(message);
    });

    input.addEventListener("input", fitInput);

    // 中文输入法选词时的回车不算发送
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    newChatBtn.addEventListener("click", () => {
      if (!busy) startOver();
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = unlockInput.value.trim();
      if (!t) return;
      localStorage.setItem(ACCESS_KEY, t);
      sessionStorage.removeItem(ACCESS_KEY);
      unlockInput.value = "";
      showUnlock(false);
      await startOver();
    });

    document.addEventListener("visibilitychange", onReturn);
    window.addEventListener("focus", onReturn);

    (async () => {
      session = loadSession();
      if (session && session.messages.length && !onlyStaleOpener(session)) {
        renderSession();
        ready = await checkHealth();
        if (ready) input.focus();
      } else {
        await startOver();
      }
    })();
  </script>
</body>
</html>
