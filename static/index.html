<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Friday</title>
  <link rel="icon" href="/static/icon.svg?v=ring1" type="image/svg+xml" />
  <link rel="icon" href="/static/icon-32.png?v=ring1" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png?v=ring1" />
  <link rel="manifest" href="/static/manifest.json?v=ring1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #000000;
      --soft: #3a3a3c;
      --muted: #8e8e93;
      --line: #d2d2d7;
      --panel: #ffffff;
      --accent: #000000;
      --brand: #000000;
      --on-brand: #ffffff;
      --focus-line: #000000;
      --focus-ring: rgba(0, 0, 0, 0.08);
      --danger: #ff3b30;
      --danger-bg: #fff2f1;
      --danger-line: #ffc4c0;
      --user: #f2f2f7;
      /* 气泡：他的黑底白字，她的浅灰 */
      --mine: #000000;
      --on-mine: #ffffff;
      --hers: #f2f2f7;
      --radius: 14px;
      /* iPhone 上就是 SF；Windows 用近黑体。品牌感靠黑白与字距，不靠花色 */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      --mono: "SF Mono", ui-monospace, "Cascadia Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --soft: #d1d1d6;
        --muted: #8e8e93;
        --line: #2c2c2e;
        --panel: #000000;
        --accent: #f5f5f7;
        --brand: #f5f5f7;
        --on-brand: #000000;
        --focus-line: #f5f5f7;
        --focus-ring: rgba(255, 255, 255, 0.12);
        --danger: #ff453a;
        --danger-bg: #1c0504;
        --danger-line: #5c1a16;
        --user: #1c1c1e;
        --mine: #f5f5f7;
        --on-mine: #000000;
        --hers: #1c1c1e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: max(12px, env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      padding: 4px 2px 10px;
    }
    /* 顶上一条（像 WhatsApp）：她的头像、名字、此刻在干什么；点开是她的资料页 */
    #bar { display: flex; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    #who {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 8px 2px 0;
      border: none;
      background: none;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    #who img { width: 34px; height: 34px; border-radius: 50%; }
    #who b { display: block; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
    #who small { display: block; color: var(--muted); font-size: 0.78rem; }
    #about { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); }
    #about[hidden] { display: none; }
    #about .sheet {
      max-width: 680px;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    }
    #about .top { display: flex; align-items: center; height: 44px; }
    #about .top button {
      padding: 8px 4px;
      border: none;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .profile { margin: 4px 0 22px; text-align: center; }
    .profile img { width: 76px; height: 76px; border-radius: 50%; }
    .profile h2 { margin: 10px 0 2px; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .profile p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .panel { margin-bottom: 14px; padding: 14px 16px; border-radius: 16px; background: var(--hers); }
    .panel h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .money { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; }
    .money small { color: var(--muted); font-size: 0.95rem; font-weight: 400; }
    .meter { height: 8px; margin: 8px 0 4px; overflow: hidden; border-radius: 999px; background: var(--line); }
    .meter i { display: block; height: 100%; border-radius: 999px; background: var(--ink); }
    .line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 12px;
      min-height: 44px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .panel .line:first-of-type, .panel h3 + .line { border-top: none; }
    .line .muted { color: var(--muted); text-align: right; }
    /* 窄屏放不下（比如安静时段的两个时间）就折到下一行，靠右 */
    .line > :last-child { margin-left: auto; }
    .line.bad .muted { color: var(--danger); }
    .line.tap { cursor: pointer; }
    .line.gone > span:first-child { text-decoration: line-through; opacity: 0.5; }
    .stepper { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
    .stepper button, .pill {
      min-width: 34px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .stepper.times { gap: 6px; }
    .panel input[type="time"] {
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    .panel details summary { padding-top: 8px; color: var(--muted); font-size: 0.85rem; cursor: pointer; }
    .fineprint { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; }
    /* 她记得的事：大标题、按「这周 / 这个月 / 更早」分组；点一下那条才出现删除 */
    .page-title { margin: 4px 0 2px; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
    .page-sub { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
    .find {
      width: 100%;
      margin: 0 0 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      outline: none;
      background: var(--hers);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }
    .group-label { margin: 18px 6px 6px; color: var(--muted); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; }
    .facts { overflow: hidden; border-radius: 16px; background: var(--hers); }
    .fact { padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background 0.15s ease; }
    .fact:first-child { border-top: none; }
    .fact p { margin: 0; line-height: 1.5; }
    .fact time { display: block; margin-top: 2px; color: var(--muted); font-size: 0.78rem; }
    .fact .acts { display: none; gap: 18px; margin-top: 8px; }
    .fact.open .acts, .fact.gone .acts { display: flex; }
    .fact .acts button { padding: 4px 0; border: none; background: none; color: var(--ink); font: inherit; font-size: 0.9rem; cursor: pointer; }
    .fact .acts .del { color: var(--danger); }
    .fact.gone p { text-decoration: line-through; opacity: 0.45; }
    @media (hover: hover) { .fact:hover { background: rgba(127, 127, 127, 0.07); } }
    .empty-state { margin: 40px 16px; color: var(--muted); text-align: center; line-height: 1.6; white-space: pre-line; }

    /* 一条对话：他在右、她在左，都是气泡；隔得久了中间标一下时间 */
    .stamp {
      align-self: center;
      margin: 22px 0 2px;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .group { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
    .group.mine { align-items: flex-end; }
    .group.hers { align-items: flex-start; }
    .group.mine + .group.mine, .group.hers + .group.hers { margin-top: 6px; }
    .msg {
      max-width: 82%;
      padding: 9px 14px;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }
    .msg { position: relative; }
    .msg.user { background: var(--mine); color: var(--on-mine); }
    .msg.bot { background: var(--hers); color: var(--ink); }
    .msg a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    /* 要他拍板的那件事：原样写出来，和她平常说的话分开 */
    .msg.draft { background: transparent; border: 1px solid var(--line); }
    /* 没接上之类：她平静地说一句，不是红字 */
    .msg.note { color: var(--muted); }
    /* 开场：此刻最该知道的那句，第一句加粗，补充的小一号 */
    .msg.say .head { display: block; font-weight: 600; }
    .msg.say .sub { display: block; margin-top: 2px; color: var(--muted); font-size: 0.92rem; }
    /* 她还在想、在查：一个打字的气泡，旁边一行小字说在干什么 */
    .pending { display: flex; align-items: center; gap: 10px; max-width: 100%; }
    .pending .msg { padding: 12px 14px; }
    .pending .doing { color: var(--muted); font-size: 0.85rem; }
    /* 贴在气泡上的表情（像 WhatsApp）：压在气泡下沿 */
    .msg.has-react { margin-bottom: 14px; }
    .msg .react {
      position: absolute;
      bottom: -15px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 0.85rem;
      line-height: 1.3;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }
    .msg.bot .react { left: 12px; }
    .msg.user .react, .shots .react { right: 12px; }
    .shots { position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 100%; }
    .shots.has-react { margin-bottom: 14px; }
    .shots .react {
      position: absolute;
      bottom: -15px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      font-size: 0.85rem;
      line-height: 1.3;
    }
    /* 长按（电脑上右键或悬停的笑脸）出一排表情，最后是「复制」 */
    .picker {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      white-space: nowrap;
    }
    .picker.below { bottom: auto; top: calc(100% + 6px); }
    .picker button {
      font: inherit;
      font-size: 1.35rem;
      line-height: 1;
      padding: 5px 6px;
      border: none;
      border-radius: 999px;
      background: none;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }
    .picker button.on { background: var(--hers); }
    .picker button.copy { font-size: 0.85rem; color: var(--soft); padding: 6px 8px; }
    .react-btn {
      position: absolute;
      top: 50%;
      right: -34px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    @media (hover: hover) {
      .msg:hover > .react-btn, .react-btn:focus-visible { opacity: 0.8; }
    }
    @media (hover: none) {
      .react-btn { display: none; }
      /* 手机上长按是贴表情，不弹系统的选字菜单（复制在表情条里） */
      .group.hers .msg[data-mid] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    }
    /* 推送里没下文的事：一件一行，点一下就办 */
    .followups { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 2px 4px; }
    .followup { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 0.92rem; }
    .followup.handled .what { text-decoration: line-through; opacity: 0.5; }
    /* 今天的时间线：开场里的一张卡片 */
    .msg.today {
      width: min(100%, 460px);
      max-width: 100%;
      padding: 12px 14px;
      white-space: normal;
    }
    .today section + section { margin-top: 12px; }
    .today h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .today .row {
      display: grid;
      grid-template-columns: 6.6em minmax(0, 1fr);
      column-gap: 10px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .today time {
      color: var(--soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .today .row.now time { color: var(--ink); font-weight: 600; }
    .today .tag {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    /* 能点的行：点开下面出动作 */
    .today .row.tappable { cursor: pointer; }
    .today .more { color: var(--soft); }
    .today .row.handled { opacity: 0.45; }
    .today .row.handled .what { text-decoration: line-through; }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .today .row-actions { margin: 2px 0 8px calc(6.6em + 10px); }
    .row-actions button {
      font: inherit;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .row-actions button:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .row-actions .hint { margin: 0; }
    .focus-actions { margin: 2px 0; }
    .today .where {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .today .empty {
      margin: 0;
      padding: 3px 0;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: no-preference) {
      .msg {
        animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .msg.user { animation-name: rise-user; }
      .today > * {
        animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .today > *:nth-child(2) { animation-delay: 0.04s; }
      .today > *:nth-child(3) { animation-delay: 0.08s; }
      .today > *:nth-child(4) { animation-delay: 0.12s; }
      .today > *:nth-child(5) { animation-delay: 0.16s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes rise-user {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      /* 整条重画时（打开、换设备回来）不再一条条浮上来 */
      #log.quiet .msg, #log.quiet .today > * { animation: none; }
    }
    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.22;
      animation: pulse 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.14s; }
    .typing i:nth-child(3) { animation-delay: 0.28s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.18; transform: translateY(0) scale(0.9); }
      40% { opacity: 0.85; transform: translateY(-3px) scale(1); }
    }
    .hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .actions { margin-top: 4px; display: flex; gap: 8px; }
    .actions button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--brand);
      background: var(--brand);
      color: var(--on-brand);
      cursor: pointer;
      touch-action: manipulation;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .actions .hint { margin-left: 0; }
    /* 确认卡片里改邮件 */
    .editor { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .editor input, .editor textarea {
      font: inherit;
      font-size: 0.95rem;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      resize: vertical;
    }
    .editor .actions { margin-top: 0; }
    .editor .hint { margin-left: 0; }
    /* 「来找你」：开场卡片下面一行，订阅过就不再出现 */
    .push-offer {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .push-offer button {
      font: inherit;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
    }
    /* 输入条（像 Grok / ChatGPT / WhatsApp）：一个圆角条，左边「+」，中间打字，右边一个圆按钮——
       没字时是麦克风（点了切到按住说话），有字是发送，她在说时是停 */
    #form {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--hers);
      transition: border-color 0.15s ease;
    }
    .icon-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--soft);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn:hover { color: var(--ink); }
    .icon-btn:active { transform: scale(0.92); }
    #send { background: var(--ink); color: var(--bg); }
    #send:hover { color: var(--bg); opacity: 0.85; }
    #send svg { width: 20px; height: 20px; }
    #send[data-state="voice"] { background: transparent; color: var(--soft); }
    #send[data-state="voice"]:hover { color: var(--ink); opacity: 1; }
    #send[data-state="voice"] svg { width: 22px; height: 22px; }
    /* 键盘图标只在「按住 说话」时出现，点了回到打字 */
    #mic { display: none; }
    #form.voice #mic { display: grid; }
    #form.voice #attach, #form.voice #input, #form.voice #send { display: none; }
    #form.voice #send[data-state="stop"] { display: grid; }
    #attachments { display: flex; flex-wrap: wrap; gap: 8px; }
    #attachments[hidden] { display: none; }
    .att {
      position: relative;
      width: 64px;
      height: 64px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .att img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .att button {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 14px;
      line-height: 22px;
      cursor: pointer;
    }
    /* 他发的图：在他的气泡上面，点开看大图 */
    .shot {
      display: block;
      max-width: min(72%, 280px);
      max-height: 320px;
      border: 1px solid var(--line);
      border-radius: 16px;
      object-fit: cover;
      cursor: zoom-in;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.9);
      cursor: zoom-out;
    }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    /* 拖图进来时整页提示一下 */
    body.dropping main { outline: 2px dashed var(--muted); outline-offset: -8px; }
    #input {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      max-height: 160px;
      padding: 9px 6px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      resize: none;
    }
    /* 像微信：点麦克风，整条变成「按住 说话」；按住录、松手发、上滑取消 */
    #hold {
      display: none;
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition: background 0.12s ease, color 0.12s ease;
    }
    #form.voice #hold { display: block; }
    #hold.holding { background: var(--ink); color: var(--bg); }
    /* 声音就画在手指按着的这条上：你说话时跟着你的响度跳，她说话时跟着她的；没有声音就不画 */
    #hold .wave { display: none; align-items: center; gap: 3px; height: 20px; margin-right: 10px; vertical-align: middle; }
    #hold[data-voice] .wave { display: inline-flex; }
    #hold .wave i {
      width: 3px;
      height: calc(4px + var(--l, 0) * var(--k) * 16px);
      border-radius: 2px;
      background: currentColor;
      opacity: 0.85;
    }
    #hold .wave i:nth-child(1) { --k: 0.45; }
    #hold .wave i:nth-child(2) { --k: 0.8; }
    #hold .wave i:nth-child(3) { --k: 1; }
    #hold .wave i:nth-child(4) { --k: 0.65; }
    #hold .wave i:nth-child(5) { --k: 0.9; }
    #hold .wave i:nth-child(6) { --k: 0.55; }
    #hold .wave i:nth-child(7) { --k: 0.35; }
    #hold .label { vertical-align: middle; }
    #hold.cancel { background: var(--danger); color: #fff; }
    #voiceHint {
      position: fixed;
      left: 50%;
      bottom: calc(196px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--user);
      color: var(--soft);
      font-size: 0.85rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 11;
    }
    #voiceHint.on { opacity: 1; }
    #voiceHint.cancel { background: var(--danger); color: #fff; }
    #unlock {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #unlock.visible { display: flex; }
    #unlock p { margin: 0; color: var(--soft); line-height: 1.55; }
    #unlock form { display: flex; gap: 8px; }
    #unlock input {
      flex: 1;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      color: var(--ink);
      outline: none;
    }
    #unlock button {
      font: inherit;
      font-weight: 600;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--on-brand);
      touch-action: manipulation;
    }
    @media (max-width: 520px) {
      main { gap: 12px; }
      .msg { max-width: 88%; }
      /* 手机上「18:00–19:00」放不进 5.2em，会和标题挤在一起：时间字小一号，列宽给够 */
      .today .row { grid-template-columns: 5.6em minmax(0, 1fr); }
      .today .row time { font-size: 0.84em; padding-top: 0.12em; }
      .today .row-actions { margin-left: calc(5.6em + 10px); }
      .today .row-actions button { min-height: 40px; }
      .actions { flex-wrap: wrap; }
      .actions button { min-height: 44px; flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main>
    <header id="bar">
      <button id="who" type="button" aria-label="Friday 的资料">
        <img src="/static/icon.svg?v=ring1" alt="" />
        <span><b>Friday</b><small id="status">在线</small></span>
      </button>
    </header>
    <div id="unlock" aria-live="polite">
      <p>输入一次密码，之后这台设备会记住你。</p>
      <form id="unlockForm">
        <input id="unlockInput" type="password" autocomplete="current-password" placeholder="密码" />
        <button type="submit">进入</button>
      </form>
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <div id="attachments" hidden></div>
    <form id="form">
      <button id="mic" class="icon-btn" type="button" aria-label="切换到打字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17.5 10h.01M6.5 14h.01M17.5 14h.01M9.5 14h5"/></svg></button>
      <button id="attach" class="icon-btn" type="button" aria-label="发图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <input id="file" type="file" accept="image/*" multiple hidden />
      <textarea id="input" rows="1" placeholder="发消息" autocomplete="off" enterkeyhint="send" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
      <button id="hold" type="button"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="label">按住 说话</span></button>
      <button id="send" class="icon-btn" type="submit" aria-label="按住说话" data-state="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    </form>
    <div id="voiceHint" aria-live="polite"></div>
  </main>
  <section id="about" hidden aria-label="Friday 的资料">
    <div class="sheet">
      <div class="top"><button id="aboutBack" type="button">‹ 返回</button></div>
      <div id="aboutBody"></div>
    </div>
  </section>

  <script>
    const ACCESS_KEY = "pa.access"; // 旧版曾把密码存在本机；登录后清掉
    const CARD_FRESH_MS = 15 * 60 * 1000;
    const GAP_MS = 60 * 60 * 1000; // 隔了一小时以上，中间标一下时间
    const QUIET_AFTER_HER_MS = 2 * 60 * 60 * 1000;
    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
    // 她在干什么：一行小字，不出现工具名
    const DOING = {
      get_calendar_events: "在看你的日历…",
      create_calendar_event: "在写进日历…",
      search_emails: "在翻邮件…",
      read_email: "在读那封邮件…",
      send_email: "在准备邮件…",
      modify_email: "在整理邮件…",
      search_files: "在找笔记…",
      read_file: "在读笔记…",
      get_personal_context: "在翻你的档案…",
      remind_me: "在定提醒…",
      cancel_reminder: "在取消提醒…",
      search_memory: "在回想…",
      remember_fact: "在记下来…",
      forget_fact: "在准备忘掉…",
      note_friction: "在记下来…",
      note_mistake: "在记下来…",
      list_friction: "在翻反馈…",
      resolve_friction: "在划掉…",
      fix_friction_with_cursor: "在交给 Cursor…",
      check_cursor_fix: "在看 Cursor 的进度…",
      preview_pending_ship: "在看改动…",
      ship_pending_fix: "在准备上线…",
      add_task: "在记下来…",
      complete_task: "在划掉…",
    };
    // 要他拍板时的两个按钮：按钮上的字就是他的回答（服务端认得这些话）
    const ANSWERS = {
      send_email: ["发", "不发"],
      forget_fact: ["忘掉", "留着"],
      fix_friction_with_cursor: ["交给它", "先不"],
      ship_pending_fix: ["上线", "先不"],
    };

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const attachBtn = document.getElementById("attach");
    const fileInput = document.getElementById("file");
    const attachEl = document.getElementById("attachments");
    const statusEl = document.getElementById("status");
    const aboutEl = document.getElementById("about");
    const aboutBody = document.getElementById("aboutBody");
    let herIssue = "";

    // 顶上那一行小字：在线 / 正在看你的日历… / 正在输入… / 备用的在答
    function setStatus(text) {
      statusEl.textContent = text || (herIssue ? "备用的在答" : "在线");
    }
    const micBtn = document.getElementById("mic");
    const unlockEl = document.getElementById("unlock");
    const unlockForm = document.getElementById("unlockForm");
    const unlockInput = document.getElementById("unlockInput");

    let session = null;
    let busy = false;
    let ready = false;
    let pendingPassword = ""; // 桌面 ?access= 或旧 localStorage，登录后清掉
    let mediaRecorder = null;
    let mediaStream = null;
    let recordChunks = [];
    let recordTimer = null;
    const RECORD_MAX_MS = 60 * 1000;

    (function takeAccessFromUrl() {
      try {
        const legacy = sessionStorage.getItem(ACCESS_KEY);
        if (legacy && !localStorage.getItem(ACCESS_KEY)) {
          localStorage.setItem(ACCESS_KEY, legacy);
          sessionStorage.removeItem(ACCESS_KEY);
        }
        const u = new URL(location.href);
        const t = u.searchParams.get("access");
        if (t) {
          pendingPassword = t;
          u.searchParams.delete("access");
          history.replaceState({}, "", u.pathname + u.search + u.hash);
        } else {
          pendingPassword = localStorage.getItem(ACCESS_KEY) || sessionStorage.getItem(ACCESS_KEY) || "";
        }
      } catch (e) {}
    })();

    function clearStoredPassword() {
      pendingPassword = "";
      try {
        localStorage.removeItem(ACCESS_KEY);
        sessionStorage.removeItem(ACCESS_KEY);
      } catch (e) {}
    }

    function authHeaders(extra) {
      return Object.assign({}, extra || {});
    }

    function showUnlock(on) {
      unlockEl.classList.toggle("visible", !!on);
      form.style.display = on ? "none" : "";
      if (on) unlockInput.focus();
    }

    async function loginWithPassword(password) {
      const res = await fetch("/api/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || "密码不对。");
      }
      clearStoredPassword();
      return true;
    }

    async function ensureSignedIn() {
      if (pendingPassword) {
        try {
          await loginWithPassword(pendingPassword);
          showUnlock(false);
          return true;
        } catch (e) {
          clearStoredPassword();
        }
      }
      const res = await fetch("/api/session", { credentials: "include" });
      const data = await res.json().catch(() => ({}));
      if (!data.access_required || data.signed_in) {
        showUnlock(false);
        return true;
      }
      showUnlock(true);
      return false;
    }

    // 页面上只有一条对话，存在服务端：手机上聊的，电脑上打开也在。
    // session.id 是给模型的那一段（服务端按「同一天、两小时内」分段）；放久了是 null，就请她开场
    function needsOpener(s) {
      const last = s.messages[s.messages.length - 1];
      if (!last) return true;
      const age = Date.now() - (last.at || 0);
      if (last.agenda) return age > CARD_FRESH_MS;
      // 她刚刚才说过话（比如推送）：那就是她的开场，不再说一遍
      if (last.role !== "user" && age < QUIET_AFTER_HER_MS) return false;
      return !s.id;
    }

    function fromServer(m) {
      return {
        id: m.id,
        role: m.role,
        content: m.content || "",
        tools: m.tools || [],
        undo: m.undo || [],
        undone: !!m.undone,
        agenda: m.agenda || null,
        ask: m.ask || "",
        items: m.items || [],
        images: m.images || [],
        reaction: m.reaction || "",
        reactions: m.reactions || {},
        needsConfirm: !!m.needs_confirm,
        approvals: m.approvals || [],
        at: m.at || 0,
      };
    }

    async function loadSession() {
      try {
        const res = await fetch("/api/conversation", { credentials: "include", headers: authHeaders() });
        if (!res.ok) return null;
        const data = await res.json();
        return { id: data.id || null, messages: (data.messages || []).map(fromServer) };
      } catch (e) {
        return null;
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 模型偶尔仍会输出 Markdown：只做最小渲染，其余按纯文本显示
    function render(text) {
      return escapeHtml(text || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^(\s*)[-*•]\s+/gm, "$1· ")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- 一条对话：他在右、她在左，都是气泡；她的一段话一个气泡 ----
    let lastAt = 0;
    const DOTS = '<span class="typing"><i></i><i></i><i></i></span>';

    function stampText(at) {
      const d = new Date(at);
      const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      const midnight = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const days = Math.round((midnight(new Date()) - midnight(d)) / 86400000);
      if (days === 0) return "今天 " + hm;
      if (days === 1) return "昨天 " + hm;
      if (days < 7) return "周" + "日一二三四五六"[d.getDay()] + " " + hm;
      return d.getMonth() + 1 + "月" + d.getDate() + "日 " + hm;
    }

    // 一个人连着说的一次；离上一句隔了一小时以上或换了一天，先标时间
    function group(role, at) {
      at = at || Date.now();
      if (!lastAt || at - lastAt >= GAP_MS || new Date(at).toDateString() !== new Date(lastAt).toDateString()) {
        logEl.append(el("div", "stamp", stampText(at)));
      }
      lastAt = Math.max(lastAt, at);
      const g = el("div", "group " + (role === "user" ? "mine" : "hers"));
      logEl.append(g);
      scrollDown();
      return g;
    }

    function bubble(g, text, extra) {
      const b = el("div", "msg " + (g.classList.contains("mine") ? "user" : "bot") + (extra ? " " + extra : ""));
      if (text != null) b.innerHTML = render(text);
      g.append(b);
      scrollDown();
      return b;
    }

    function paragraphs(text) {
      return (text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    }

    function note(text) {
      return bubble(group("assistant"), text, "note");
    }

    // ---- 贴表情（像 WhatsApp）：他在她的气泡上贴；她不说话时也会在他那条上贴一个 ----
    function setPill(b, emoji) {
      if (!b) return;
      let pill = b.querySelector(":scope > .react");
      if (!emoji) {
        if (pill) pill.remove();
        b.classList.remove("has-react");
        return;
      }
      if (!pill) {
        pill = el("span", "react");
        b.append(pill);
      }
      pill.textContent = emoji;
      b.classList.add("has-react");
    }

    // 她的一个气泡能贴表情：记下是哪条消息的第几段，电脑上悬停出一个笑脸
    function reactable(b, m, part) {
      if (!m || !m.id) return;
      b.dataset.mid = m.id;
      b.dataset.part = part;
      const btn = el("button", "react-btn", "☺");
      btn.type = "button";
      btn.setAttribute("aria-label", "贴表情");
      btn.onclick = (e) => {
        e.stopPropagation();
        openPicker(b);
      };
      b.append(btn);
      setPill(b, (m.reactions || {})[part]);
    }

    let picker = null;
    function closePicker() {
      if (picker) picker.remove();
      picker = null;
    }

    function openPicker(b) {
      closePicker();
      const now = (b.querySelector(":scope > .react") || {}).textContent || "";
      picker = el("div", "picker");
      for (const emoji of REACTIONS) {
        const x = el("button", emoji === now ? "on" : "", emoji);
        x.type = "button";
        x.onclick = (e) => {
          e.stopPropagation();
          closePicker();
          react(b, emoji === now ? "" : emoji);
        };
        picker.append(x);
      }
      const copy = el("button", "copy", "复制");
      copy.type = "button";
      copy.onclick = (e) => {
        e.stopPropagation();
        const clone = b.cloneNode(true);
        clone.querySelectorAll(".react, .react-btn, .picker").forEach((n) => n.remove());
        navigator.clipboard && navigator.clipboard.writeText(clone.textContent.trim()).catch(() => {});
        closePicker();
      };
      picker.append(copy);
      b.append(picker);
      if (b.getBoundingClientRect().top - logEl.getBoundingClientRect().top < 60) picker.classList.add("below");
    }

    async function react(b, emoji) {
      const before = (b.querySelector(":scope > .react") || {}).textContent || "";
      setPill(b, emoji);
      try {
        const res = await fetch("/api/react", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ message_id: Number(b.dataset.mid), part: Number(b.dataset.part), emoji }),
        });
        if (!res.ok) throw new Error(String(res.status));
        const { reactions } = await res.json();
        const m = session.messages.find((x) => String(x.id) === b.dataset.mid);
        if (m) m.reactions = reactions;
      } catch (e) {
        setPill(b, before);
      }
    }

    // 手机：在她的气泡上按住半秒；电脑：右键或悬停的笑脸
    let pressTimer = null;
    let pressAt = null;
    logEl.addEventListener("pointerdown", (e) => {
      const b = e.target.closest(".group.hers .msg[data-mid]");
      if (!b || e.pointerType === "mouse" || e.target.closest(".picker, button")) return;
      pressAt = { x: e.clientX, y: e.clientY };
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        pressTimer = null;
        if (navigator.vibrate) navigator.vibrate(8);
        openPicker(b);
      }, 450);
    });
    logEl.addEventListener("pointermove", (e) => {
      if (pressTimer && pressAt && Math.hypot(e.clientX - pressAt.x, e.clientY - pressAt.y) > 8) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    });
    ["pointerup", "pointercancel"].forEach((t) => logEl.addEventListener(t, () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    }));
    logEl.addEventListener("contextmenu", (e) => {
      const b = e.target.closest(".group.hers .msg[data-mid]");
      if (!b) return;
      e.preventDefault();
      openPicker(b);
    });
    document.addEventListener("pointerdown", (e) => {
      if (picker && !e.target.closest(".picker")) closePicker();
    });

    // ---- 发图：「+」、粘贴、拖进来都行；发之前先缩到模型看图的上限（长边 1568），省流量也省钱 ----
    const MAX_IMAGES = 5;
    let attachments = [];

    const SENDABLE = ["image/png", "image/jpeg", "image/gif", "image/webp"];
    async function shrink(file) {
      const bitmap = await createImageBitmap(file).catch(() => null);
      if (!bitmap) return SENDABLE.includes(file.type) ? file : null; // 浏览器都打不开的格式就不收
      const scale = Math.min(1, 1568 / Math.max(bitmap.width, bitmap.height));
      // HEIC、AVIF 这类服务端不收的格式，就算不大也转成 JPEG
      if (scale === 1 && file.size < 1.5e6 && SENDABLE.includes(file.type)) return file;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve) => canvas.toBlob((b) => resolve(b || file), "image/jpeg", 0.9));
    }

    async function addFiles(files) {
      for (const f of files) {
        if (!f.type.startsWith("image/") || attachments.length >= MAX_IMAGES) continue;
        const blob = await shrink(f);
        if (!blob) {
          flashHint("这张图的格式打不开，换成截图或 JPG 再发");
          continue;
        }
        attachments.push({ blob, url: URL.createObjectURL(blob) });
      }
      drawAttachments();
      setMode(false);
      input.focus();
    }

      const more = el("details");

        : (u.since ? "从 " + u.since + " 开始记：每一次的 token 数是 Anthropic 回复里带的原数，按官方单价算。记账以前的、同一账户别处用的看不到；" : "")
          + "放一把 Anthropic 管理员 key，这里就直接显示账单上的数。"));

      // 连接：都好就一句话；有问题的那一行写怎么修

      for (const c of me.connections || []) links.append(line(c.name, c.note, c.ok ? "" : "bad"));

      // 推送：这台设备、每天最多几条、安静时段
      const pushes = panel("推送");
      const device = el("span", "muted", "…");

        }
        const b = el("button", "pill", "打开");
        b.type = "button";
        b.onclick = () => enablePush(device);
        device.replaceChildren(b);
      });
      const stepper = el("span", "stepper");

      const setDaily = async (n) => {

      pushes.append(line("安静时段", quiet));

      aboutBody.replaceChildren(profile, use, links, pushes, mind, el("p", "fineprint", me.version ? "版本 " + me.version : ""));

    // 她记得你的事：大标题和件数，事情多了能搜；按「这周 / 这个月 / 更早」分组，每条下面写哪天记的；
    // 点一下那条才出现「删除」，删了的划掉、留着「撤销」
    function factDay(at) {
      const d = new Date(at + "T00:00:00");
      return isNaN(d) ? "" : d.getMonth() + 1 + "月" + d.getDate() + "日记下";
    }

    function factGroup(at) {
      const d = new Date(at + "T00:00:00");
      if (isNaN(d)) return "更早";
      const now = new Date();
      if ((now - d) / 86400000 < 7) return "这周";
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) return "这个月";
      return "更早";
    }

    function factRow(f) {
      const row = el("div", f.gone ? "fact gone" : "fact");
      row.append(el("p", "", f.content));
      if (f.at) row.append(el("time", "", factDay(f.at)));
      const acts = el("div", "acts");
      const del = el("button", "del", "删除");
      del.type = "button";
      const undo = el("button", "", "撤销");
      undo.type = "button";
      undo.hidden = !f.gone;
      del.hidden = !!f.gone;
      acts.append(del, undo);
      row.append(acts);
      row.onclick = (e) => {
        if (e.target.closest("button") || row.classList.contains("gone")) return;
        const was = row.classList.contains("open");
        aboutBody.querySelectorAll(".fact.open").forEach((r) => r.classList.remove("open"));
        row.classList.toggle("open", !was);
      };
      del.onclick = async () => {
        del.disabled = true;
        try {
          await api("/api/memory/" + encodeURIComponent(f.id), { method: "DELETE" });
          row.classList.remove("open");
          row.classList.add("gone");
          f.gone = true;
          del.hidden = true;
          undo.hidden = false;
          lastMe.memory = Math.max(0, lastMe.memory - 1);
          setCount();
        } finally {
          del.disabled = false;
        }
      };
      undo.onclick = async () => {
        undo.disabled = true;
        try {
          await api("/api/memory/restore", { method: "POST", body: JSON.stringify({ fact: f.fact }) });
          row.classList.remove("gone");
          f.gone = false;
          undo.hidden = true;
          del.hidden = false;
          lastMe.memory += 1;
          setCount();
        } finally {
          undo.disabled = false;
        }
      };
      return row;
    }

    let setCount = () => {};

    async function showMemories() {
      setAboutView("memory");
      const sub = el("p", "page-sub", "读取中…");
      aboutBody.replaceChildren(el("h2", "page-title", "她记得的"), sub);
      setCount = () => (sub.textContent = lastMe.memory + " 件 · 跟她说「记住…」她就会记下");
      let facts;
      try {
        facts = await api("/api/memory");
      } catch (e) {
        sub.textContent = "没读到，过会儿再看。";
        return;
      }
      setCount();
      if (!facts.length) {
        aboutBody.append(el("p", "empty-state", "她还没记下什么。\n跟她说「记住我周三下午有课」就行。"));
        return;
      }
      const list = el("div");
      const draw = (query) => {
        const q = (query || "").trim().toLowerCase();
        const shown = facts.filter((f) => !q || f.content.toLowerCase().includes(q));
        const groups = new Map();
        for (const f of shown) {
          const name = factGroup(f.at);
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(f);
        }
        const parts = [];
        for (const name of ["这周", "这个月", "更早"]) {
          if (!groups.has(name)) continue;
          const box = el("div", "facts");
          groups.get(name).forEach((f) => box.append(factRow(f)));
          parts.push(el("div", "group-label", name), box);
        }
        list.replaceChildren(...(parts.length ? parts : [el("p", "empty-state", "没找到「" + query + "」。")]));
      };
      if (facts.length > 8) {
        const find = el("input", "find");
        find.type = "search";
        find.placeholder = "搜她记得的";
        find.oninput = () => draw(find.value);
        aboutBody.append(find);
      }
      aboutBody.append(list);
      draw("");
    }

    // 推送里没下文的事：一件一行，「做完了 / 明天再说」点一下就办，办过的划掉
    function drawItems(g, m) {
      const box = el("div", "followups");

    // 她还在想、在查：打字的气泡，旁边一行小字说在干什么
    function pending(g, doing) {
      let p = g.querySelector(":scope > .pending");
      if (!p) {
        p = el("div", "pending");
        g.append(p);
      }
      p.innerHTML = '<div class="msg bot">' + DOTS + "</div>" + (doing ? '<span class="doing">' + escapeHtml(doing) + "</span>" : "");
      setStatus(doing || "正在输入…");
      scrollDown();
    }

    function clearPending(g) {
      const p = g.querySelector(":scope > .pending");
      if (p) p.remove();
    }

    // 她正在说的这一轮：边写边分段，写到空行就开下一个气泡；去查东西时先收起来，换成「在…」
    function herReply(g) {
      const bubbles = [];
      return {
        g,
        bubbles,
        show(text) {
          const parts = paragraphs(text);
          if (parts.length) {
            clearPending(g);
            setStatus("正在输入…");
          }
          parts.forEach((p, i) => {
            if (!bubbles[i]) bubbles[i] = bubble(g);
            bubbles[i].innerHTML = render(p);
          });
          bubbles.splice(parts.length).forEach((b) => b.remove());
          scrollDown();
        },
        busy(doing) {
          bubbles.splice(0).forEach((b) => b.remove());
          pending(g, doing);
        },
      };
    }

    // 她回复的第一行只有一个表情：那是贴在他那条消息上的，剩下的才是她说的话（和服务端一样分）
    function splitReaction(text) {
      const trimmed = (text || "").trim();
      const cut = trimmed.indexOf("\n");
      const first = (cut < 0 ? trimmed : trimmed.slice(0, cut)).trim().replace(/\uFE0F/g, "");
      const emoji = REACTIONS.find((r) => r.replace(/\uFE0F/g, "") === first);
      return emoji ? [emoji, cut < 0 ? "" : trimmed.slice(cut + 1).trim()] : ["", text];
    }

    function replyView(reply, speaker) {
      return {
        onDelta(text) {
          const [emoji, rest] = splitReaction(text);
          if (emoji && reply.mine) setPill(reply.mine, emoji);
          reply.show(rest);
          if (speaker) speaker.feed(rest);
        },
        onTool(name) {
          reply.busy(DOING[name] || "");
          if (speaker) speaker.reset();
        },
      };
    }

    // 要他拍板的那段（服务端拼的）：要做的事原样放进一个框，最后那句问话是她的一条
    function drawAsk(g, ask) {
      const cut = ask.lastIndexOf("\n\n");
      if (cut > 0) bubble(g, ask.slice(0, cut), "draft");
      bubble(g, cut > 0 ? ask.slice(cut + 2) : ask);
    }

    // 她说的话（不含要他拍板的那段）
    function saidPart(m) {
      const c = m.content || "";
      return m.ask && c.endsWith(m.ask) ? c.slice(0, c.length - m.ask.length).trim() : c;
    }

    function calm(err) {
      const raw = (err && err.message) || String(err || "");
      if (/load failed|failed to fetch|networkerror|aborted|connection|连接断了/i.test(raw)) return "连不上了，网络好了再说一次。";
      return raw || "这句没接上，再说一次。";
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    // 开场：问候一条，此刻最该知道的那句一条；最新的那次开场下面再挂今天的时间线和那一个动作
    function drawOpener(g, m, full) {
      g.classList.add("opener");
      const card = m.agenda || {};
      if (full && card.hello) bubble(g, card.hello);
      if (m.content) {
        const say = bubble(g, null, "say");
        fillSay(say, m.content);
        reactable(say, m, 0);
      }
      if (full) {
        g.classList.add("full");
        attachToday(g, card);
      }
    }

    function attachToday(g, card) {
      if (card.error) bubble(g, card.error, "note");
      if (card.focus && card.focus.actions && card.focus.actions.length) g.append(focusActions(g, card.focus));
      if ((card.sections || []).length) g.append(drawToday(card));
    }

    // 又开了一次场：之前那次只留那一句
    function foldOpeners() {
      logEl.querySelectorAll(".group.opener.full").forEach((g) => {
        g.classList.remove("full");
        g.querySelectorAll(".today, .focus-actions, .push-offer, .msg:not(.say)").forEach((n) => n.remove());
      });
    }

    // 时间线上的安排是服务端读到的原样数据，不经过模型
    function drawToday(card) {
      const div = el("div", "msg bot today");
      for (const section of card.sections || []) {
        const box = el("section");
        // 空的日子只占一行、退到后面；版面留给真要去的事
        const head = el("h3");
        head.append(el("span", "", section.label));
        const side = section.rows.length ? section.meta : section.empty;
        if (side) head.append(el("span", "", side));
        box.append(head);
        for (const row of section.rows) {
          const line = el("div", row.now ? "row now" : "row");
          const what = el("div", "what", row.title);
          if (row.actions && row.actions.length) what.append(el("span", "more", " ›"));
          if (row.now) what.append(el("span", "tag", "进行中"));
          if (row.where) what.append(el("span", "where", row.where));
          line.append(el("time", "", row.time), what);
          if (row.key) line.dataset.key = row.key;
          box.append(line);
          if (row.actions && row.actions.length) {
            line.classList.add("tappable");
            line.onclick = () => toggleRowActions(line, row);
          }
        }
        div.append(box);
      }
      return div;
    }

    // 「现在」：第一句大字，一眼看完（不带句号）；补充的（地点、还剩多久、空到几点）小一号放在下面
    function fillSay(el, text) {
      const cut = (text || "").indexOf("。");
      if (cut < 0 || cut === text.length - 1) {
        el.innerHTML = '<span class="head">' + render((text || "").replace(/。$/, "")) + "</span>";
        return;
      }
      el.innerHTML =
        '<span class="head">' + render(text.slice(0, cut)) + "</span>" +
        '<span class="sub">' + render(text.slice(cut + 1)) + "</span>";
    }

    // 「现在」那句话下面的按钮：和时间线上同一件事是同一个动作，办完那一行也划掉
    function focusActions(g, focus) {
      const bar = el("div", "row-actions focus-actions");
      for (const action of focus.actions) {
        const b = el("button", "", action.label);
        b.type = "button";
        b.onclick = () => {
          if (action.url) {
            window.open(action.url, "_blank", "noopener");
            return;
          }
          if (action.confirm && !b.dataset.armed) {
            b.dataset.armed = "1";
            b.textContent = action.confirm;
            return;
          }
          const line = g.querySelector('.row[data-key="' + CSS.escape(focus.key) + '"]') || el("div");
          doRow(line, focus, action, bar);
        };
        bar.append(b);
      }
      return bar;
    }

    // 卡片上的一行：点开出动作；「帮我准备」交给她，「做完了 / 明天再说」直接办、给撤销
    function toggleRowActions(line, row) {
      const open = line.nextElementSibling;
      if (open && open.classList.contains("row-actions")) {
        open.remove();
        return;
      }
      if (line.classList.contains("handled")) return;
      const bar = el("div", "row-actions");
      for (const action of row.actions) {
        const b = el("button", "", action.label);
        b.type = "button";
        b.onclick = (e) => {
          e.stopPropagation();
          if (action.url) {
            window.open(action.url, "_blank", "noopener");
            return;
          }
          // 上线这种动作：第一下变成「确认上线」，再点一下才办
          if (action.confirm && !b.dataset.armed) {
            b.dataset.armed = "1";
            b.textContent = action.confirm;
            return;
          }
          doRow(line, row, action, bar);
        };
        bar.append(b);
      }
      line.after(bar);
    }

    async function doRow(line, row, action, bar) {
      if (busy || !ready) return;
      if (action.id === "prepare" || action.ask) {
        bar.remove();
        await ask(action.ask || "帮我准备 " + row.title);
        return;
      }
      bar.querySelectorAll("button").forEach((b) => (b.disabled = true));
      if (action.id === "ship") bar.replaceChildren(el("span", "hint", "正在合并上线…"));
      try {
        const res = await fetch("/api/items/act", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ key: row.key, action: action.id, conversation_id: session && session.id, message_id: row.message_id || null }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要重新登录。");
        }
        if (!res.ok) throw new Error(data.detail || "没办成。");
        bar.remove();
        if (action.id !== "preview") line.classList.add("handled");
        clearActions();
        const m = { id: data.message_id, role: "assistant", content: data.say, tools: [], undo: data.undo, at: Date.now() };
        const g = group("assistant", m.at);
        bubble(g, data.say);
        if (m.undo && m.undo.length) addUndo(g, m);
        session.messages.push(m);
      } catch (e) {
        bar.replaceChildren(el("span", "hint", (e && e.message) || String(e)));
      }
    }




    // ---- 来找你：iPhone 主屏幕上的 Friday、电脑上的 Friday 窗口都能收到她主动发的提醒 ----
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    let swReady = null;
    if ("serviceWorker" in navigator) {
      swReady = navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).catch(() => null);
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data && e.data.type === "nudge") handleNudge(e.data.url);
      });
    }

    function keyBytes(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    function deviceName() {
      if (isIOS) return "iPhone";
      if (/Windows/.test(navigator.userAgent)) return "电脑";
      if (/Mac/.test(navigator.userAgent)) return "Mac";
      return "浏览器";
    }

    async function pushSubscribed() {
      if (!pushSupported || Notification.permission !== "granted" || !swReady) return false;
      const reg = await swReady;
      return !!(reg && (await reg.pushManager.getSubscription()));
    }

    async function enablePush(line) {
      const say = (text) => line.replaceChildren(el("span", "", text));
      try {
        const reg = await swReady;
        if (!reg) throw new Error("这个浏览器不支持提醒。");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          say("通知被关掉了：到系统设置里给 Friday 打开通知，再点一次。");
          return;
        }
        const { public_key } = await (await fetch("/api/push/key", { credentials: "include" })).json();
        const sub = (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(public_key) }));
        const res = await fetch("/api/push/subscribe", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ subscription: sub.toJSON(), device: deviceName() }),
        });
        if (!res.ok) throw new Error("没订上，再点一次。");
        await fetch("/api/push/test", { method: "POST", credentials: "include", headers: authHeaders() });
        say("好了，有事我会来找你。");
      } catch (e) {
        say((e && e.message) || "没订上，再点一次。");
      }
    }

    // 开场卡片下面：这台设备还没订上，就问一句
    async function offerPush(g) {
      if (await pushSubscribed()) return;
      const line = el("div", "push-offer");
      if (isIOS && !standalone) {
        line.append(el("span", "", "想让我主动找你：在 Safari 点「分享 → 添加到主屏幕」，再从主屏幕打开我。"));
      } else if (!pushSupported) {
        return;
      } else {
        const b = el("button", "", "打开提醒");
        b.type = "button";
        b.onclick = () => enablePush(line);
        line.append(el("span", "", "想让我主动来找你？"), b);
      }
      g.appendChild(line);
    }

    // 从通知点进来：记一笔「点开了」；会前提醒就直接把要点备好
    function handleNudge(url) {
      let target;
      try {
        target = new URL(url, location.origin);
      } catch (e) {
        return;
      }
      const key = target.searchParams.get("n");
      if (key) {
        fetch("/api/nudges/opened", {
          method: "POST",
          credentials: "include",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ key }),
        }).catch(() => {});
      }
      const what = target.searchParams.get("what");
      const action = target.searchParams.get("do");
      if (action === "prepare" && what) pendingAsk = "帮我准备 " + what;
      // 车间的推送（Cursor 改好了、测试红了）：点开就直接问她，改了什么由她给你看
      if (action === "ask" && what) pendingAsk = what;
      if (pendingAsk && ready && !busy) {
        const message = pendingAsk;
        pendingAsk = "";
        ask(message);
      }
    }

    let pendingAsk = "";
    (function takeNudgeFromUrl() {
      const u = new URL(location.href);
      if (!u.searchParams.has("n")) return;
      handleNudge(location.href);
      ["n", "do", "what"].forEach((k) => u.searchParams.delete(k));
      history.replaceState({}, "", u.pathname + u.search + u.hash);
    })();

    // 要他拍板：她问一句，下面两个字就是他的回答；邮件还能当场改
    function addConfirm(g, m) {
      const bar = el("div", "actions");

    async function revise(box, mail, changes) {
      if (busy || !ready) return;

    // 记下或划掉的待办不先问他，只在下面放一个「撤销」：直接撤回，不经过模型
    function addUndo(g, m) {
