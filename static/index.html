    function clearActions() {
      logEl.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    // 整条重画：打开、换设备回来时。最新的那次开场带时间线，之前的只留那一句
    function renderThread() {
      logEl.classList.add("quiet");
      logEl.replaceChildren();
      lastAt = 0;
      const msgs = session.messages;
      let latestOpener = -1;
      msgs.forEach((m, i) => {
        if (m.agenda) latestOpener = i;
      });
      msgs.forEach((m, i) => {
        const g = group(m.role, m.at);
        if (m.role === "user") {
          const shots = drawShots(g, (m.images || []).map((i) => i.url));
          setPill(m.content ? bubble(g, m.content) : shots, m.reaction);
        }
        else if (m.agenda) drawOpener(g, m, i === latestOpener);
        else {
          showHers(g, m);
          if (m.items && m.items.length) drawItems(g, m);
          const last = i === msgs.length - 1;
          if (m.needsConfirm && last) addConfirm(g, m);
          if (m.undo && m.undo.length && !m.undone && last) addUndo(g, m);
        }
        if (!g.children.length) g.remove();
      });
      scrollDown();
      requestAnimationFrame(() => logEl.classList.remove("quiet"));
    }

    function showHers(g, m) {
      const parts = paragraphs(saidPart(m));
      if (m.undone && parts.length) parts[parts.length - 1] += "（已撤销）";
      parts.forEach((p, i) => reactable(bubble(g, p), m, i));
      if (m.ask) drawAsk(g, m.ask);
    }

    // view 上挂着各种事件怎么画：onDelta（她写到哪了）、onTool（她去查东西）、onAgenda（开场的时间线）、onHeard（听清他说的）
    let streaming = null; // 正在说的那一轮：点「停」就断开
    async function stream(url, payload, view) {
      const form = payload instanceof FormData;
      streaming = new AbortController();
      const res = await fetch(url, {
        signal: streaming.signal,
        method: "POST",
        credentials: "include",
        headers: form ? authHeaders() : authHeaders({ "Content-Type": "application/json" }),
        body: form ? payload : JSON.stringify(payload || {}),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要登录才能聊。");
        }
        if (res.status === 404) {
          throw new Error("本地服务还是旧版本：双击 Friday.cmd 重开，再刷新这页。");
        }
        console.warn("Friday:", res.status, data.detail || "");
        throw new Error(res.status === 503 && data.detail ? data.detail : "这句没接上，再说一次。");
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let result = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;
          const ev = JSON.parse(frame.slice(6));
          if (ev.type === "heard") {
            if (view.onHeard) view.onHeard(ev);
          } else if (ev.type === "conversation") {
            if (session && ev.id) session.id = ev.id;
          } else if (ev.type === "agenda") {
            if (view.onAgenda) view.onAgenda(ev);
            scrollDown();
          } else if (ev.type === "delta") {
            text += ev.text;
            if (view.onDelta) view.onDelta(text);
          } else if (ev.type === "tool") {
            text = "";
            if (view.onTool) view.onTool(ev.name);
          } else if (ev.type === "done") {
            result = {
              reply: typeof ev.reply === "string" ? ev.reply : text,
              ask: ev.ask || "",
              reaction: ev.reaction || "",
              tools: ev.tools_called || [],
              undo: ev.undo || [],
              needsConfirm: !!ev.needs_confirm,
              approvals: ev.approvals || [],
              id: ev.message_id,
            };
          } else if (ev.type === "error") {
            if (ev.detail) console.warn("Friday:", ev.detail);
            throw new Error(ev.message);
          }
        }
      }
      streaming = null;
      if (!result) throw new Error("连接断了，再试一次。");
      return result;
    }

    function stopped(e) {
      return !!e && e.name === "AbortError";
    }

    // 这一轮说完：按最终的话重排气泡（写的时候已经分好的原样留着），要拍板的那段单独一个框
    function finish(reply, result) {
      const { reply: content, ask = "", tools = [], undo = [], needsConfirm = false, approvals = [], id, reaction } = result;
      if (reply.mine) setPill(reply.mine, reaction);
      if (reply.said) reply.said.reaction = reaction || "";
      if (reaction && !content && !ask && !undo.length) {
        // 她没说话，只在他那条上贴了个表情
        reply.g.remove();
        return;
      }
      const m = { id, role: "assistant", content, ask, tools, needsConfirm, approvals, undo, at: Date.now() };
      clearPending(reply.g);
      reply.show(saidPart(m));
      reply.bubbles.forEach((b, i) => reactable(b, m, i));
      if (ask) drawAsk(reply.g, ask);
      if (needsConfirm) addConfirm(reply.g, m);
      if (undo.length) addUndo(reply.g, m);
      if (!reply.g.children.length) reply.g.remove();
      session.messages.push(m);
      scrollDown();
    }

    function fail(reply, err) {
      clearPending(reply.g);
      if (stopped(err)) {
        // 他点了「停」：说到哪儿留在哪儿
        if (!reply.bubbles.length) reply.g.remove();
        return;
      }
      reply.show("");
      bubble(reply.g, calm(err), "note");
    }

    // 右边那一个圆按钮：没字时是麦克风，有字（或有图）是发送，她在回答或在念时是停
    const SEND_ICONS = { voice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>', send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>', stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>' };
    const SEND_LABELS = { voice: "按住说话", send: "发送", stop: "停下" };
    function syncSend() {
      const speaking = typeof orbState !== "undefined" && orbState === "speaking";
      const state = busy || speaking ? "stop" : input.value.trim() || attachments.length ? "send" : "voice";
      if (sendBtn.dataset.state === state) return;
      sendBtn.dataset.state = state;
      sendBtn.innerHTML = SEND_ICONS[state];
      sendBtn.setAttribute("aria-label", SEND_LABELS[state]);
    }

    function setBusy(on) {
      busy = on;
      syncSend();
      if (!on) {
        streaming = null;
        setStatus("");
      }
    }

    // ---- 声音：你说话时听麦克风；她一句写完就念一句；白环跟着真实的响度起伏 ----
    const voiceOut = new Audio();
    const SENTENCE_STOPS = "。！？!?；;…\n";
    const ENVELOPE_HZ = 50; // 她的声音每 20ms 记一个响度
    const levelBuf = new Uint8Array(1024);
    let audioCtx = null;
    let micSource = null;
    let micAnalyser = null;
    let voiceEnv = null; // 正在念的这句的响度曲线
    let speechTurn = 0; // 每次打断 +1：上一轮没念完的句子作废
    let speechQueue = []; // 排着队的句子：每句一个 Promise<{url, env}>
    let speechPlaying = false;
    let speechOpen = false; // 这一轮还在写，后面可能还有句子
    let clipWatch = 0;
    let orbState = "";
    let orbLevel = 0;
    let orbFrame = 0;
    let orbHide = 0;

    function audioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    // 均方根响度 → 0–1；开平方让轻声也有起伏
    function toLevel(rms) {
      return Math.min(1, Math.sqrt(Math.max(0, rms - 0.01)) * 2.2);
    }

    function micLevel() {
      if (!micAnalyser) return 0;
      micAnalyser.getByteTimeDomainData(levelBuf);
      let sum = 0;
      for (const v of levelBuf) sum += ((v - 128) / 128) ** 2;
      return toLevel(Math.sqrt(sum / levelBuf.length));
    }

    function voiceLevel(now) {
      if (voiceOut.paused) return 0;
      if (!voiceEnv) return 0.35 + 0.25 * Math.sin(now / 150) * Math.sin(now / 410);
      return toLevel(voiceEnv[Math.floor(voiceOut.currentTime * ENVELOPE_HZ)] || 0);
    }

    function orbTick(now) {
      const target = orbState === "listening" ? micLevel() : orbState === "speaking" ? voiceLevel(now) : 0;
      // 起得快、落得慢，像呼吸
      orbLevel += (target - orbLevel) * (target > orbLevel ? 0.5 : 0.12);
      holdBtn.style.setProperty("--l", orbLevel.toFixed(3));
      orbFrame = orbState || orbLevel > 0.01 ? requestAnimationFrame(orbTick) : 0;
    }

    // 声音的状态只画在输入栏上：听你说（listening）、她在说（speaking）；想的时候不画，气泡里的三个点就够了
    function orbSet(state) {
      clearTimeout(orbHide);
      orbState = state;
      if (state === "listening" || state === "speaking") holdBtn.dataset.voice = state;
      else delete holdBtn.dataset.voice;
      voiceLabels();
      syncSend();
      if (state && !orbFrame) orbFrame = requestAnimationFrame(orbTick);
    }

    // 她在说话时：「按住 说话」变成「轻点停止 · 按住插话」；打字模式下左边的「说」变成「停」
    function voiceLabels() {
      const voice = form.classList.contains("voice");
      if (!press) holdBtn.querySelector(".label").textContent = orbState === "speaking" ? "轻点停止 · 按住插话" : "按住 说话";
    }

    // 这一轮全说完才收起白环；句子之间的停顿不收
    function settleOrb() {
      if (orbState === "listening" || speechPlaying || speechQueue.length || speechOpen) return;
      clearTimeout(orbHide);
      orbHide = setTimeout(() => orbSet(""), 350);
    }

    // 手机 Safari 只让「点过的」播放器出声：第一次点麦克风时先放 0.1 秒静音
    function unlockVoice() {
      const ctx = audioContext();
      if (!voiceOut.src) {
        voiceOut.src = silentWav();
        voiceOut.play().catch(() => {});
      }
      return ctx;
    }

    function silentWav() {
      const samples = 800;
      const bytes = new Uint8Array(44 + samples).fill(128); // 8-bit PCM，128 是静音
      const view = new DataView(bytes.buffer);
      const tag = (at, s) => [...s].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)));
      tag(0, "RIFF");
      view.setUint32(4, 36 + samples, true);
      tag(8, "WAVEfmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 8000, true);
      view.setUint32(28, 8000, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      tag(36, "data");
      view.setUint32(40, samples, true);
      return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    }

    // 解出这句的响度曲线给白环用；声音本身照常由播放器放，不经过 Web Audio
    async function envelopeOf(blob) {
      const ctx = audioContext();
      if (!ctx) return null;
      try {
        const data = (await ctx.decodeAudioData(await blob.arrayBuffer())).getChannelData(0);
        const step = Math.round(ctx.sampleRate / ENVELOPE_HZ);
        const env = new Float32Array(Math.ceil(data.length / step));
        for (let i = 0; i < env.length; i++) {
          const end = Math.min(data.length, (i + 1) * step);
          let sum = 0;
          for (let j = i * step; j < end; j++) sum += data[j] * data[j];
          env[i] = Math.sqrt(sum / (end - i * step));
        }
        return env;
      } catch (e) {
        return null;
      }
    }

    function fetchSpeech(text) {
      return fetch("/api/voice/speak", {
        method: "POST",
        credentials: "include",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ text }),
      })
        .then((res) => (res.ok ? res.blob() : null))
        .then(async (blob) => (blob ? { url: URL.createObjectURL(blob), env: await envelopeOf(blob) } : null))
        .catch(() => null);
    }

    function enqueueSpeech(text, turn) {
      const clean = text.trim();
      if (turn !== speechTurn || !/[\p{L}\p{N}]/u.test(clean)) return;
      speechQueue.push(fetchSpeech(clean));
      playNextSpeech();
    }

    async function playNextSpeech() {
      if (speechPlaying) return;
      const next = speechQueue.shift();
      if (!next) return settleOrb();
      speechPlaying = true;
      const turn = speechTurn;
      const clip = await next;
      if (turn !== speechTurn) {
        if (clip) URL.revokeObjectURL(clip.url);
        return;
      }
      if (!clip) {
        speechPlaying = false;
        return playNextSpeech();
      }
      voiceEnv = clip.env;
      voiceOut.src = clip.url;
      orbSet("speaking");
      voiceOut.play().catch(() => {
        if (turn === speechTurn) doneSpeaking();
      });
      // 播放器卡住不报 ended 时，照这句的真实长度往下走，白环不会一直挂着
      const seconds = clip.env ? clip.env.length / ENVELOPE_HZ : 20;
      clipWatch = setTimeout(() => {
        if (turn === speechTurn) doneSpeaking();
      }, seconds * 1000 + 3000);
    }

    function doneSpeaking() {
      clearTimeout(clipWatch);
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
      voiceEnv = null;
      speechPlaying = false;
      playNextSpeech();
    }

    voiceOut.addEventListener("ended", doneSpeaking);

    function stopSpeaking() {
      clearTimeout(clipWatch);
      speechTurn += 1;
      for (const p of speechQueue) p.then((clip) => clip && URL.revokeObjectURL(clip.url));
      speechQueue = [];
      speechOpen = false;
      speechPlaying = false;
      voiceEnv = null;
      if (!voiceOut.paused) voiceOut.pause();
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
    }

    function sentenceEnd(text, from) {
      for (let i = from; i < text.length; i++) {
        const stop = SENTENCE_STOPS.includes(text[i]) || (text[i] === "." && /\s/.test(text[i + 1] || ""));
        if (stop && text.slice(from, i + 1).trim().length >= 4) return i + 1;
      }
      return -1;
    }

    // 一句写完就送去念，不等整段写完
    function speakerFor() {
      let turn = speechTurn;
      let text = "";
      let said = 0;
      speechOpen = true;
      const close = () => {
        if (turn === speechTurn) speechOpen = false;
        settleOrb();
      };
      return {
        feed(full) {
          text = full;
          for (let end = sentenceEnd(text, said); end > 0; end = sentenceEnd(text, said)) {
            enqueueSpeech(text.slice(said, end), turn);
            said = end;
          }
        },
        // 她去查工具了：之前写的字屏幕上会换掉，念到一半的也一起作废，免得同一件事说两遍
        reset() {
          if (turn !== speechTurn) return;
          stopSpeaking();
          turn = speechTurn;
          speechOpen = true;
          text = "";
          said = 0;
          orbSet("thinking");
        },
        end(reply) {
          enqueueSpeech((text || reply || "").slice(said), turn);
          close();
        },
        cancel: close,
      };
    }

    function pickMime() {
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      for (const t of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    // ---- 说话：像微信——点左边切到「按住 说话」，按住就录、松手就发、上滑取消 ----
    const holdBtn = document.getElementById("hold");
    const voiceHint = document.getElementById("voiceHint");
    const MODE_KEY = "pa.inputMode";
    const MIN_HOLD_MS = 600;
    const CANCEL_PX = 60;
    let press = null; // 正按着：{ id, y, at, cancel }
    let hintTimer = 0;

    function setMode(voice) {
      form.classList.toggle("voice", voice);
      voiceLabels();
      try { localStorage.setItem(MODE_KEY, voice ? "voice" : "text"); } catch (e) {}
      // 切过来这一下就把麦克风打开：权限框在这时弹，而不是在他按住的时候弹
      if (voice) ensureMic();
      else {
        closeMic();
        input.focus();
      }
    }

    // 麦克风开一次就一直开着，直到 Friday 退到后台：每次按住都立刻开录，iPhone 也不会反复问权限
    async function ensureMic() {
      if (mediaStream && mediaStream.getAudioTracks().some((t) => t.readyState === "live")) return true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        flashHint("这里不能录音：用 Safari 或 Chrome 打开");
        return false;
      }
      try {
        const ctx = unlockVoice();
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (ctx) {
          micSource = ctx.createMediaStreamSource(mediaStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = levelBuf.length;
          micSource.connect(micAnalyser);
        }
        return true;
      } catch (e) {
        flashHint("没有麦克风权限：到设置里给 Friday 打开");
        return false;
      }
    }

    function closeMic() {
      if (press) {
        press.cancel = true;
        endHold();
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      micAnalyser = null;
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
    }

    function flashHint(text) {
      voiceHint.textContent = text;
      voiceHint.className = "on";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { if (!press) voiceHint.className = ""; }, 1600);
    }

    function showHolding() {
      const cancel = !!(press && press.cancel);
      holdBtn.classList.toggle("holding", !!press);
      holdBtn.classList.toggle("cancel", cancel);
      if (press) holdBtn.querySelector(".label").textContent = cancel ? "松开 取消" : "松开 发送";
      else voiceLabels();
      if (press) {
        clearTimeout(hintTimer);
        voiceHint.textContent = cancel ? "松开手指，取消发送" : "松开发送，上滑取消";
        voiceHint.className = cancel ? "on cancel" : "on";
      } else if (!hintTimer || voiceHint.className.includes("cancel")) {
        voiceHint.className = "";
      }
    }

    async function startHold(e) {
      e.preventDefault();
      if (press) return;
      try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
      const interrupting = orbState === "speaking";
      stopSpeaking(); // 她正在说：你一碰她就停
      hintTimer = 0;
      press = { id: e.pointerId, y: e.clientY, at: Date.now(), cancel: false, interrupting };
      showHolding();
      const fresh = !mediaStream;
      if (!(await ensureMic())) {
        press = null;
        showHolding();
        return;
      }
      if (!press) {
        // 第一次弹权限框的时候手指已经松开了：这次不算，告诉他可以说了
        if (fresh) flashHint("好了，按住说话");
        return;
      }
      recordChunks = [];
      const mime = pickMime();
      mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size) recordChunks.push(ev.data);
      };
      mediaRecorder.start();
      press.at = Date.now();
      orbSet("listening");
      recordTimer = setTimeout(endHold, RECORD_MAX_MS);
    }

    function moveHold(e) {
      if (!press || e.pointerId !== press.id) return;
      const cancel = press.y - e.clientY > CANCEL_PX;
      if (cancel !== press.cancel) {
        press.cancel = cancel;
        showHolding();
      }
    }

    function endHold() {
      clearTimeout(recordTimer);
      const done = press;
      press = null;
      showHolding();
      const recorder = mediaRecorder;
      mediaRecorder = null;
      if (!recorder || recorder.state !== "recording") {
        settleOrb();
        return;
      }
      const mime = recorder.mimeType || "audio/webm";
      const tooShort = !done || Date.now() - done.at < MIN_HOLD_MS;
      const cancelled = !!(done && done.cancel);
      recorder.onstop = () => {
        const blob = new Blob(recordChunks, { type: mime });
        recordChunks = [];
        if (cancelled || tooShort || !blob.size) {
          orbSet("");
          if (!cancelled && !(done && done.interrupting)) flashHint("说话时间太短");
          return;
        }
        sendVoice(blob, mime);
      };
      try {
        recorder.stop();
      } catch (err) {
        orbSet("");
      }
    }

    // 松手气泡就出来；录音一趟传上去：转写好了先填进气泡（heard），她紧接着就回，不再多跑一趟
    async function sendVoice(blob, mime) {
      const mine = group("user");
      const heard = bubble(mine, null);
      heard.innerHTML = DOTS;
      await whenIdle();
      setBusy(true);
      clearActions();
      const g = group("assistant");
      g.hidden = true; // 听清之前先不摆她的气泡
      const reply = herReply(g);
      const view = replyView(reply);
      let speaker = null;
      view.onHeard = (ev) => {
        heard.textContent = ev.text;
        const said = { role: "user", content: ev.text, at: Date.now() };
        session.messages.push(said);
        Object.assign(reply, { mine: heard, said });
        g.hidden = false;
        reply.busy();
        // 只有他明说要听（「念给我听」）才出声
        if (ev.spoken) {
          speaker = speakerFor();
          Object.assign(view, replyView(reply, speaker));
        }
        scrollDown();
      };
      try {
        const formData = new FormData();
        const ext = mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
        formData.append("file", blob, "speech." + ext);
        if (session && session.id) formData.append("conversation_id", session.id);
        const result = await stream("/api/voice/ask", formData, view);
        finish(reply, result);
        if (speaker) speaker.end(result.reply);
      } catch (e) {
        if (g.hidden) {
          mine.remove();
          g.remove();
          note(calm(e));
        } else {
          fail(reply, e);
        }
        if (speaker) speaker.cancel();
      } finally {
        settleOrb();
        setBusy(false);
      }
    }

    function whenIdle() {
      return new Promise((resolve) => {
        const check = () => (busy || !ready ? setTimeout(check, 120) : resolve());
        check();
      });
    }

    // 她先开口：问候、此刻最该知道的那句、今天的时间线，接在那条对话的最后
    async function presence() {
      setBusy(true);
      clearActions(); // 她又开口了：之前那个「发吗？」不再等他回答
      // 上一次开场之后什么都没聊：这次的替掉它，不叠两遍
      const last = session.messages[session.messages.length - 1];
      if (last && last.agenda) {
        session.messages.pop();
        renderThread();
      }
      foldOpeners();
      const g = group("assistant");
      g.classList.add("opener", "full");
      pending(g);
      let head = null;
      let card = null;
      const view = {
        onAgenda(c) {
          card = c;
          clearPending(g);
          if (c.hello) bubble(g, c.hello);
          head = bubble(g, null, "say");
          head.innerHTML = DOTS;
          attachToday(g, c);
        },
        onDelta(text) {
          if (head) fillSay(head, text);
        },
      };
      try {
        const result = await stream("/api/presence/stream", { conversation_id: session.id }, view);
        clearPending(g);
        if (!head && result.reply) head = bubble(g, null, "say");
        if (head && result.reply) fillSay(head, result.reply);
        else if (head) head.remove();
        session.messages.push({ id: result.id, role: "assistant", content: result.reply, tools: [], agenda: card || {}, at: Date.now() });
        offerPush(g);
      } catch (e) {
        clearPending(g);
        if (head) head.remove();
        if (!stopped(e)) bubble(g, calm(e), "note");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    // 打开、登录之后、叫回窗口没准备好时都走这里：接上那条对话；放久了就请她开场
    async function boot() {
      ready = await checkHealth();
      if (!ready) return;
      const latest = await loadSession();
      if (!latest) return;
      session = latest;
      renderThread();
      if (needsOpener(session)) await presence();
      else input.focus();
    }

    // 叫回窗口：别的设备上接着聊过，就把那几句也显示出来；放久了请她开场；否则趁他打字先把日历读好
    async function onReturn() {
      if (document.visibilityState !== "visible" || busy) return;
      input.focus();
      if (!ready || !session) return boot();
      const latest = await loadSession();
      if (busy || !latest) return;
      const a = session.messages;
      const b = latest.messages;
      const moved = a.length !== b.length || (b.length && a.length && a[a.length - 1].id !== b[b.length - 1].id);
      session.id = latest.id;
      if (moved) {
        session = latest;
        renderThread();
      }
      if (needsOpener(session)) return presence();
      fetch("/api/calendar/warm", { method: "POST", credentials: "include", headers: authHeaders() }).catch(() => {});
    }

    // 只有他明说要听（「念给我听」「听听你的声音」）才念出来；按住说话的那句也一样
    function wantsVoice(text) {
      return /听听|听你|你的声音|念给|读给|说两句|说句话|hear (your )?voice|speak (to me|up)|say something/i.test(text || "");
    }

    async function ask(message, opts) {
      if (busy || !ready) return;
      stopSpeaking();
      const pictures = (opts && opts.images) || [];
      const speak = !!(opts && opts.speak) || wantsVoice(message);
      const speaker = speak ? speakerFor() : null;
      if (!speaker) settleOrb();
      setBusy(true);
      clearActions();
      const g = group("user");
      const shots = drawShots(g, pictures.map((a) => a.url));
      const mine = message ? bubble(g, message) : shots;
      const said = { role: "user", content: message, at: Date.now() };
      session.messages.push(said);
      const reply = herReply(group("assistant"));
      Object.assign(reply, { mine, said });
      reply.busy(pictures.length ? "在看图…" : "");
      let images = [];
      try {
        streaming = new AbortController(); // 传图的时候点「停」也算数
        images = pictures.length ? await uploadAll(pictures, streaming.signal) : [];
      } catch (e) {
        // 图没传上去：这一句当没发过，字和图放回输入框
        g.remove();
        reply.g.remove();
        session.messages.splice(session.messages.indexOf(said), 1);
        if (!input.value.trim()) input.value = message;
        attachments = pictures.concat(attachments);
        drawAttachments();
        fitInput();
        if (!stopped(e)) note(calm(e));
        setBusy(false);
        return;
      }
      try {
        said.images = images.map((id) => ({ id, url: "/api/uploads/" + id }));
        const result = await stream(
          "/api/chat/stream",
          { message, images, conversation_id: session.id, spoken: !!speaker },
          replyView(reply, speaker),
        );
        finish(reply, result);
        if (speaker) speaker.end(result.reply);
      } catch (e) {
        fail(reply, e);
        if (speaker) speaker.cancel();
      } finally {
        setBusy(false);
        // 开口说的那轮不弹键盘
        if (!speaker) input.focus();
      }
    }

    async function checkHealth() {
      try {
        if (!(await ensureSignedIn())) return false;
        const res = await fetch("/api/health", { credentials: "include", headers: authHeaders() });
        const data = await res.json();
        herIssue = data.claude_issue || "";
        setStatus("");
        if (!data.has_openai_api_key) {
          note("缺少 OPENAI_API_KEY：在 .env 里填好后，双击 Friday.cmd 重开。");
          return false;
        }
        return true;
      } catch (e) {
        note("连不上 Friday：电脑上的服务开着吗？云上打开 friday-jimmy.fly.dev。");
        return false;
      }
    }

    function fitInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (mediaRecorder && mediaRecorder.state === "recording") return;
      // 圆按钮是「停」：停下正在回答的这一轮、或者正在念的
      if (sendBtn.dataset.state === "stop") {
        if (streaming) streaming.abort();
        if (orbState === "speaking") {
          stopSpeaking();
          settleOrb();
        }
        return;
      }
      const message = input.value.trim();
      // 圆按钮是麦克风：切到「按住 说话」
      if (!message && !attachments.length) {
        setMode(true);
        return;
      }
      const images = attachments;
      attachments = [];
      drawAttachments();
      input.value = "";
      fitInput();
      ask(message, { images });
    });

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      addFiles([...fileInput.files]);
      fileInput.value = "";
    });
    // 截图直接 Ctrl+V 粘进来
    input.addEventListener("paste", (e) => {
      const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter((f) => f.type.startsWith("image/"));
      if (!files.length) return;
      e.preventDefault();
      addFiles(files);
    });
    // 图拖到窗口里任何地方
    const hasFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
    document.addEventListener("dragover", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      document.body.classList.add("dropping");
    });
    document.addEventListener("dragleave", (e) => {
      if (!e.relatedTarget) document.body.classList.remove("dropping");
    });
    document.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      document.body.classList.remove("dropping");
      addFiles([...e.dataTransfer.files]);
    });

    micBtn.addEventListener("click", () => {
      if (orbState === "speaking" && !form.classList.contains("voice")) {
        stopSpeaking();
        settleOrb();
        return;
      }
      setMode(!form.classList.contains("voice"));
    });
    holdBtn.addEventListener("pointerdown", startHold);
    holdBtn.addEventListener("pointermove", moveHold);
    holdBtn.addEventListener("pointerup", (e) => { if (press && e.pointerId === press.id) endHold(); });
    holdBtn.addEventListener("pointercancel", () => {
      if (!press) return;
      press.cancel = true;
      endHold();
    });
    holdBtn.addEventListener("contextmenu", (e) => e.preventDefault());
    // 键盘：在「按住 说话」上按住空格说，松开发
    holdBtn.addEventListener("keydown", (e) => {
      if (e.key !== " " || e.repeat || press) return;
      startHold({ preventDefault: () => e.preventDefault(), pointerId: -1, clientY: 0 });
    });
    holdBtn.addEventListener("keyup", (e) => { if (e.key === " " && press) endHold(); });
    // 退到后台就把麦克风关掉；回来按住时再开
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") closeMic(); });
    try {
      if (localStorage.getItem(MODE_KEY) === "voice") {
        form.classList.add("voice");
      }
    } catch (e) {}


    input.addEventListener("input", () => {
      fitInput();
      syncSend();
    });

    // 中文输入法选词时的回车不算发送
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        // 回车只管发：空的时候不切到说话，她在回答时也不打断她
        if (sendBtn.dataset.state === "send") form.requestSubmit();
      }
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = unlockInput.value.trim();
      if (!t) return;
      try {
        await loginWithPassword(t);
        unlockInput.value = "";
        showUnlock(false);
        await boot();
      } catch (err) {
        unlockInput.value = "";
        unlockInput.placeholder = (err && err.message) || "密码不对";
        unlockInput.focus();
      }
    });

    document.addEventListener("visibilitychange", onReturn);
    window.addEventListener("focus", onReturn);

    (async () => {
      await boot();
      // 从「会快到了」的提醒点进来：开场之后直接准备
      if (pendingAsk && ready) {
        const message = pendingAsk;
        pendingAsk = "";
        await ask(message);
      }
    })();
  </script>
</body>
</html>
