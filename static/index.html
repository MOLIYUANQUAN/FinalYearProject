<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Friday</title>
  <link rel="icon" href="/static/icon.svg?v=ring1" type="image/svg+xml" />
  <link rel="icon" href="/static/icon-32.png?v=ring1" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png?v=ring1" />
  <link rel="manifest" href="/static/manifest.json?v=ring1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #000000;
      --soft: #3a3a3c;
      --muted: #8e8e93;
      --line: #d2d2d7;
      --panel: #ffffff;
      --accent: #000000;
      --brand: #000000;
      --on-brand: #ffffff;
      --focus-line: #000000;
      --focus-ring: rgba(0, 0, 0, 0.08);
      --danger: #ff3b30;
      --danger-bg: #fff2f1;
      --danger-line: #ffc4c0;
      --user: #f2f2f7;
      --radius: 14px;
      /* iPhone 上就是 SF；Windows 用近黑体。品牌感靠黑白与字距，不靠花色 */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      --mono: "SF Mono", ui-monospace, "Cascadia Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --soft: #d1d1d6;
        --muted: #8e8e93;
        --line: #2c2c2e;
        --panel: #000000;
        --accent: #f5f5f7;
        --brand: #f5f5f7;
        --on-brand: #000000;
        --focus-line: #f5f5f7;
        --focus-ring: rgba(255, 255, 255, 0.12);
        --danger: #ff453a;
        --danger-bg: #1c0504;
        --danger-line: #5c1a16;
        --user: #1c1c1e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: max(22px, env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.045em;
    }
    .right {
      display: flex;
      align-items: baseline;
      gap: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 400;
    }
    #newChat {
      font: inherit;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #newChat:hover { color: var(--ink); }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 8px 2px 10px;
      transition: padding-bottom 0.3s ease;
    }
    /* 白环出来时给最后一句让位 */
    #log.voice { padding-bottom: 108px; }
    .msg {
      max-width: 88%;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      padding: 10px 14px;
      border-radius: var(--radius);
    }
    .msg.bot {
      align-self: flex-start;
      background: transparent;
      border: none;
      padding: 2px 0;
    }
    .msg.error {
      align-self: stretch;
      max-width: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-line);
      color: var(--danger);
      padding: 10px 13px;
      border-radius: var(--radius);
    }
    .msg a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .msg.today {
      align-self: stretch;
      max-width: none;
      padding: 4px 0 8px;
      white-space: normal;
      border: none;
      background: transparent;
    }
    .today .hello {
      margin-bottom: 14px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .today section + section { margin-top: 14px; }
    .today section.attention {
      margin-bottom: 4px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .today section.attention h3 { color: var(--ink); letter-spacing: 0.04em; }
    .today .why {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .today h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .today .row {
      display: grid;
      grid-template-columns: 6.6em minmax(0, 1fr);
      column-gap: 10px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .today time {
      color: var(--soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .today .row.now time { color: var(--ink); font-weight: 600; }
    .today .tag {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .today .where {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .today .empty {
      margin: 0;
      padding: 3px 0;
      color: var(--muted);
    }
    .today .say {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      font-size: 1.05rem;
      letter-spacing: -0.015em;
    }
    .today .say:empty { display: none; }
    .today .say.failed { color: var(--danger); }
    @media (prefers-reduced-motion: no-preference) {
      .msg {
        animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .msg.user { animation-name: rise-user; }
      .today > * {
        animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .today > *:nth-child(2) { animation-delay: 0.04s; }
      .today > *:nth-child(3) { animation-delay: 0.08s; }
      .today > *:nth-child(4) { animation-delay: 0.12s; }
      .today > *:nth-child(5) { animation-delay: 0.16s; }
      .today section.attention {
        animation: attention-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes rise-user {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes attention-in {
        from { opacity: 0; transform: translateY(8px); filter: blur(2px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .fresh { animation: fresh 0.45s ease-out both; }
      @keyframes fresh { from { opacity: 0; } }
    }
    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.22;
      animation: pulse 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.14s; }
    .typing i:nth-child(3) { animation-delay: 0.28s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.18; transform: translateY(0) scale(0.9); }
      40% { opacity: 0.85; transform: translateY(-3px) scale(1); }
    }
    .hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .actions { margin-top: 12px; display: flex; gap: 8px; }
    .actions button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--brand);
      background: var(--brand);
      color: var(--on-brand);
      cursor: pointer;
      touch-action: manipulation;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .actions .hint { margin-left: 0; }
    .details {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      white-space: normal;
    }
    .details summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      opacity: 0.55;
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary:hover { opacity: 1; color: var(--ink); }
    form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      color: var(--ink);
    }
    #input:focus {
      border-color: var(--focus-line);
      background: var(--panel);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    #mic, #send {
      font: inherit;
      font-weight: 600;
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }
    #mic {
      position: relative;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    #mic:hover { border-color: var(--ink); }
    #mic.recording {
      background: var(--brand);
      color: var(--on-brand);
      border-color: var(--brand);
    }
    #mic:disabled, #send:disabled { opacity: 0.35; cursor: default; }
    #send { transition: opacity 0.2s ease, transform 0.15s ease; }
    #send:active:not(:disabled), #mic:active:not(:disabled) { transform: scale(0.97); }
    /* 白环跟着真实的声音起伏：你说话时听麦克风，她说话时听她自己；点一下就停 */
    #orb {
      --l: 0;
      position: fixed;
      left: 50%;
      bottom: calc(108px + env(safe-area-inset-bottom, 0px));
      width: 72px;
      height: 72px;
      margin-left: -36px;
      opacity: 0;
      transform: translateY(16px) scale(0.6);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }
    #orb.on { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
    #orb b, #orb i { position: absolute; inset: 0; border-radius: 50%; }
    #orb b {
      background: radial-gradient(closest-side, var(--ink), transparent);
      opacity: calc(0.12 + var(--l) * 0.33);
      transform: scale(calc(1.1 + var(--l) * 0.9));
    }
    #orb i {
      border: 2px solid var(--ink);
      background: var(--bg);
      transform: scale(calc(0.88 + var(--l) * 0.2));
    }
    #orb.thinking b { animation: halo-breathe 1.8s ease-in-out infinite; }
    #orb.thinking i { animation: ring-breathe 1.8s ease-in-out infinite; }
    @keyframes ring-breathe { 50% { transform: scale(0.97); } }
    @keyframes halo-breathe { 50% { opacity: 0.3; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) {
      #orb, #orb b, #orb i { transition: opacity 0.3s ease; transform: none; }
      #orb.thinking b, #orb.thinking i { animation: none; }
    }
    #send {
      background: var(--brand);
      color: var(--on-brand);
    }
    #unlock {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #unlock.visible { display: flex; }
    #unlock p { margin: 0; color: var(--soft); line-height: 1.55; }
    #unlock form { display: flex; gap: 8px; }
    #unlock input {
      flex: 1;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--user);
      color: var(--ink);
      outline: none;
    }
    #unlock button {
      font: inherit;
      font-weight: 600;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--on-brand);
      touch-action: manipulation;
    }
    @media (max-width: 520px) {
      main { gap: 12px; }
      header h1 { font-size: 1.4rem; }
      #newChat { min-height: 44px; padding: 0 4px; }
      .msg { max-width: 94%; }
      .today .row { grid-template-columns: 5.2em minmax(0, 1fr); }
      #input { font-size: 16px; min-height: 48px; }
      #mic, #send { min-width: 3.6rem; min-height: 48px; padding: 0 14px; }
      .actions { flex-wrap: wrap; }
      .actions button { min-height: 44px; flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Friday</h1>
      <div class="right">
        <span id="today"></span>
        <button type="button" id="newChat">新对话</button>
      </div>
    </header>

    <div id="unlock" aria-live="polite">
      <p>输入一次密码，之后这台设备会记住你。</p>
      <form id="unlockForm">
        <input id="unlockInput" type="password" autocomplete="current-password" placeholder="密码" />
        <button type="submit">进入</button>
      </form>
    </div>

    <div id="log" role="log" aria-live="polite"></div>
    <div id="orb" aria-hidden="true" title="点一下停"><b></b><i></i></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="问我，或者告诉我一件事" autocomplete="off" enterkeyhint="send"></textarea>
      <button id="mic" type="button" aria-label="说话" title="点一下开始说，再说完点一下">说</button>
      <button id="send" type="submit">发送</button>
    </form>
  </main>

  <script>
    const STORE_KEY = "pa.session.v1";
    const ACCESS_KEY = "pa.access"; // 旧版曾把密码存在本机；登录后清掉
    const IDLE_MS = 2 * 60 * 60 * 1000;
    const CARD_FRESH_MS = 15 * 60 * 1000;
    const HISTORY_LIMIT = 20;
    const HINTS = {
      get_calendar_events: "看日历",
      create_calendar_event: "写日历",
      search_emails: "翻邮件",
      read_email: "读邮件",
      send_email: "发邮件",
      modify_email: "整理邮件",
      search_files: "找笔记",
      read_file: "读笔记",
      search_memory: "回想",
      remember_fact: "记下",
      forget_fact: "忘掉",
      note_friction: "记下",
      list_friction: "翻反馈",
      resolve_friction: "划掉",
      fix_friction_with_cursor: "改代码",
      preview_pending_ship: "看改动",
      ship_pending_fix: "部署",
      add_task: "记下",
      complete_task: "划掉",
    };

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const micBtn = document.getElementById("mic");
    const todayEl = document.getElementById("today");
    const newChatBtn = document.getElementById("newChat");
    const unlockEl = document.getElementById("unlock");
    const unlockForm = document.getElementById("unlockForm");
    const unlockInput = document.getElementById("unlockInput");

    let session = null;
    let busy = false;
    let ready = false;
    let pendingPassword = ""; // 桌面 ?access= 或旧 localStorage，登录后清掉
    let mediaRecorder = null;
    let mediaStream = null;
    let recordChunks = [];
    let recordTimer = null;
    const RECORD_MAX_MS = 60 * 1000;

    (function takeAccessFromUrl() {
      try {
        const legacy = sessionStorage.getItem(ACCESS_KEY);
        if (legacy && !localStorage.getItem(ACCESS_KEY)) {
          localStorage.setItem(ACCESS_KEY, legacy);
          sessionStorage.removeItem(ACCESS_KEY);
        }
        const u = new URL(location.href);
        const t = u.searchParams.get("access");
        if (t) {
          pendingPassword = t;
          u.searchParams.delete("access");
          history.replaceState({}, "", u.pathname + u.search + u.hash);
        } else {
          pendingPassword = localStorage.getItem(ACCESS_KEY) || sessionStorage.getItem(ACCESS_KEY) || "";
        }
      } catch (e) {}
    })();

    function clearStoredPassword() {
      pendingPassword = "";
      try {
        localStorage.removeItem(ACCESS_KEY);
        sessionStorage.removeItem(ACCESS_KEY);
      } catch (e) {}
    }

    function authHeaders(extra) {
      return Object.assign({}, extra || {});
    }

    function showUnlock(on) {
      unlockEl.classList.toggle("visible", !!on);
      form.style.display = on ? "none" : "";
      if (on) unlockInput.focus();
    }

    async function loginWithPassword(password) {
      const res = await fetch("/api/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || "密码不对。");
      }
      clearStoredPassword();
      return true;
    }

    async function ensureSignedIn() {
      if (pendingPassword) {
        try {
          await loginWithPassword(pendingPassword);
          showUnlock(false);
          return true;
        } catch (e) {
          clearStoredPassword();
        }
      }
      const res = await fetch("/api/session", { credentials: "include" });
      const data = await res.json().catch(() => ({}));
      if (!data.access_required || data.signed_in) {
        showUnlock(false);
        return true;
      }
      showUnlock(true);
      return false;
    }

    function freshSession() {
      const now = Date.now();
      return { startedAt: now, lastActiveAt: now, messages: [] };
    }

    // 同一天、两小时内回来算同一次会话；否则重新开场
    function expired(s) {
      const sameDay = new Date(s.startedAt).toDateString() === new Date().toDateString();
      return !sameDay || Date.now() - s.lastActiveAt > IDLE_MS;
    }

    // 只看了开场、还没聊：开场过了一刻钟就换成此刻的
    function onlyStaleOpener(s) {
      const [first, ...rest] = s.messages;
      return !rest.length && !!first && first.role === "assistant" && Date.now() - (first.at || 0) > CARD_FRESH_MS;
    }

    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!s || !Array.isArray(s.messages) || expired(s)) return null;
        return s;
      } catch (e) {
        return null;
      }
    }

    function saveSession() {
      session.lastActiveAt = Date.now();
      try { localStorage.setItem(STORE_KEY, JSON.stringify(session)); } catch (e) {}
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 模型偶尔仍会输出 Markdown：只做最小渲染，其余按纯文本显示
    function render(text) {
      return escapeHtml(text || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^(\s*)[-*•]\s+/gm, "$1· ")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (text != null) div.innerHTML = render(text);
      logEl.appendChild(div);
      scrollDown();
      return div;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    // 卡片上的安排是服务端读到的原样数据，不经过模型；返回写那句判断的位置
    function drawToday(div, card) {
      div.className = "msg bot today";
      div.replaceChildren(el("div", "hello", card.hello));
      if (card.error) div.append(el("p", "empty", card.error));
      const needs = card.attention || [];
      if (needs.length) {
        const box = el("section", "attention");
        const head = el("h3");
        head.append(el("span", "", "需要你"));
        head.append(el("span", "", needs.length + " 件"));
        box.append(head);
        for (const row of needs) {
          const line = el("div", "row");
          const what = el("div", "what", row.title);
          if (row.why) what.append(el("span", "why", row.why));
          if (row.where) what.append(el("span", "where", row.where));
          line.append(el("time", "", row.time || ""), what);
          box.append(line);
        }
        div.append(box);
      }
      for (const section of card.sections || []) {
        const box = el("section");
        // 空的日子只占一行、退到后面；版面留给真要去的事
        const head = el("h3");
        head.append(el("span", "", section.label));
        const side = section.rows.length ? section.meta : section.empty;
        if (side) head.append(el("span", "", side));
        box.append(head);
        for (const row of section.rows) {
          const line = el("div", row.now ? "row now" : "row");
          const what = el("div", "what", row.title);
          if (row.now) what.append(el("span", "tag", "进行中"));
          if (row.where) what.append(el("span", "where", row.where));
          line.append(el("time", "", row.time), what);
          box.append(line);
        }
        div.append(box);
      }
      const say = el("div", "say");
      div.append(say);
      return say;
    }

    function showTyping(div, hint) {
      div.innerHTML =
        '<span class="typing"><i></i><i></i><i></i></span>' +
        (hint ? '<span class="hint">' + escapeHtml(hint) + "</span>" : "");
    }

    // 新写出来的字淡入，不是整段刷新；写完再换成排好版的全文
    function appendFresh(target, chunk) {
      if (target.querySelector(".typing")) target.textContent = "";
      target.append(el("span", "fresh", chunk));
    }

    function addDetails(div, tools) {
      const d = document.createElement("details");
      d.className = "details";
      const s = document.createElement("summary");
      s.textContent = "细节";
      const body = document.createElement("div");
      body.textContent = tools.join(" → ");
      d.append(s, body);
      div.appendChild(d);
    }

    function addConfirm(div) {
      const bar = document.createElement("div");
      bar.className = "actions";
      [
        ["确认", "确认", false],
        ["取消", "取消，先不要执行。", true],
      ].forEach(([label, message, secondary]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (secondary) b.className = "secondary";
        b.onclick = () => ask(message);
        bar.appendChild(b);
      });
      div.appendChild(bar);
    }

    // 记下或划掉的待办不先问他，只在下面放一个「撤销」：直接撤回，不经过模型
    function addUndo(div, m) {
      const bar = el("div", "actions");
      const b = el("button", "secondary", "撤销");
      b.type = "button";
      b.onclick = async () => {
        b.disabled = true;
        try {
          const res = await fetch("/api/undo", {
            method: "POST",
            credentials: "include",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ items: m.undo }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            showUnlock(true);
            throw new Error("需要重新登录。");
          }
          if (!res.ok) throw new Error(data.detail || "没撤销成功。");
          m.undone = true;
          m.content += "（已撤销）";
          saveSession();
          bar.replaceChildren(el("span", "hint", "已撤销"));
        } catch (e) {
          bar.replaceChildren(el("span", "hint", (e && e.message) || String(e)));
        }
      };
      bar.append(b);
      div.appendChild(bar);
    }

    function clearActions() {
      logEl.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    function renderSession() {
      logEl.innerHTML = "";
      session.messages.forEach((m, i) => {
        const div = addMessage(m.role === "user" ? "user" : "bot", m.agenda ? null : m.content);
        if (m.agenda) drawToday(div, m.agenda).innerHTML = render(m.content);
        if (m.tools && m.tools.length) addDetails(div, m.tools);
        const last = i === session.messages.length - 1;
        if (m.needsConfirm && last) addConfirm(div);
        if (m.undo && m.undo.length && !m.undone && last) addUndo(div, m);
      });
      scrollDown();
    }

    function awaitingConfirmation() {
      const last = session.messages[session.messages.length - 1];
      return !!(last && last.role === "assistant" && last.needsConfirm);
    }

    // view.el 是正在写字的位置；开场的卡片到了以后它会换成卡片里那句判断
    async function stream(url, payload, view) {
      const res = await fetch(url, {
        method: "POST",
        credentials: "include",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload || {}),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showUnlock(true);
          throw new Error("需要登录才能聊。");
        }
        if (res.status === 404) {
          throw new Error("本地服务还是旧版本：双击 Friday.cmd 重开，再刷新这页。");
        }
        throw new Error(data.detail || "请求失败：" + res.status);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let result = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;
          const ev = JSON.parse(frame.slice(6));
          if (ev.type === "agenda") {
            view.onAgenda(ev);
            scrollDown();
          } else if (ev.type === "delta") {
            text += ev.text;
            appendFresh(view.el, ev.text);
            if (view.onText) view.onText(text);
            scrollDown();
          } else if (ev.type === "tool") {
            text = "";
            if (view.onTool) view.onTool();
            showTyping(view.el, HINTS[ev.name]);
          } else if (ev.type === "done") {
            result = { reply: ev.reply || text, tools: ev.tools_called || [], undo: ev.undo || [] };
          } else if (ev.type === "error") {
            throw new Error(ev.message);
          }
        }
      }
      if (!result) throw new Error("连接断了，再试一次。");
      return result;
    }

    function finish(div, reply, tools, undo = []) {
      div.innerHTML = render(reply);
      const needsConfirm = tools.includes("request_user_confirmation");
      const m = { role: "assistant", content: reply, tools, needsConfirm, undo };
      if (tools.length) addDetails(div, tools);
      if (needsConfirm) addConfirm(div);
      if (undo.length) addUndo(div, m);
      session.messages.push(m);
      saveSession();
      scrollDown();
    }

    function fail(div, err) {
      div.className = "msg error";
      div.textContent = (err && err.message) || String(err);
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on;
      if (!mediaRecorder || mediaRecorder.state !== "recording") micBtn.disabled = on;
    }

    // ---- 声音：你说话时听麦克风；她一句写完就念一句；白环跟着真实的响度起伏 ----
    const orbEl = document.getElementById("orb");
    const voiceOut = new Audio();
    const SENTENCE_STOPS = "。！？!?；;…\n";
    const ENVELOPE_HZ = 50; // 她的声音每 20ms 记一个响度
    const levelBuf = new Uint8Array(1024);
    let audioCtx = null;
    let micSource = null;
    let micAnalyser = null;
    let voiceEnv = null; // 正在念的这句的响度曲线
    let speechTurn = 0; // 每次打断 +1：上一轮没念完的句子作废
    let speechQueue = []; // 排着队的句子：每句一个 Promise<{url, env}>
    let speechPlaying = false;
    let speechOpen = false; // 这一轮还在写，后面可能还有句子
    let clipWatch = 0;
    let orbState = "";
    let orbLevel = 0;
    let orbFrame = 0;
    let orbHide = 0;

    function audioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    // 均方根响度 → 0–1；开平方让轻声也有起伏
    function toLevel(rms) {
      return Math.min(1, Math.sqrt(Math.max(0, rms - 0.01)) * 2.2);
    }

    function micLevel() {
      if (!micAnalyser) return 0;
      micAnalyser.getByteTimeDomainData(levelBuf);
      let sum = 0;
      for (const v of levelBuf) sum += ((v - 128) / 128) ** 2;
      return toLevel(Math.sqrt(sum / levelBuf.length));
    }

    function voiceLevel(now) {
      if (voiceOut.paused) return 0;
      if (!voiceEnv) return 0.35 + 0.25 * Math.sin(now / 150) * Math.sin(now / 410);
      return toLevel(voiceEnv[Math.floor(voiceOut.currentTime * ENVELOPE_HZ)] || 0);
    }

    function orbTick(now) {
      const target = orbState === "listening" ? micLevel() : orbState === "speaking" ? voiceLevel(now) : 0;
      // 起得快、落得慢，像呼吸
      orbLevel += (target - orbLevel) * (target > orbLevel ? 0.5 : 0.12);
      orbEl.style.setProperty("--l", orbLevel.toFixed(3));
      orbFrame = orbState || orbLevel > 0.01 ? requestAnimationFrame(orbTick) : 0;
    }

    function orbSet(state) {
      clearTimeout(orbHide);
      orbState = state;
      orbEl.className = state ? "on " + state : "";
      logEl.classList.toggle("voice", !!state);
      if (state) setTimeout(scrollDown, 320);
      if (state && !orbFrame) orbFrame = requestAnimationFrame(orbTick);
    }

    // 这一轮全说完才收起白环；句子之间的停顿不收
    function settleOrb() {
      if (orbState === "listening" || speechPlaying || speechQueue.length || speechOpen) return;
      clearTimeout(orbHide);
      orbHide = setTimeout(() => orbSet(""), 350);
    }

    // 手机 Safari 只让「点过的」播放器出声：第一次点麦克风时先放 0.1 秒静音
    function unlockVoice() {
      const ctx = audioContext();
      if (!voiceOut.src) {
        voiceOut.src = silentWav();
        voiceOut.play().catch(() => {});
      }
      return ctx;
    }

    function silentWav() {
      const samples = 800;
      const bytes = new Uint8Array(44 + samples).fill(128); // 8-bit PCM，128 是静音
      const view = new DataView(bytes.buffer);
      const tag = (at, s) => [...s].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)));
      tag(0, "RIFF");
      view.setUint32(4, 36 + samples, true);
      tag(8, "WAVEfmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 8000, true);
      view.setUint32(28, 8000, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      tag(36, "data");
      view.setUint32(40, samples, true);
      return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    }

    // 解出这句的响度曲线给白环用；声音本身照常由播放器放，不经过 Web Audio
    async function envelopeOf(blob) {
      const ctx = audioContext();
      if (!ctx) return null;
      try {
        const data = (await ctx.decodeAudioData(await blob.arrayBuffer())).getChannelData(0);
        const step = Math.round(ctx.sampleRate / ENVELOPE_HZ);
        const env = new Float32Array(Math.ceil(data.length / step));
        for (let i = 0; i < env.length; i++) {
          const end = Math.min(data.length, (i + 1) * step);
          let sum = 0;
          for (let j = i * step; j < end; j++) sum += data[j] * data[j];
          env[i] = Math.sqrt(sum / (end - i * step));
        }
        return env;
      } catch (e) {
        return null;
      }
    }

    function fetchSpeech(text) {
      return fetch("/api/voice/speak", {
        method: "POST",
        credentials: "include",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ text }),
      })
        .then((res) => (res.ok ? res.blob() : null))
        .then(async (blob) => (blob ? { url: URL.createObjectURL(blob), env: await envelopeOf(blob) } : null))
        .catch(() => null);
    }

    function enqueueSpeech(text, turn) {
      const clean = text.trim();
      if (turn !== speechTurn || !/[\p{L}\p{N}]/u.test(clean)) return;
      speechQueue.push(fetchSpeech(clean));
      playNextSpeech();
    }

    async function playNextSpeech() {
      if (speechPlaying) return;
      const next = speechQueue.shift();
      if (!next) return settleOrb();
      speechPlaying = true;
      const turn = speechTurn;
      const clip = await next;
      if (turn !== speechTurn) {
        if (clip) URL.revokeObjectURL(clip.url);
        return;
      }
      if (!clip) {
        speechPlaying = false;
        return playNextSpeech();
      }
      voiceEnv = clip.env;
      voiceOut.src = clip.url;
      orbSet("speaking");
      voiceOut.play().catch(() => {
        if (turn === speechTurn) doneSpeaking();
      });
      // 播放器卡住不报 ended 时，照这句的真实长度往下走，白环不会一直挂着
      const seconds = clip.env ? clip.env.length / ENVELOPE_HZ : 20;
      clipWatch = setTimeout(() => {
        if (turn === speechTurn) doneSpeaking();
      }, seconds * 1000 + 3000);
    }

    function doneSpeaking() {
      clearTimeout(clipWatch);
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
      voiceEnv = null;
      speechPlaying = false;
      playNextSpeech();
    }

    voiceOut.addEventListener("ended", doneSpeaking);

    function stopSpeaking() {
      clearTimeout(clipWatch);
      speechTurn += 1;
      for (const p of speechQueue) p.then((clip) => clip && URL.revokeObjectURL(clip.url));
      speechQueue = [];
      speechOpen = false;
      speechPlaying = false;
      voiceEnv = null;
      if (!voiceOut.paused) voiceOut.pause();
      if (voiceOut.src.startsWith("blob:")) URL.revokeObjectURL(voiceOut.src);
    }

    function sentenceEnd(text, from) {
      for (let i = from; i < text.length; i++) {
        const stop = SENTENCE_STOPS.includes(text[i]) || (text[i] === "." && /\s/.test(text[i + 1] || ""));
        if (stop && text.slice(from, i + 1).trim().length >= 4) return i + 1;
      }
      return -1;
    }

    // 一句写完就送去念，不等整段写完
    function speakerFor() {
      let turn = speechTurn;
      let text = "";
      let said = 0;
      speechOpen = true;
      const close = () => {
        if (turn === speechTurn) speechOpen = false;
        settleOrb();
      };
      return {
        feed(full) {
          text = full;
          for (let end = sentenceEnd(text, said); end > 0; end = sentenceEnd(text, said)) {
            enqueueSpeech(text.slice(said, end), turn);
            said = end;
          }
        },
        // 她去查工具了：之前写的字屏幕上会换掉，念到一半的也一起作废，免得同一件事说两遍
        reset() {
          if (turn !== speechTurn) return;
          stopSpeaking();
          turn = speechTurn;
          speechOpen = true;
          text = "";
          said = 0;
          orbSet("thinking");
        },
        end(reply) {
          enqueueSpeech((text || reply || "").slice(said), turn);
          close();
        },
        cancel: close,
      };
    }

    function pickMime() {
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      for (const t of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function setRecording(on) {
      micBtn.classList.toggle("recording", !!on);
      micBtn.textContent = on ? "完" : "说";
      micBtn.title = on ? "说完了，点一下发送" : "点一下开始说，再说完点一下";
      sendBtn.disabled = !!on || busy;
    }

    function releaseMic() {
      if (recordTimer) {
        clearTimeout(recordTimer);
        recordTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      mediaRecorder = null;
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      micAnalyser = null;
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      recordChunks = [];
      setRecording(false);
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("这浏览器不能录音。换 Chrome / Edge，或用 HTTPS 打开。");
      }
      stopSpeaking();
      const ctx = unlockVoice();
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (ctx) {
        micSource = ctx.createMediaStreamSource(mediaStream);
        micAnalyser = ctx.createAnalyser();
        micAnalyser.fftSize = levelBuf.length;
        micSource.connect(micAnalyser);
      }
      const mime = pickMime();
      mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
      recordChunks = [];
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size) recordChunks.push(e.data);
      };
      mediaRecorder.start();
      setRecording(true);
      orbSet("listening");
      recordTimer = setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") stopRecordingAndSend();
      }, RECORD_MAX_MS);
    }

    function stopRecordingAndSend() {
      if (!mediaRecorder || mediaRecorder.state !== "recording") return;
      const recorder = mediaRecorder;
      const mime = recorder.mimeType || "audio/webm";
      orbSet("thinking");
      recorder.onstop = async () => {
        const blob = new Blob(recordChunks, { type: mime });
        releaseMic();
        if (!blob.size) {
          orbSet("");
          addMessage("error", "没录到声音。");
          return;
        }
        setBusy(true);
        try {
          const formData = new FormData();
          const ext = mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
          formData.append("file", blob, "speech." + ext);
          const res = await fetch("/api/voice/transcribe", {
            method: "POST",
            credentials: "include",
            body: formData,
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.detail || "没听清。");
          const text = (data.text || "").trim();
          if (!text) throw new Error("没听清，再说一遍？");
          setBusy(false);
          await ask(text, { speak: true });
        } catch (e) {
          setBusy(false);
          addMessage("error", (e && e.message) || String(e));
        }
        settleOrb();
      };
      try {
        recorder.stop();
      } catch (e) {
        releaseMic();
        orbSet("");
      }
    }

    async function toggleMic() {
      if (mediaRecorder && mediaRecorder.state === "recording") return stopRecordingAndSend();
      if (busy) return;
      try {
        await startRecording();
      } catch (e) {
        releaseMic();
        orbSet("");
        addMessage("error", (e && e.message) || "打不开麦克风。");
      }
    }

    async function presence() {
      setBusy(true);
      const div = addMessage("bot");
      showTyping(div);
      const view = {
        el: div,
        card: null,
        onAgenda(card) {
          view.card = card;
          view.el = drawToday(div, card);
          showTyping(view.el);
        },
      };
      try {
        const { reply } = await stream("/api/presence/stream", {}, view);
        if (!view.card) {
          finish(div, reply, []);
          return;
        }
        view.el.innerHTML = render(reply);
        session.messages.push({ role: "assistant", content: reply, tools: [], agenda: view.card, at: Date.now() });
        saveSession();
        scrollDown();
      } catch (e) {
        if (!view.card) {
          fail(div, e);
          return;
        }
        // 安排已经在了：那句判断没出来，就在卡片里说一声，卡片照样留着
        view.el.classList.add("failed");
        view.el.textContent = (e && e.message) || String(e);
        session.messages.push({ role: "assistant", content: "", tools: [], agenda: view.card, at: Date.now() });
        saveSession();
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function startOver() {
      stopSpeaking();
      settleOrb();
      setBusy(true);
      session = freshSession();
      saveSession();
      logEl.innerHTML = "";
      ready = await checkHealth();
      setBusy(false);
      if (ready) await presence();
    }

    // 叫回窗口：光标回到输入框；放久了，开场换成此刻的；否则趁他打字先把日历读好
    async function onReturn() {
      if (document.visibilityState !== "visible" || busy || !session) return;
      input.focus();
      if (!ready || expired(session) || onlyStaleOpener(session)) await startOver();
      else fetch("/api/calendar/warm", { method: "POST", credentials: "include", headers: authHeaders() }).catch(() => {});
    }

    // 他打字说「听听你的声音」也要念出来，不只点「说」才开口
    function wantsVoice(text) {
      return /听听|听你|你的声音|念给|读给|说两句|说句话|hear (your )?voice|speak (to me|up)|say something/i.test(text || "");
    }

    async function ask(message, opts) {
      if (busy || !ready) return;
      stopSpeaking();
      const speak = !!(opts && opts.speak) || wantsVoice(message);
      const speaker = speak ? speakerFor() : null;
      if (!speaker) settleOrb();
      setBusy(true);
      clearActions();
      const pending = awaitingConfirmation();
      const history = session.messages
        .filter((m) => m.content && m.content.trim())
        .slice(-HISTORY_LIMIT)
        .map((m) => ({ role: m.role, content: m.content }));
      addMessage("user", message);
      session.messages.push({ role: "user", content: message });
      saveSession();
      const div = addMessage("bot");
      showTyping(div);
      const view = { el: div };
      if (speaker) {
        view.onText = (text) => speaker.feed(text);
        view.onTool = () => speaker.reset();
      }
      try {
        const { reply, tools, undo } = await stream(
          "/api/chat/stream",
          { message, history, pending_confirmation: pending, spoken: !!speaker },
          view,
        );
        finish(div, reply, tools, undo);
        if (speaker) speaker.end(reply);
      } catch (e) {
        fail(div, e);
        if (speaker) speaker.cancel();
      } finally {
        setBusy(false);
        // 开口说的那轮不弹键盘
        if (!speaker) input.focus();
      }
    }

    async function checkHealth() {
      try {
        if (!(await ensureSignedIn())) return false;
        const res = await fetch("/api/health", { credentials: "include", headers: authHeaders() });
        const data = await res.json();
        if (data.now_label) todayEl.textContent = data.now_label;
        if (!data.has_openai_api_key) {
          addMessage("error", "缺少 OPENAI_API_KEY：在 .env 里填好后，双击 Friday.cmd 重开。");
          return false;
        }
        return true;
      } catch (e) {
        addMessage("error", "连不上 Friday：电脑上的服务开着吗？云上打开 friday-jimmy.fly.dev。");
        return false;
      }
    }

    function fitInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (mediaRecorder && mediaRecorder.state === "recording") return;
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      fitInput();
      ask(message);
    });

    micBtn.addEventListener("click", () => { toggleMic(); });

    orbEl.addEventListener("click", () => {
      if (orbState === "listening") stopRecordingAndSend();
      else if (orbState === "speaking") {
        stopSpeaking();
        settleOrb();
      }
    });

    input.addEventListener("input", fitInput);

    // 中文输入法选词时的回车不算发送
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    newChatBtn.addEventListener("click", () => {
      if (!busy) startOver();
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = unlockInput.value.trim();
      if (!t) return;
      try {
        await loginWithPassword(t);
        unlockInput.value = "";
        showUnlock(false);
        await startOver();
      } catch (err) {
        unlockInput.value = "";
        unlockInput.placeholder = (err && err.message) || "密码不对";
        unlockInput.focus();
      }
    });

    document.addEventListener("visibilitychange", onReturn);
    window.addEventListener("focus", onReturn);

    (async () => {
      session = loadSession();
      if (session && session.messages.length && !onlyStaleOpener(session)) {
        renderSession();
        ready = await checkHealth();
        if (ready) input.focus();
      } else {
        await startOver();
      }
    })();
  </script>
</body>
</html>
